---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: lakes.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: Lake
    listKind: LakeList
    plural: lakes
    singular: lake
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.postgresInstances
      name: DB
      type: string
    - jsonPath: .status.schemaPhase
      name: Schema
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lake is the Schema for the lakes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Lake
            properties:
              args:
                description: Args passed to the image's entrypoint. Empty runs the
                  image as built.
                items:
                  type: string
                type: array
              dnsSecretRef:
                description: |-
                  DNSSecretRef, if set together with Host, creates a proxied Cloudflare DNS record (Host -> the
                  ingress LoadBalancer) using the Cloudflare credentials (keys `token`, `zoneID`) in the named
                  Secret. The Secret must live in spec.namespace (the CloudflareDNSRecord is created there) and
                  hold the zone ID of Host's zone: a lake.live host needs a lake.live-zone Secret, not the
                  oramadev.net one the Zetta clusters use.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              host:
                description: |-
                  Host is the domain name the lake is exposed at (e.g. hello.lake.live) when IngressEnabled is
                  true. Requires an ingress controller (class nginx).
                type: string
              image:
                description: |-
                  Image for the lake binary. Required: there is no production default. The
                  sample CR points at an HTTP echo until the lake image exists.
                minLength: 1
                type: string
              ingressEnabled:
                default: false
                description: |-
                  IngressEnabled gates external HTTP exposure of the lake Service. When true AND Host is set, the
                  operator provisions an nginx Ingress at Host (the whole host proxies to the lake Service) and,
                  if DNSSecretRef is also set, a proxied Cloudflare DNS record (Host -> the ingress LoadBalancer).
                  When false (the default) no Ingress or DNS record is created, and any previously created are
                  torn down, even if Host is still set. Host names the endpoint; this bool is the on/off switch.
                  Same contract as OramaZettaCluster.
                type: boolean
              namespace:
                default: lake-dev
                description: Namespace the lake workloads are deployed into. Created
                  if missing.
                type: string
              port:
                default: 4900
                description: |-
                  Port the container listens on; the Service exposes it on 80. Default 4900, lake's own
                  default (--listen 0.0.0.0:4900). The hello-world echo stand-in overrides it to 5678.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              postgres:
                description: |-
                  Postgres is lake's control plane: a CloudNativePG Cluster the operator provisions in
                  spec.namespace, the same path OramaCloudV1 uses for its control DB (requires the
                  CloudNativePG operator, see the helmfile). CNPG generates the `lake-<name>-controldb-app`
                  Secret (owner credentials + connection URI); the lake pods receive it as
                  LAKE_CONTROL_DB_URI. Zetta is the data plane and is provisioned separately.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled provisions the CNPG Cluster. Default true. Setting it false tears the cluster
                      down (disable is not "leave running"), which deletes its data.
                    type: boolean
                  instances:
                    default: 1
                    description: Instances is the CNPG instance count (1 = single
                      primary; 2+ adds streaming replicas).
                    format: int32
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: StorageClassName for the PVCs; empty = the cluster
                      default.
                    type: string
                  storageSize:
                    default: 50Gi
                    description: |-
                      StorageSize is the per-instance PVC size. Default 50Gi: a Lake is a production control plane,
                      and CNPG grows a PVC in place when the StorageClass allows expansion, so start with headroom.
                    type: string
                type: object
              pullSecretName:
                description: |-
                  PullSecretName, if set, is attached to the lake pods as an imagePullSecret. Needed for a
                  private spec.image (oramasearch/lake is private). The Secret must exist in spec.namespace.
                type: string
              replicas:
                default: 1
                description: Replicas of the lake Deployment.
                format: int32
                minimum: 0
                type: integer
            required:
            - image
            type: object
          status:
            description: status defines the observed state of Lake
            properties:
              phase:
                description: 'Phase is a coarse summary in the operator''s vocabulary:
                  Progressing, Ready, Degraded.'
                type: string
              postgresInstances:
                description: PostgresInstances is ready/desired for the CNPG Cluster,
                  e.g. "1/1"; empty when disabled.
                type: string
              postgresReady:
                description: PostgresReady is true once the control-plane CNPG Cluster
                  has at least one ready instance.
                type: boolean
              readyReplicas:
                description: ReadyReplicas mirrors the Deployment's ready replicas.
                format: int32
                type: integer
              schemaPhase:
                description: 'SchemaPhase mirrors the owned PostgresSchema: Pending
                  | Applying | Applied | Failed.'
                type: string
              schemaVersion:
                description: SchemaVersion is the applied schema's content hash (sha256:<12
                  hex>), from the PostgresSchema.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
