---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oramazettaclusters.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: OramaZettaCluster
    listKind: OramaZettaClusterList
    plural: oramazettaclusters
    shortNames:
    - ozc
    singular: oramazettacluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyNodes
      name: Nodes
      type: string
    - jsonPath: .status.totalNodes
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.image
      name: Image
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OramaZettaCluster deploys a headless Orama Zetta cluster (a StatefulSet of equal-peer CRDT nodes)
          from one CR. Peer replication is TCP 7777 (mTLS unless clusterPlaintext); the HTTP API (MCP + REST
          oramasearch/orama-bridge docs/projects/one-orama.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OramaZettaClusterSpec describes a headless Orama Zetta cluster — N equal-peer CRDT nodes.
              Step 1 of the One Orama plan (orama-bridge#130): the operator only *runs* Zetta headless; the
              bi-directional operator↔Zetta symbiosis (Zetta as the operator's datastore) is a later stage.
            properties:
              clusterName:
                description: |-
                  ClusterName is the GLOBAL Zetta cluster name. A Zetta cluster can span multiple k8s clusters; each
                  k8s cluster's OramaZettaCluster CR is a SLICE of it, and CRs sharing this name are SIBLINGS — equal
                  peers in one multi-leader cluster (operator#71). Empty = a standalone cluster named after the CR.
                type: string
              clusterPlaintext:
                default: false
                description: |-
                  ClusterPlaintext disables inter-node mTLS (the peers join without a token). Convenient inside a
                  single trusted namespace (+ a NetworkPolicy); leave false to use the generated join-token Secret.
                type: boolean
              dnsSecretRef:
                description: |-
                  DNSSecretRef, if set together with Host, creates a proxied Cloudflare DNS record (Host → the
                  ingress LoadBalancer) using the Cloudflare credentials (token/zoneID/accountID) in the named
                  Secret — normally the same `cloudflare-api-token` Secret the OramaCloudV1 uses.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              exposePeerLoadBalancer:
                default: false
                description: |-
                  ExposePeerLoadBalancer creates a LoadBalancer Service for the peer port (:7777) so nodes in OTHER
                  k8s clusters can dial this cluster from outside (cross-cloud siblings) — the way to reach an
                  AKS/EKS/GKE node whose pod/node IPs aren't routable from the peer's network. The cloud provisions a
                  public IP; put `<ip>:7777` in a sibling's spec.externalPeers. NOTE: peer traffic is then plaintext
                  over the public internet when clusterPlaintext is set — only do this on a trusted path until the
                  mTLS join token (oramasearch/zetta#670) lands. Default false.
                type: boolean
              externalPeers:
                description: |-
                  ExternalPeers are peer addresses (`host:port`) of sibling nodes in OTHER k8s clusters (or bare
                  hosts) — the route table (operator#70). Each is appended as a `--peer` flag so this node's nodes
                  dial them and join the shared Zetta cluster. Zetta is the mesh (gossip relays transitively), so a
                  connected dial-graph is enough; NAT'd nodes just list a reachable sibling here.
                items:
                  type: string
                type: array
              host:
                description: |-
                  Host, if set, exposes the cluster's HTTP API (:4800 — MCP + REST + serving, the Zetta UI) via an
                  Ingress at this hostname (e.g. zetta.oramadev.net). Requires an ingress controller.
                type: string
              hostNetwork:
                default: false
                description: |-
                  HostNetwork runs the node pods on the host network, so the peer (:7777) + API (:4800) ports are
                  reachable at the k8s node's own address — the simplest way to make a node dialable by siblings in
                  other clusters (esp. a single-node cluster). When replicas>1, the nodes pack onto the shared
                  host(s) with per-ordinal ports (node-n listens on 7777+n / 4800+n) and seed off node-0 on the host
                  loopback — correct for a single big host / single-node k8s cluster. Default false.
                type: boolean
              image:
                default: oramasearch/zetta:headless-v1-sandbox
                description: Image is the Zetta-headless container image (built like
                  the other components → private Docker Hub).
                type: string
              mcpTokenAuth:
                default: false
                description: |-
                  MCPTokenAuth provisions a 64-char bearer token (Secret `<name>-zetta-mcp`) and requires it on
                  the node's MCP + REST surface (`--mcp-token`).

                  DEFAULT false — because Zetta's `--mcp-token` treats the token as an *access-key id* that must
                  already be a provisioned principal with grants. A bare operator-minted token currently passes
                  the bearer check but is then denied EVERY capability call ("unknown access key — denied"), for
                  both REST `/v1/*` and MCP `tools/call` — so turning this on makes the node authenticate but do
                  nothing. Leave it off (the node runs as the functional unauthenticated-local session) until the
                  node can seed the configured bearer as an owner key (oramasearch/zetta#733). When true, the
                  operator still won't expose a working session — only enable it once you also provision a
                  matching access key.
                type: boolean
              provisionOperatorSchema:
                default: true
                description: |-
                  ProvisionOperatorSchema makes this cluster the operator's own datastore (One Orama symbiosis v0):
                  once the node is up, the operator applies its control-plane + data-plane schema to it — the
                  `orama_control` database (the operator's registry: components, reconcile_events) and the
                  `orama_data` database (the application data landing zone: documents) — via Zetta's `/v1/sql`.
                  Idempotent (tolerates "already exists"; Zetta has no IF NOT EXISTS). Default true.
                type: boolean
              pullSecretName:
                description: PullSecretName lets the pods pull a private zetta image.
                type: string
              replicas:
                default: 1
                description: Replicas is the number of equal-peer headless zetta nodes.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: 'Resources caps each node (mem/cpu) — right-sizing (see
                  the operator''s principle #8).'
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              storage:
                description: |-
                  Storage sizes the per-node PVC mounted at the node's --data-dir (the CRDT doc, node_id, certs,
                  and JSONL/large-object data). Each node keeps its identity across restarts via this volume.
                properties:
                  size:
                    default: 10Gi
                    description: Size of the per-node PVC (e.g. "10Gi").
                    type: string
                  storageClassName:
                    description: StorageClassName for the per-node PVCs (empty = the
                      cluster default StorageClass).
                    type: string
                type: object
            type: object
          status:
            description: OramaZettaClusterStatus is the observed state of the cluster.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              phase:
                description: 'Phase: Progressing | Ready | Degraded.'
                type: string
              readyNodes:
                description: ReadyNodes is the number of ready zetta pods.
                format: int32
                type: integer
              totalNodes:
                description: TotalNodes is the desired node count.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
