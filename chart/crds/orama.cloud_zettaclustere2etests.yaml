---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: zettaclustere2etests.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: ZettaClusterE2ETest
    listKind: ZettaClusterE2ETestList
    plural: zettaclustere2etests
    shortNames:
    - ozce2e
    singular: zettaclustere2etest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef
      name: Target
      type: string
    - jsonPath: .spec.levels
      name: Levels
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.pass
      name: Pass
      type: integer
    - jsonPath: .status.fail
      name: Fail
      type: integer
    - jsonPath: .status.skip
      name: Skip
      type: integer
    - jsonPath: .status.jobName
      name: Job
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZettaClusterE2ETest runs the live-cluster zetta e2e suite as a Kubernetes Job against a deployed
          OramaZettaCluster and reports pass/fail in status. A separate CRD so a test is a first-class,
          repeatable resource — the operator never runs suites during normal reconcile. The suite itself
          lives in the zetta repo (tests/e2e/zetta-e2e.sh) and is baked into the runner image, so it stays
          in lockstep with the engine; this CRD only triggers it and wires the cluster addressing via env.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZettaClusterE2ETestSpec describes an e2e test run against
              a deployed OramaZettaCluster.
            properties:
              image:
                default: oramasearch/zetta-e2e:v1-sandbox
                description: |-
                  Image is the RUNNER image that carries the e2e script (tests/e2e/zetta-e2e.sh, baked into
                  the image; its ENTRYPOINT runs the script). Unlike the OramaCloudV1 suite (embedded in the
                  operator), the Zetta suite lives in the zetta repo and ships in this image so it evolves with
                  the engine. Default is the pinned sandbox runner.
                type: string
              levels:
                default: 2,3
                description: Levels selects which test levels the script runs (ZETTA_E2E_LEVELS).
                  Default "2,3".
                type: string
              pullSecretName:
                description: PullSecretName lets the Job pull a private test image.
                type: string
              targetRef:
                description: |-
                  TargetRef is the name of the OramaZettaCluster to test (same namespace) — the controller
                  points the test at that cluster's per-pod headless DNS (node-0 as the writer, ordinals
                  1..replicas-1 as the read peers).
                type: string
            required:
            - targetRef
            type: object
          status:
            description: ZettaClusterE2ETestStatus is the observed state of a test
              run.
            properties:
              fail:
                description: Fail is the number of failed assertions parsed (best-effort)
                  from the Job's pod logs.
                format: int32
                type: integer
              jobName:
                type: string
              message:
                type: string
              pass:
                description: |-
                  Pass is the number of passed assertions parsed (best-effort) from the Job's pod logs
                  (`Zetta e2e: pass=N fail=N skip=N`). 0 until the Job is terminal and the summary is readable.
                format: int32
                type: integer
              phase:
                description: 'Phase: Pending | Running | Succeeded | Failed.'
                type: string
              skip:
                description: Skip is the number of skipped assertions parsed (best-effort)
                  from the Job's pod logs.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
