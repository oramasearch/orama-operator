---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakee2etests.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: LakeE2ETest
    listKind: LakeE2ETestList
    plural: lakee2etests
    shortNames:
    - lakee2e
    singular: lakee2etest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.target
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.pass
      name: Pass
      type: integer
    - jsonPath: .status.fail
      name: Fail
      type: integer
    - jsonPath: .status.skip
      name: Skip
      type: integer
    - jsonPath: .status.jobName
      name: Job
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LakeE2ETest runs lake's end-to-end suite (the oramasearch/lake-e2e runner) as a Kubernetes Job
          against a deployed Lake, usually a LakeSet member, and reports each run's pass, fail and skip
          counts with the reasons. Changing the spec (spec.runID) runs it again.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired test run.
            properties:
              env:
                description: |-
                  Env adds environment variables to the runner, e.g. LAKE_E2E_CLERK_SECRET_KEY from a Secret
                  for a Lake that signs people in with Clerk, or LAKE_E2E_GROUPS to run part of the suite.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              image:
                description: |-
                  Image is the runner, oramasearch/lake-e2e at an immutable tag. Its entrypoint runs every
                  Lake feature as a fresh test person (REST, MCP and a headless browser) and prints one
                  result line per step and a final `Lake e2e: pass=N fail=N skip=N`.
                minLength: 1
                type: string
              member:
                description: |-
                  Member is the LakeSet member to test, the usual target: the testing member is the testing ->
                  staging gate of a substantial lake release. The controller refuses a Lake of that name that
                  the set does not manage. Exactly one of member and targetRef is set.
                properties:
                  lakeSet:
                    description: LakeSet is the set's name, e.g. lake-nonprod.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the member's name, e.g. testing. It is also
                      the Lake's name on this cluster.
                    minLength: 1
                    type: string
                required:
                - lakeSet
                - name
                type: object
              pullSecretName:
                description: |-
                  PullSecretName authenticates the runner image pull. When empty, the controller reuses the
                  target Lake's spec.pullSecretName. The Secret must exist in the Lake namespace.
                type: string
              runID:
                description: |-
                  RunID names a run. Changing it (or anything else in spec) runs the suite again in a new Job,
                  without deleting this resource; the previous run's Job is kept until a newer run finishes.
                type: string
              targetRef:
                description: |-
                  TargetRef is the name of a cluster-scoped Lake to test that no set manages. Exactly one of
                  member and targetRef is set.
                type: string
              timeoutSeconds:
                description: TimeoutSeconds bounds one run (the Job's activeDeadlineSeconds).
                  Default 3 hours.
                format: int64
                minimum: 60
                type: integer
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: set exactly one of targetRef and member
              rule: has(self.targetRef) != has(self.member)
          status:
            description: status defines the observed test run.
            properties:
              completedAt:
                format: date-time
                type: string
              fail:
                format: int32
                type: integer
              failed:
                description: Failed lists the steps that failed, with their reasons
                  (at most 50).
                items:
                  description: LakeE2ETestStep is one step that did not pass, with
                    the runner's reason.
                  properties:
                    reason:
                      description: Reason is why it failed or was skipped.
                      type: string
                    step:
                      description: Step is the step's id, e.g. repositories.liquid-push.
                      type: string
                  required:
                  - step
                  type: object
                type: array
              jobName:
                description: JobName is the namespaced Job running the latest run.
                type: string
              lakeRevision:
                description: LakeRevision is the revision of the Lake the run tested,
                  as its server_info reported it.
                type: string
              message:
                description: Message explains the current phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the latest
                  run was started for.
                format: int64
                type: integer
              pass:
                description: Pass, Fail and Skip count the latest run's steps, read
                  from the runner's result.
                format: int32
                type: integer
              phase:
                description: Phase is Pending, Running, Succeeded, or Failed.
                type: string
              runID:
                description: RunID is the LAKE_E2E_RUN_ID of the latest run.
                type: string
              skip:
                format: int32
                type: integer
              skipped:
                description: Skipped lists the steps that were skipped, with their
                  reasons (at most 50).
                items:
                  description: LakeE2ETestStep is one step that did not pass, with
                    the runner's reason.
                  properties:
                    reason:
                      description: Reason is why it failed or was skipped.
                      type: string
                    step:
                      description: Step is the step's id, e.g. repositories.liquid-push.
                      type: string
                  required:
                  - step
                  type: object
                type: array
              startedAt:
                description: StartedAt and CompletedAt bound the latest run.
                format: date-time
                type: string
              target:
                description: Target is the Lake the latest run tests.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
