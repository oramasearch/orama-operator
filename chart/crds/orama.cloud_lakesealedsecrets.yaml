---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakesealedsecrets.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: LakeSealedSecret
    listKind: LakeSealedSecretList
    plural: lakesealedsecrets
    shortNames:
    - lss
    singular: lakesealedsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template.name
      name: Secret
      type: string
    - jsonPath: .spec.source.type
      name: Source
      type: string
    - jsonPath: .status.kid
      name: KID
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LakeSealedSecret is ciphertext or a lake reference delivered
          into a Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LakeSealedSecretSpec defines one-way secret delivery into
              a Kubernetes Secret.
            properties:
              data:
                additionalProperties:
                  type: string
                description: |-
                  Data maps Secret data keys to base64-encoded canonical CBOR envelopes. It is required for a
                  literal source and omitted for lake and dynamic sources.
                type: object
              lakeRef:
                description: LakeRef names the cluster-scoped Lake that owns the sealing
                  key and lake endpoint.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              source:
                description: Source selects ciphertext, a lake reference, a dynamic
                  lease, or an environment delivery.
                properties:
                  delivery:
                    description: |-
                      Delivery binds a namespace-local owner to an environment and its validated source.
                      Only the environment controller creates these resources.
                    properties:
                      environment:
                        description: Environment names the LakeEnvironment that authorizes
                          the delivery.
                        minLength: 1
                        type: string
                      name:
                        description: Name names the original LakeSealedSecret in that
                          environment's secretRefs.
                        minLength: 1
                        type: string
                    required:
                    - environment
                    - name
                    type: object
                  dynamic:
                    description: Dynamic asks lake to mint or renew a leased secret.
                    properties:
                      engine:
                        description: Engine names the configured lake dynamic-secret
                          engine.
                        minLength: 1
                        type: string
                      role:
                        description: Role names the least-privilege engine role.
                        minLength: 1
                        type: string
                      ttl:
                        description: TTL is the requested lease duration.
                        format: duration
                        type: string
                    required:
                    - engine
                    - role
                    - ttl
                    type: object
                  lake:
                    description: Lake references a static secret stored by lake.
                    properties:
                      mount:
                        description: Mount identifies the lake secret mount.
                        minLength: 1
                        type: string
                      name:
                        description: Name identifies the secret within the mount.
                        minLength: 1
                        type: string
                      version:
                        description: Version pins an immutable version. Omitted selects
                          the current version.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - mount
                    - name
                    type: object
                  type:
                    description: Type selects literal, lake, dynamic, or operator-managed
                      environment delivery.
                    enum:
                    - literal
                    - lake
                    - dynamic
                    - delivery
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: literal source cannot include lake or dynamic configuration
                  rule: self.type != 'literal' || (!has(self.lake) && !has(self.dynamic))
                - message: lake source requires only lake configuration
                  rule: self.type != 'lake' || (has(self.lake) && !has(self.dynamic))
                - message: dynamic source requires only dynamic configuration
                  rule: self.type != 'dynamic' || (has(self.dynamic) && !has(self.lake))
                - message: only delivery sources may include delivery configuration
                  rule: 'self.type == ''delivery'' ? (has(self.delivery) && !has(self.lake)
                    && !has(self.dynamic)) : !has(self.delivery)'
              template:
                description: Template describes the Kubernetes Secret to produce in
                  this resource's namespace.
                properties:
                  name:
                    description: Name is the produced Secret name and the name bound
                      into envelope AAD.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  type:
                    description: Type is the produced Kubernetes Secret type. Empty
                      means Opaque.
                    type: string
                required:
                - name
                type: object
            required:
            - lakeRef
            - source
            - template
            type: object
            x-kubernetes-validations:
            - message: lakeRef.name is required
              rule: size(self.lakeRef.name) > 0
            - message: literal sources require sealed data
              rule: self.source.type != 'literal' || (has(self.data) && size(self.data)
                > 0)
            - message: only literal sources may include data
              rule: self.source.type == 'literal' || !has(self.data) || size(self.data)
                == 0
            - message: lake sources require source.lake
              rule: self.source.type != 'lake' || has(self.source.lake)
            - message: dynamic sources require source.dynamic
              rule: self.source.type != 'dynamic' || has(self.source.dynamic)
            - message: delivery sources require source.delivery
              rule: self.source.type != 'delivery' || has(self.source.delivery)
          status:
            description: LakeSealedSecretStatus reports delivery state without exposing
              plaintext.
            properties:
              conditions:
                description: Conditions contains the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kid:
                description: KID is the key that opened the delivered record set.
                type: string
              lease:
                description: Lease is present for dynamic sources.
                properties:
                  expiresAt:
                    description: ExpiresAt is the lease expiry reported by lake.
                    format: date-time
                    type: string
                  id:
                    description: ID is lake's opaque lease identifier.
                    type: string
                  renewAt:
                    description: RenewAt is when the operator will renew before expiry.
                    format: date-time
                    type: string
                required:
                - expiresAt
                - id
                - renewAt
                type: object
              mintedAt:
                description: |-
                  MintedAt is the last successful delivery from lake for a lake source. An unpinned lake source
                  is delivered again every refresh interval, so a new secret version reaches the Secret.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the resource generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, or Error.
                type: string
              unsealedAt:
                description: UnsealedAt is the last successful Secret update.
                format: date-time
                type: string
              version:
                description: Version is the lake secret version the Secret holds,
                  for a lake source.
                format: int64
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
