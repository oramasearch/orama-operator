                  Cloudflare keeps Cloudflare as the edge / geo load-balancer; the operator
                  reconciles CF resources (DNS records, worker routes) via the CF API based on
                  this config — provisioning/deprovisioning as components change.
                properties:
                  apiTokenSecretRef:
                    description: |-
                      APITokenSecretRef references a Secret holding ALL of the operator's Cloudflare
                      credentials as three keys: `token` (the API token), `zoneID`, and `accountID`. Keeping
                      the zone + account IDs in the same Secret as the token means all Cloudflare config lives
                      in one place (never split between the CR spec and a Secret, and never in the CR itself).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  enabled:
                    default: true
                    description: |-
                      Enabled defaults true — the operator manages Cloudflare by default. Set false
                      only to opt this cluster out of operator-managed CF (rare).
                    type: boolean
                  manageDNS:
                    default: true
                    description: 'ManageDNS: create/update DNS records pointing at
                      this cluster''s ingress.'
                    type: boolean
                  manageLoadBalancers:
                    default: true
                    description: |-
                      ManageLoadBalancers: reconcile Cloudflare Load Balancing — geo-steered pools
                      across the regional clusters + health checks. This is the geo load-balancer.
                    type: boolean
                  manageWorkerRoutes:
                    description: |-
                      ManageWorkerRoutes: reconcile CF Worker routes for any workers kept on CF
                      rather than the in-cluster bundle.
                    type: boolean
                type: object
              components:
                description: |-
                  Components toggles + configures each part of the stack. Any component can be
                  enabled/disabled independently.
