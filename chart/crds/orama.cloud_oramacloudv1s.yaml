                      type: string
                  required:
                  - name
                  type: object
                type: array
              profile:
                default: light
                description: |-
                  Profile applies a preset group of replication + sizing defaults, overridable
                  per component:
                    light  = no replication, single-cluster / dev
                    medium = single-tenant dedicated (prod) settings
                    heavy  = multi-tenant prod
                enum:
                - light
                - medium
                - heavy
                type: string
              region:
                description: Region selects this cluster's role in the multi-region
                  topology.
                properties:
                  name:
                    description: Name is a human label for this region (e.g. "us-east",
                      "eu", "ap").
                    type: string
                  role:
                    default: primary
                    description: |-
                      Role is "primary" (runs the write path + stateful stores) or "read"
                      (regional read tier that points at the primary via .spec.peers).
                    enum:
                    - primary
                    - read
                    type: string
                required:
                - name
                - role
                type: object
            required:
            - region
            type: object
          status:
            description: OramaCloudV1Status is the observed state.
            properties:
              componentsReady:
                description: ComponentsReady counts reconciled/ready child components.
                type: string
              conditions:
                description: Conditions follows the standard k8s condition convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: 'Phase: Pending | Provisioning | Ready | Degraded.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
