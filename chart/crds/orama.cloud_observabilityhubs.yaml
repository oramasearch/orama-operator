---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: observabilityhubs.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: ObservabilityHub
    listKind: ObservabilityHubList
    plural: observabilityhubs
    shortNames:
    - obshub
    singular: observabilityhub
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .status.purpose
      name: Purpose
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ObservabilityHub is one purpose's observability hub on one cluster: the UI, sign-in and cluster
          registry the agents report to, and the alert routing of every cluster of that purpose. Reconciled
          on the managing cluster, which writes the provider's concrete kind onto the hub's cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObservabilityHubSpec is where one purpose's observability
              lives.
            properties:
              adminEmail:
                description: |-
                  AdminEmail is the hub administrator's sign-in. The operator generates the password and keeps
                  it in Secret pixie-admin on the hub's cluster.
                maxLength: 200
                pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
                type: string
              alerting:
                description: Alerting routes the alerts of the hub's cluster and of
                  every agent's cluster.
                properties:
                  receivers:
                    description: Receivers get every alert of their severities, from
                      the hub's cluster and every agent's.
                    items:
                      description: AlertReceiver is where an alert is delivered. Exactly
                        one of slack and webhook is set.
                      properties:
                        name:
                          description: Name is the receiver's name in Alertmanager.
                          maxLength: 40
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        severities:
                          description: Severities are the alert severities delivered
                            here. Empty means critical and warning.
                          items:
                            enum:
                            - critical
                            - warning
                            - info
                            type: string
                          type: array
                        slack:
                          description: Slack posts to an incoming webhook.
                          properties:
                            channel:
                              description: Channel overrides the webhook's default
                                channel.
                              maxLength: 80
                              type: string
                            urlSecretRef:
                              description: |-
                                URLSecretRef holds the incoming webhook URL. It is copied to each cluster that routes alerts
                                here under the production-credential rules (docs/crd-reference.md).
                              properties:
                                key:
                                  minLength: 1
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                                namespace:
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              - namespace
                              type: object
                          required:
                          - urlSecretRef
                          type: object
                        webhook:
                          description: Webhook posts Alertmanager's JSON to a URL,
                            for a pager or an on-prem system.
                          properties:
                            urlSecretRef:
                              description: ObservabilitySecretKeyRef names one key
                                of a Secret on the managing cluster.
                              properties:
                                key:
                                  minLength: 1
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                                namespace:
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              - namespace
                              type: object
                          required:
                          - urlSecretRef
                          type: object
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: a receiver is exactly one of slack and webhook
                        rule: has(self.slack) != has(self.webhook)
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - receivers
                type: object
              clusterRef:
                description: |-
                  ClusterRef is the KubernetesCluster the hub runs on. Empty means the managing cluster itself,
                  which is where production's hub runs: it serves production agents. A nonprod cluster's hub
                  serves nonprod agents. A hub on a production cluster, or on one with any other purpose, is
                  refused. Immutable.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: clusterRef is immutable
                  rule: self == oldSelf
              domain:
                description: |-
                  Domain is the host name people reach the hub's UI under (the UI and its sign-in use it and
                  work.<domain>). The operator does not create its DNS record or expose it publicly.
                maxLength: 200
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
              imagePullSecretRef:
                description: |-
                  ImagePullSecretRef is a registry credentials Secret on the managing cluster, copied to the
                  hub's cluster under the production-credential rules. Give each cluster its own.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              metricsRetention:
                default: 30d
                description: |-
                  MetricsRetention is how long the hub keeps the metrics it federates from its clusters
                  (Prometheus duration: 30d, 12w).
                pattern: ^[0-9]+(h|d|w|y)$
                type: string
              organization:
                description: |-
                  Organization is the one organisation every agent's cluster is registered under, and which
                  the hub's administrator belongs to.
                maxLength: 50
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              providerRef:
                description: ProviderRef names the ObservabilityProvider whose release
                  the hub runs.
                minLength: 1
                type: string
              storage:
                description: Storage sizes the hub's durable stores.
                properties:
                  messaging:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Gi
                    description: Messaging is the NATS JetStream store.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  metrics:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100Gi
                    description: |-
                      Metrics is the hub Prometheus' volume, which keeps every agent cluster's federated metrics
                      for metricsRetention.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  postgres:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 20Gi
                    description: Postgres is the hub's control database (users, organisations,
                      clusters, deploy keys).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  search:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 20Gi
                    description: Search is the metadata search index (OpenSearch).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for every volume the hub claims.
                      Empty means the cluster's default.
                    type: string
                type: object
            required:
            - adminEmail
            - domain
            - imagePullSecretRef
            - organization
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: clusterRef is immutable
              rule: has(self.clusterRef) == has(oldSelf.clusterRef)
          status:
            description: ObservabilityHubStatus is what the managing cluster last
              read from the hub's cluster.
            properties:
              agents:
                items:
                  description: ObservabilityHubAgentStatus is one agent the hub accepted.
                  properties:
                    cluster:
                      description: Cluster is the agent's KubernetesCluster.
                      type: string
                    connected:
                      description: Connected is true while the agent's cluster is
                        registered and heartbeating.
                      type: boolean
                    metricsConnected:
                      description: MetricsConnected is true while the hub's Prometheus
                        reads the cluster's metrics.
                      type: boolean
                    name:
                      description: Name is the ObservabilityAgent's name.
                      type: string
                  required:
                  - cluster
                  - connected
                  - metricsConnected
                  - name
                  type: object
                type: array
              components:
                items:
                  description: ObservabilityComponentStatus is one deployable component's
                    readiness.
                  properties:
                    message:
                      description: Message says why it is not ready.
                      type: string
                    name:
                      type: string
                    ready:
                      description: Ready is true when every replica the component
                        wants is available.
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              concreteRef:
                description: ConcreteRef is the concrete resource on the hub's cluster,
                  Kind namespace/name.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Progressing, Ready, Degraded or Refused.
                type: string
              purpose:
                description: Purpose is the hub cluster's purpose tag; production
                  for the managing cluster.
                type: string
              ready:
                description: Ready is "n/total" of the hub's components.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
