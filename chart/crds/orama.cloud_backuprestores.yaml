---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: backuprestores.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: BackupRestore
    listKind: BackupRestoreList
    plural: backuprestores
    shortNames:
    - brestore
    singular: backuprestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backupName
      name: Backup
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupRestore restores one Backup into a datastore and verifies
          it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'BackupRestoreSpec is the desired state of a BackupRestore.
              It is immutable: a restore is one run.'
            properties:
              backupName:
                description: BackupName is the Backup restored, in this namespace.
                  It must have succeeded.
                minLength: 1
                type: string
              replaceSource:
                description: |-
                  ReplaceSource allows the target to be the very datastore the Backup was taken of (recovering it
                  in place after a loss). Without it such a restore is refused. Default false.
                type: boolean
              scratch:
                description: |-
                  Scratch marks the target as a scratch datastore for a rehearsal: once the restore has finished,
                  what it restored is removed (the databases a ClickHouse restore created, the keys of a Valkey
                  restore, a Cluster or claim the restore created), so the next rehearsal finds it empty.
                type: boolean
              target:
                description: |-
                  Target is the datastore restored into. Its kind must be the Backup's. It must hold none of the
                  backup's content: a restore never overwrites, and a kind whose restore creates the datastore
                  (a CloudNativePG Cluster, a volume claim) creates target.name, which must not exist yet.
                properties:
                  connectionSecretRef:
                    description: |-
                      ConnectionSecretRef names a Secret in the namespace with the datastore's connection: keys
                      `host` and `username` and `password`, and optionally `port` and `database`. The backup Job
                      reads it as environment variables; the operator never copies it. Required for the kinds whose
                      backup Job talks to the server (ClickHouse, Zetta, Valkey); the kinds whose own operator
                      takes the backup need none.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  kind:
                    description: Kind is the datastore's kind; it selects the backup
                      mechanism.
                    enum:
                    - Postgres
                    - ClickHouse
                    - Zetta
                    - Kafka
                    - Cassandra
                    - TiDB
                    - Valkey
                    - SQLite
                    - DuckDB
                    - Polars
                    - Volume
                    type: string
                  name:
                    description: |-
                      Name is the datastore's name in the namespace (its Service or resource name). It is part
                      of the default bucket path and labels each Backup.
                    minLength: 1
                    type: string
                  podSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      PodSelector selects the datastore's pods. While a backup or restore runs, the operator lets
                      those pods accept the run's pod, and, for a kind whose server writes to the bucket itself
                      (ClickHouse, TiDB, Cassandra), reach public HTTPS on 443 (operator#740). Empty means the
                      kind's default: the labels its operator puts on the pods of a datastore of this name.
                    type: object
                  volume:
                    description: |-
                      Volume is how a volume-backed datastore (Volume, SQLite, DuckDB, Polars; name is then the
                      volume claim) is read: the backup takes a CSI VolumeSnapshot of the claim, mounts a claim made
                      from it read-only in the backup Job, and copies its files to the bucket (operator#738,
                      operator#737).
                    properties:
                      runAsGroup:
                        format: int64
                        minimum: 1
                        type: integer
                      runAsUser:
                        description: |-
                          RunAsUser and RunAsGroup are the user and group the copy runs as, so it can read files only
                          their owner may: the workload's own. Default 65532.
                        format: int64
                        minimum: 1
                        type: integer
                      volumeSnapshotClassName:
                        description: |-
                          VolumeSnapshotClassName is the class of the snapshot the copy is made from. Empty means
                          lake-retain, the Retain class the platform layer installs.
                        type: string
                    type: object
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: connectionSecretRef is required for a ClickHouse, Zetta
                    or Valkey datastore
                  rule: '!(self.kind in [''ClickHouse'', ''Zetta'', ''Valkey'']) ||
                    has(self.connectionSecretRef)'
              verify:
                default: true
                description: Verify compares the restored content with the backup's
                  manifest. Default true.
                type: boolean
            required:
            - backupName
            - target
            type: object
            x-kubernetes-validations:
            - message: a BackupRestore's spec is immutable
              rule: self == oldSelf
          status:
            description: BackupRestoreStatus is the observed state of a BackupRestore.
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions: Complete (True once restored and, when asked, verified; False with the reason it is
                  waiting or failed).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              evidence:
                description: 'Evidence is what was compared: how many tables, keys
                  or files, and their totals.'
                type: string
              jobName:
                type: string
              message:
                description: Message is the outcome, in the words of whatever refused.
                type: string
              phase:
                description: BackupPhase is where a Backup is in its run.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              source:
                description: 'Source is where the restored backup is: s3://<bucket>/<path>/<backup>/.'
                type: string
              startTime:
                format: date-time
                type: string
              verified:
                description: Verified is true when the restored content matched the
                  backup's manifest.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
