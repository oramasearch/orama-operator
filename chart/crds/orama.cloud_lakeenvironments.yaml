---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakeenvironments.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: LakeEnvironment
    listKind: LakeEnvironmentList
    plural: lakeenvironments
    shortNames:
    - lakeenv
    singular: lakeenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.change
      name: Change
      type: string
    - jsonPath: .status.phase
      name: Ready
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LakeEnvironment materializes one desired deployment row into
          an isolated namespace and workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired environment.
            properties:
              change:
                description: Change is the immutable liquid change identifier being
                  deployed.
                minLength: 1
                type: string
              env:
                description: Env contains literal environment variables for the workload.
                items:
                  description: |-
                    LakeEnvironmentVariable is a literal environment variable supplied by a deployment record.
                    Secrets use SecretRefs and are delivered by LakeSealedSecret once operator #129 lands.
                  properties:
                    name:
                      description: Name is the environment variable name.
                      minLength: 1
                      type: string
                    value:
                      description: Value is the literal environment variable value.
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
              environment:
                description: Environment is the deployment environment name.
                minLength: 1
                type: string
              host:
                description: |-
                  Host is the exact public hostname for a named environment. Preview environments derive their
                  hostname from Change and the Lake's previewWildcard instead.
                type: string
              image:
                description: Image is an immutable OCI digest reference.
                pattern: ^.+@sha256:[a-f0-9]{64}$
                type: string
              kind:
                description: Kind selects a durable named environment or a per-change
                  preview.
                enum:
                - named
                - preview
                type: string
              lakeRef:
                description: LakeRef names the cluster-scoped Lake whose namespace
                  contains this resource.
                minLength: 1
                type: string
              port:
                description: Port is the container port exposed by the environment
                  Service.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                description: Replicas is the desired workload replica count.
                format: int32
                minimum: 1
                type: integer
              repository:
                description: Repository is the stable Lake repository identifier.
                minLength: 1
                type: string
              secretRefs:
                description: |-
                  SecretRefs names LakeSealedSecret resources in this resource's namespace. Delivery is
                  intentionally deferred to operator #129; a non-empty list keeps status Degraded until then.
                items:
                  type: string
                type: array
            required:
            - change
            - environment
            - image
            - kind
            - lakeRef
            - port
            - repository
            type: object
          status:
            description: Status defines the observed environment state.
            properties:
              conditions:
                description: Conditions contains the standard Ready condition and
                  failure details.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deploymentId:
                description: DeploymentID is the stable deployment-row identifier
                  materialized into this resource.
                type: string
              phase:
                description: Phase is Progressing, Ready, Degraded, or TornDown.
                type: string
              readyReplicas:
                description: ReadyReplicas mirrors the environment Deployment.
                format: int32
                type: integer
              url:
                description: URL is the public environment URL when ingress is configured.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
