    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudflareTunnel is a Tunnel carried by Cloudflare Tunnel in a customer's own Cloudflare account.
          A Tunnel whose provider is of type cloudflare creates and owns it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CloudflareTunnelSpec is one grant carried by Cloudflare Tunnel
              in the customer's own account.
            properties:
              customerId:
                description: CustomerID is Lake's immutable customer id.
                format: uuid
                type: string
              expiresAt:
                description: ExpiresAt ends the grant.
                format: date-time
                type: string
              grantId:
                description: GrantID is the immutable network_tunnel_grants row id.
                format: uuid
                type: string
