                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              providerRef:
                description: ProviderRef names the cloudflare TunnelProvider in this
                  namespace.
                minLength: 1
                type: string
              subject:
                description: Subject is the e-mail address Cloudflare Access admits,
                  and nobody else.
                minLength: 3
                type: string
              targetId:
                description: TargetID is the Lake id of the one service or app the
                  tunnel reaches.
                format: uuid
                type: string
              targetKind:
                description: TargetKind identifies the workload family selected by
                  TargetID.
                enum:
                - service
                - app
                type: string
              workspaceId:
                description: WorkspaceID is Lake's immutable workspace id.
                format: uuid
                type: string
