                type: string
              message:
                description: Message explains the phase.
                type: string
              phase:
                description: Phase is Pending, Ready, Expired or Failed.
                type: string
              tunnelId:
                description: TunnelID is the Cloudflare tunnel id.
                type: string
            type: object
