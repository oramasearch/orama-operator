apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "operator.fullname" . }}-control-plane-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "operator.fullname" . }}-control-plane-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ include "operator.fullname" . }}-control-plane-ca
  secretName: {{ include "operator.fullname" . }}-control-plane-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: {{ include "operator.fullname" . }}-control-plane-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "operator.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ include "operator.fullname" . }}-control-plane-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "operator.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "operator.fullname" . }}-control-plane-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - {{ include "operator.fullname" . }}-control-plane
    - {{ include "operator.fullname" . }}-control-plane.{{ .Release.Namespace }}
    - {{ include "operator.fullname" . }}-control-plane.{{ .Release.Namespace }}.svc
    - {{ include "operator.fullname" . }}-control-plane.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ include "operator.fullname" . }}-control-plane
    kind: Issuer
