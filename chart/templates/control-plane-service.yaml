apiVersion: v1
kind: Service
metadata:
  name: {{ include "operator.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: https
      appProtocol: https
      port: {{ .Values.controlPlane.service.port }}
      targetPort: control-plane
      protocol: TCP
