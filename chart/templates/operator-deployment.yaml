apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        {{- if .Values.clusterManagement.azureWorkloadIdentityClientID }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --leader-elect
            - --control-plane-bind-address=:{{ .Values.controlPlane.service.port }}
            {{- with .Values.lakeServices.sqliteImage }}
            - --lake-sqlite-image={{ . }}
            {{- end }}
            {{- with .Values.lakeServices.duckdbImage }}
            - --lake-duckdb-image={{ . }}
            {{- end }}
            {{- with .Values.lakeServices.polarsImage }}
            - --lake-polars-image={{ . }}
            {{- end }}
            - --zetta-tunnel-image={{ .Values.networking.zettaTunnelImage }}
            - --cloudflared-image={{ .Values.networking.cloudflaredImage }}
          ports:
            - name: control-plane
              containerPort: {{ .Values.controlPlane.service.port }}
              protocol: TCP
          env:
            - name: OPERATOR_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The container's memory limit in bytes; the operator gives the Go runtime a soft
            # limit below it (cmd/memory.go, operator#677).
            - name: OPERATOR_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: manager
                  resource: limits.memory
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
