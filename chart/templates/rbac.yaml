apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-manager
  labels: {{- include "operator.labels" . | nindent 4 }}
rules:
  # The operator manages the app stack. Mirror of the +kubebuilder:rbac markers
  # (`make manifests` → config/rbac/role.yaml) — the install-time union. Keep this in
  # sync when a CRD/reconciler is added (the SA is enforced in-cluster, unlike a local
  # `go run` with admin creds).
  - apiGroups: ["orama.cloud"]
    resources:
      - oramacloudv1s
      - oramazettaclusters
      - oramacloudv1e2etests
      - zettaclustere2etests
      - cloudflarednsrecords
      - cloudflarekvnamespaces
      - cloudflarer2buckets
      - cloudflareloadbalancers
    verbs: ["*"]
  - apiGroups: ["orama.cloud"]
    resources:
      - oramacloudv1s/status
      - oramazettaclusters/status
      - oramacloudv1e2etests/status
      - zettaclustere2etests/status
      - cloudflarednsrecords/status
      - cloudflarekvnamespaces/status
      - cloudflarer2buckets/status
      - cloudflareloadbalancers/status
      - oramacloudv1s/finalizers
      - oramazettaclusters/finalizers
      - cloudflarednsrecords/finalizers
      - cloudflarekvnamespaces/finalizers
      - cloudflarer2buckets/finalizers
      - cloudflareloadbalancers/finalizers
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["*"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["*"]
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations"]
    verbs: ["*"]
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  # Elastic capacity (operator#69): the operator OWNS a Karpenter NodePool for the Zetta cluster and
  # reads the provider NodeClasses/NodeClaims + cluster Nodes for the provisioned-node status count.
  # karpenter.{sh,k8s.aws,azure.com} may be absent (bare-metal / no autoscaler) — the reconciler
  # no-ops when the CRD is missing, and an RBAC grant for a non-existent apiGroup is harmless.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["*"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.k8s.aws"]
    resources: ["ec2nodeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.azure.com"]
    resources: ["aksnodeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Operator-owned Karpenter install (operator#75): server-side-apply the Karpenter CRDs + the
  # controller's ServiceAccount/RBAC/Deployment/Service/PDB. Creating RBAC that grants Karpenter's
  # (broad) permissions requires `bind` + `escalate` on roles/bindings (RBAC privilege-escalation
  # prevention) since the operator doesn't itself carry every node/pod grant. CRDs are applied but
  # never deleted (no `delete` — deleting a Karpenter CRD cascades to all NodePools/NodeClaims).
  # (ServiceAccounts/Deployments/Services/PDBs the install also creates are already granted above.)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-manager
  labels: {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# Leader-election Role — the manager runs with --leader-elect, which needs a Lease (+ events) in its
# own namespace. Namespaced (not cluster-wide) since the lock lives beside the manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
