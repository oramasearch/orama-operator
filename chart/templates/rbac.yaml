apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
  {{- if .Values.clusterManagement.azureWorkloadIdentityClientID }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.clusterManagement.azureWorkloadIdentityClientID | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-manager
  labels: {{- include "operator.labels" . | nindent 4 }}
rules:
  # The operator manages the app stack. Mirror of the +kubebuilder:rbac markers
  # (`make manifests` → config/rbac/role.yaml) — the install-time union. Keep this in
  # sync when a CRD/reconciler is added (the SA is enforced in-cluster, unlike a local
  # `go run` with admin creds).
  - apiGroups: ["orama.cloud"]
    resources:
      - oramacloudv1s
      - networksandboxes
      - connections
      - egressrules
      - tunnels
      - tunnelproviders
      - zettatunnels
      - cloudflaretunnels
      - peerconnections
      - peerlinks
      - oramazettaclusters
      - oramacloudv1e2etests
      - oramacloudv1migrations
      - zettaclustere2etests
      - cloudflarednsrecords
      - cloudflarekvnamespaces
      - cloudflarer2buckets
      - statuspages
      - cloudflareloadbalancers
      - rabbitmqtopologies
      - postgresschemas
      - backupschedules
      - backups
      - backuprestores
      - restorerehearsals
      - clerkapplications
      - lakes
      - lakee2etests
      - lakeenvironments
      - lakeapps
      - lakerestorerehearsals
      - lakesealedsecrets
      - kubernetesclusters
      - kubernetesclusterproviders
      - aksclusters
      - clusterhelmreleases
      - oramaoperators
      - lakesets
      - lakeordersources
      - oramacloudv1sets
      - edgeproviders
      - edgezonepolicies
      - cloudflarezonepolicies
      - edgehostpolicies
      - cloudflarehostpolicies
      - paymentproviders
      - paymentwebhookendpoints
      - stripewebhookendpoints
      - paymentcatalogs
      - stripecatalogs
      - observabilityproviders
      - observabilityhubs
      - observabilityagents
      - pixieclouds
      - pixieviziers
    verbs: ["*"]
  - apiGroups: ["orama.cloud"]
    resources:
      - oramacloudv1s/status
      - networksandboxes/status
      - connections/status
      - egressrules/status
      - tunnels/status
      - tunnelproviders/status
      - zettatunnels/status
      - cloudflaretunnels/status
      - peerconnections/status
      - peerlinks/status
      - oramazettaclusters/status
      - oramacloudv1e2etests/status
      - oramacloudv1migrations/status
      - oramacloudv1migrations/finalizers
      - zettaclustere2etests/status
      - cloudflarednsrecords/status
      - cloudflarekvnamespaces/status
      - cloudflarer2buckets/status
      - statuspages/status
      - cloudflareloadbalancers/status
      - rabbitmqtopologies/status
      - postgresschemas/status
      - lakes/status
      - lakee2etests/status
      - lakeenvironments/status
      - lakeapps/status
      - lakerestorerehearsals/status
      - lakesealedsecrets/status
      - oramacloudv1s/finalizers
      - connections/finalizers
      - egressrules/finalizers
      - tunnels/finalizers
      - zettatunnels/finalizers
      - cloudflaretunnels/finalizers
      - peerconnections/finalizers
      - peerlinks/finalizers
      - observabilityproviders/status
      - observabilityhubs/status
      - observabilityhubs/finalizers
      - observabilityagents/status
      - observabilityagents/finalizers
      - pixieclouds/status
      - pixieclouds/finalizers
      - pixieviziers/status
      - pixieviziers/finalizers
      - oramazettaclusters/finalizers
      - cloudflarednsrecords/finalizers
      - cloudflarekvnamespaces/finalizers
      - cloudflarer2buckets/finalizers
      - backupschedules/status
      - backups/status
      - backuprestores/status
      - restorerehearsals/status
      - backups/finalizers
      - cloudflareloadbalancers/finalizers
      - postgresschemas/finalizers
      - clerkapplications/status
      - clerkapplications/finalizers
      - rabbitmqtopologies/finalizers
      - lakes/finalizers
      - lakeenvironments/finalizers
      - lakeapps/finalizers
      - lakesealedsecrets/finalizers
      - kubernetesclusters/status
      - kubernetesclusters/finalizers
      - kubernetesclusterproviders/status
      - kubernetesclusterproviders/finalizers
      - aksclusters/status
      - aksclusters/finalizers
      - clusterhelmreleases/status
      - clusterhelmreleases/finalizers
      - oramaoperators/status
      - oramaoperators/finalizers
      - lakesets/status
      - lakesets/finalizers
      - lakeordersources/status
      - oramacloudv1sets/status
      - oramacloudv1sets/finalizers
      - edgeproviders/status
      - edgezonepolicies/status
      - cloudflarezonepolicies/status
      - edgehostpolicies/status
      - cloudflarehostpolicies/status
      - cloudflarehostpolicies/finalizers
      - paymentproviders/status
      - paymentwebhookendpoints/status
      - stripewebhookendpoints/status
      - stripewebhookendpoints/finalizers
      - paymentcatalogs/status
      - stripecatalogs/status
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["*"]
  # Verify the platform ingress controller's pod ownership before reading billing counters.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Read the Zetta e2e Job's pod logs to parse pass/fail/skip counts and Lake builder logs to read
  # the final pushed digest and size into their respective status records.
  # Patch lake pods' orama.cloud/services-secret-version annotation so kubelet refreshes the
  # mounted services Secret at once (lake#197). Listed uncached: no pod informer.
  # Create and delete a methodology run's or served model's quota reservation, a pod that is never
  # scheduled, in its workspace's namespace (orama-operator#799).
  # Delete an owned, crash-looping previous-image Cloud v1 writer to unblock its requested
  # image rollout, with UID/resource-version preconditions (orama-operator#1035).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # A Lake volume store's used space (lake#666): the kubelet's /stats/summary of the node running
  # the pod that mounts it, read through the API server's node proxy. get only.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  # ORAMA_OPERATOR_ID (operator#106): a single uncached GET of the kube-system Namespace UID — `get` only,
  # never list/watch, so the operator holds no cluster-wide Namespace informer. `create` is for the
  # Lake controllers create their Lake and rehearsal namespaces. LakeEnvironment update/delete is
  # guarded in code by the exact ownership annotation; foreign namespaces are never changed.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "scheduledbackups", "backups", "databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Barman Cloud Plugin's archive configuration, one per Postgres BackupSchedule (operator#731).
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status"]
    verbs: ["get", "update", "patch"]
  # Origin TLS: each Cloud v1 stack's, Lake's and public Zetta's Let's Encrypt Issuer (#457,
  # #578). ingress-shim creates the Certificates of the Ingresses that name an Issuer; the operator
  # writes the Certificates of Lake app and environment hosts, issued in the Lake namespace (#578).
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations"]
    verbs: ["*"]
  # Lake managed services, the catalog (liquid-bridge decision 47, docs/lake/services.md): the
  # resources each kind's upstream operator runs. The operator reads them uncached (never
  # watches), so a group whose CRD is absent only fails that kind's services.
  - apiGroups: ["clickhouse-keeper.altinity.com"]
    resources: ["clickhousekeeperinstallations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkanodepools", "kafkausers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A service that is not ready reports Kubernetes' own last Warning about its objects, read from
  # the events of its workspace namespace (operator#435).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create", "patch"]
  # Read only: where Strimzi records a broker pod the API server refused (operator#428).
  - apiGroups: ["core.strimzi.io"]
    resources: ["strimzipodsets"]
    verbs: ["get", "list"]
  - apiGroups: ["pingcap.com"]
    resources: ["tidbclusters", "backups", "restores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["k8ssandra.io"]
    resources: ["k8ssandraclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cassandra backups through Medusa (operator#734).
  - apiGroups: ["medusa.k8ssandra.io"]
    resources: ["medusabackupjobs", "medusarestorejobs", "medusabackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["valkey.io"]
    resources: ["valkeyclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters"]
    verbs: ["*"]
  # Lake volumes (operator#259, operator#260, docs/lake/volume-snapshots.md): read storage classes
  # to tell whether a workspace Zetta's claim can grow; create the Retain VolumeSnapshotClass, take
  # and prune VolumeSnapshots, and label their bound contents. Never delete a class, or a content it
  # did not create: a LakeRestoreRehearsal of the store creates and deletes its own Retain content
  # (lakerestorerehearsal_store.go), which leaves the cloud snapshot in place.
  # Read uncached, so a cluster without the snapshot CRDs only reports it in the status table.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["*"]
  # zetta-tunnel's ingress gateway: its IngressClass, and the address of the Ingresses it serves.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["get", "update", "patch"]
  # Every NetworkSandbox requires an owner-scoped CiliumNetworkPolicy metadata deny.
  # The controller watches these policies for drift and deletion repair.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["*"]
  # Elastic capacity (operator#69): the operator OWNS a Karpenter NodePool for the Zetta cluster and
  # reads the provider NodeClasses/NodeClaims + cluster Nodes for the provisioned-node status count.
  # karpenter.{sh,k8s.aws,azure.com} may be absent (bare-metal / no autoscaler) — the reconciler
  # no-ops when the CRD is missing, and an RBAC grant for a non-existent apiGroup is harmless.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["*"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.k8s.aws"]
    resources: ["ec2nodeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.azure.com"]
    resources: ["aksnodeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Operator-owned Karpenter install (operator#75): server-side-apply the Karpenter CRDs + the
  # controller's ServiceAccount/RBAC/Deployment/Service/PDB. Creating RBAC that grants Karpenter's
  # (broad) permissions requires `bind` + `escalate` on roles/bindings (RBAC privilege-escalation
  # prevention) since the operator doesn't itself carry every node/pod grant. CRDs are applied but
  # never deleted (no `delete` — deleting a Karpenter CRD cascades to all NodePools/NodeClaims).
  # (ServiceAccounts/Deployments/Services/PDBs the install also creates are already granted above.)
  # Every write, bind and escalate is scoped by resourceNames to the objects of the vendored Karpenter
  # bundle (karpenterControllerObjects / karpenterCRDNames in
  # internal/controller/zetta_capacity_install_render.go), so the operator cannot create, update or bind
  # any other role, binding or CRD (operator#79). Reads stay unscoped. Re-vendoring a Karpenter version
  # that renames an object needs these lists updated; TestChartKarpenterRBACMatchesBundle checks it.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["ec2nodeclasses.karpenter.k8s.aws", "nodeclaims.karpenter.sh", "nodeoverlays.karpenter.sh", "nodepools.karpenter.sh"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["karpenter", "karpenter-admin", "karpenter-core"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["karpenter", "karpenter-core"]
    verbs: ["create", "update", "patch", "delete"]
  # TiDB Operator's backup and restore pods report through this ServiceAccount's Role (operator#735).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["tidb-backup-manager"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["karpenter", "karpenter-dns"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["karpenter", "karpenter-dns"]
    verbs: ["create", "update", "patch", "delete"]
  # Observability (operator#15): each cluster's alert rules and routing, and the scrape
  # configuration of what the operator runs, for the platform's kube-prometheus-stack. The CRDs may
  # be absent until the platform layer is installed; the reconcilers tolerate that.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "podmonitors", "alertmanagerconfigs", "prometheuses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pixie's own RBAC, applied from the vendored Vizier and Cloud manifests (pixie_vizier_render.go
  # vizierObjects, pixie_cloud_render.go pixieCloudObjects). As for Karpenter, every write, bind and
  # escalate is scoped to exactly those names; TestChartPixieRBACMatchesBundle checks the lists.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["pl-cloud-connector-role", "pl-node-view", "pl-vizier-metadata", "plc:nats-server"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["pl-cloud-connector-cluster-binding", "pl-node-view-cluster-binding", "pl-vizier-metadata-cluster-binding", "pl-vizier-metadata-node-view-cluster-binding", "plc:nats-server-binding"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["pl-cloud-connector-ns-role", "pl-kuberesolver-role", "pl-vizier-metadata-role", "pl-vizier-query-broker-role"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["pl-cloud-connector-binding", "pl-kuberesolver-role-binding", "pl-vizier-metadata-binding", "pl-vizier-query-broker-binding"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-manager
  labels: {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# Leader-election Role — the manager runs with --leader-elect, which needs a Lease (+ events) in its
# own namespace. Namespaced (not cluster-wide) since the lock lives beside the manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
