# The private operator manager image. For a fresh install, obtain registry access, then set
# operator.imagePullSecrets to a Secret in the release namespace. See docs/install.md for
# prerequisites and docs/development.md for remote BuildKit publication.
operator:
  image:
    repository: oramasearch/orama-operator
    # The version and the image's digest, <version>@sha256:<64 hex>. The chart refuses a tag
    # without the digest, so the pod runs the pinned bytes whatever the tag later names
    # (orama-operator#808). The default is the version every leaf runs (config/clusters/*/
    # operator.yaml), so helmfile's path installs the same operator; cmd/platform_sync_test.go
    # keeps the two equal.
    tag: v0.7.3@sha256:ce339674a3a0cea4e9809786adca45451a95d62dd79f6ac69b8c0aa3b7ec37dc
    pullPolicy: IfNotPresent
  # Pull secret(s) for the PRIVATE manager image, e.g. [{ name: oramasearch-dockerhub }].
  # Empty emits no imagePullSecrets; fresh nodes need registry access for the private default.
  imagePullSecrets: []
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

serviceAccount:
  name: orama-operator

# Images the operator itself runs for lake's managed services (docs/lake/services.md).
# sqliteImage is lake-sqlite (docs/lake/lake-sqlite.md), the web service behind the sqlite kind;
# a Lake's spec.services.sqliteImage overrides it. duckdbImage is lake-duckdb
# (docs/lake/lake-duckdb.md) behind the duckdb kind and polarsImage lake-polars
# (docs/lake/lake-polars.md) behind the polars kind, overridden by spec.services.duckdbImage and
# spec.services.polarsImage. The images are private: a Lake's spec.pullSecretName is the pull
# secret its services use.
lakeServices:
  sqliteImage: oramasearch/lake-sqlite:0.1.1
  duckdbImage: oramasearch/lake-duckdb:0.1.0
  polarsImage: oramasearch/lake-polars:0.1.0

# Images the operator runs for secure networking (docs/infrastructure/tunnels.md). zetta-tunnel is
# private: its pods use their Lake's spec.pullSecretName. cloudflared runs only for a
# CloudflareTunnel, in a customer's own Cloudflare account.
networking:
  zettaTunnelImage: oramasearch/zetta-tunnel:main-9cd11b4
  cloudflaredImage: cloudflare/cloudflared:2026.10.0

controlPlane:
  service:
    port: 8090

# Helm applies CRDs from chart/crds before templates (generate them with make manifests).
installCRDs: true

# Every cluster's operator can manage other clusters (docs/infrastructure/README.md): the kinds
# and controllers are the same everywhere. What a cluster that does manage others needs is a way
# to call the cloud.
clusterManagement:
  # Azure workload identity for the manager, so it can call Azure with no long-lived secret: the
  # client ID of a user-assigned managed identity that has a federated credential for this
  # ServiceAccount. Empty leaves the ServiceAccount and pod unannotated; a provider can still
  # authenticate with a service principal secret.
  azureWorkloadIdentityClientID: ""
