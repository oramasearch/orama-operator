# The private operator manager image. For a fresh install, obtain a published immutable tag
# and registry access, then set operator.imagePullSecrets to a Secret in the release namespace.
# See docs/install.md for prerequisites and docs/development.md for remote BuildKit publication.
operator:
  image:
    repository: oramasearch/orama-operator
    tag: v1-sandbox
    pullPolicy: IfNotPresent
  # Pull secret(s) for the PRIVATE manager image, e.g. [{ name: oramasearch-dockerhub }].
  # Empty emits no imagePullSecrets; fresh nodes need registry access for the private default.
  imagePullSecrets: []
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

serviceAccount:
  name: orama-operator

controlPlane:
  service:
    port: 8090

# Helm applies CRDs from chart/crds before templates (generate them with make manifests).
installCRDs: true
