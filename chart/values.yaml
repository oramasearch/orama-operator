# The operator manager image. Built from the operator repo root's Dockerfile via
# build/images/build.sh (component: operator) and pushed to PRIVATE Docker Hub with the same
# v1-sandbox tag as the workloads. Because it's private, set operator.imagePullSecrets below for
# an in-cluster deploy (the secret must exist in the release namespace).
operator:
  image:
    repository: oramasearch/orama-operator
    tag: v1-sandbox
    pullPolicy: IfNotPresent
  # Pull secret(s) for the PRIVATE manager image, e.g. [{ name: oramasearch-dockerhub }].
  # Empty = image is public / already present on the node.
  imagePullSecrets: []
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

serviceAccount:
  name: orama-operator

controlPlane:
  service:
    port: 8090

# Helm applies CRDs from chart/crds before templates (generate them with make manifests).
installCRDs: true
