---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterhelmreleases.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: ClusterHelmRelease
    listKind: ClusterHelmReleaseList
    plural: clusterhelmreleases
    shortNames:
    - chr
    singular: clusterhelmrelease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.releaseName
      name: Release
      type: string
    - jsonPath: .spec.chart.version
      name: Version
      type: string
    - jsonPath: .status.chartVersion
      name: Installed
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterHelmRelease is one Helm chart release on a cluster this one manages, at a pinned
          version: the cluster-scoped software a leaf needs before and around its operator
          (CloudNativePG, an ingress controller, the service operators). Reconciled by the management
          cluster's operator only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterHelmReleaseSpec is one chart release on a cluster
              this one manages.
            properties:
              chart:
                description: ClusterHelmChart says which chart, from where, at which
                  version.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret on this cluster for a private chart: either a
                      kubernetes.io/dockerconfigjson Secret with an entry for the repository's host, or one with
                      `username` and `password` keys.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  name:
                    description: Name is the chart's name in a chart repository. Unused
                      for an OCI repository.
                    type: string
                  repository:
                    description: |-
                      Repository is a chart repository (https://cloudnative-pg.github.io/charts), with Name the
                      chart in it, or an OCI repository holding the chart (oci://registry/path), with Name unset.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is the chart version. It is required: a release on a managed cluster is always
                      pinned, and changing this is how it is upgraded.
                    minLength: 1
                    type: string
                required:
                - repository
                - version
                type: object
              clusterRef:
                description: ClusterRef names the KubernetesCluster the chart is installed
                  onto.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: clusterRef cannot be changed; create another ClusterHelmRelease
                    for another cluster
                  rule: self == oldSelf
              dependsOn:
                description: |-
                  DependsOn names other ClusterHelmRelease resources, on the same cluster, that must be
                  Ready before this one is installed (cert-manager before a chart whose webhooks need it).
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              namespace:
                description: Namespace is the release's namespace on the cluster.
                  It is created when absent.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: namespace cannot be changed
                  rule: self == oldSelf
              releaseName:
                description: ReleaseName is the Helm release's name on the cluster.
                maxLength: 53
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: releaseName cannot be changed
                  rule: self == oldSelf
              requiredCRDs:
                description: |-
                  RequiredCRDs are CRD names that must exist on the cluster before this chart is installed
                  or upgraded, for a chart whose CRDs are shipped apart from it.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              values:
                description: Values are the chart's values.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - chart
            - clusterRef
            - namespace
            - releaseName
            type: object
            x-kubernetes-validations:
            - message: chart.name is required for a chart repository (https://)
              rule: 'self.chart.repository.startsWith(''https://'') ? has(self.chart.name)
                && size(self.chart.name) > 0 : true'
          status:
            description: ClusterHelmReleaseStatus is what the cluster has.
            properties:
              appVersion:
                type: string
              chartVersion:
                description: ChartVersion and AppVersion are those of the release
                  on the cluster.
                type: string
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: |-
                  Message says why the release is not Ready, in the words of whatever refused: the chart
                  repository, Helm, the cluster's API server, or the release's own pods.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Pending (waiting for the cluster or a dependency), Installing, Ready, Degraded or
                  Deleting.
                type: string
              readyWorkloads:
                format: int32
                type: integer
              releaseStatus:
                description: 'ReleaseStatus is Helm''s own word for the release: deployed,
                  failed, pending-upgrade.'
                type: string
              revision:
                description: Revision is the Helm release's revision.
                format: int32
                type: integer
              workloads:
                description: |-
                  Workloads counts the release's Deployments, StatefulSets and DaemonSets; ReadyWorkloads
                  those fully rolled out.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
