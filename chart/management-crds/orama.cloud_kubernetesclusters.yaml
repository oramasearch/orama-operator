---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kubernetesclusters.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: KubernetesCluster
    listKind: KubernetesClusterList
    plural: kubernetesclusters
    shortNames:
    - kcluster
    singular: kubernetescluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef
      name: Provider
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.kubernetesVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubernetesCluster is a Kubernetes cluster the operator provisions and keeps as described. It is
          the abstract kind: it names a KubernetesClusterProvider, and that provider's type decides the
          concrete kind created for it. Reconciled by the management cluster's operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubernetesClusterSpec is the cluster that is wanted.
            properties:
              deletionPolicy:
                description: |-
                  DeletionPolicy is required and has no default: whoever writes the resource chooses whether
                  deleting it destroys the cluster (Delete) or leaves it running (Retain).
                enum:
                - Delete
                - Retain
                type: string
              kubeconfigSecretRef:
                description: |-
                  KubeconfigSecretRef is where the cluster's admin kubeconfig is written (key `kubeconfig`).
                  Defaults to a Secret named <name>-kubeconfig in the provider's credentials namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              kubernetesVersion:
                description: KubernetesVersion is the version wanted, such as 1.35
                  or 1.35.8.
                pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
                type: string
              nodePools:
                description: NodePools are the cluster's pools. At least one must
                  have role system.
                items:
                  description: ClusterNodePool is one pool of nodes, in provider-neutral
                    terms.
                  properties:
                    count:
                      description: Count is the number of nodes when the pool does
                        not autoscale. Ignored when maxCount is set.
                      format: int32
                      minimum: 0
                      type: integer
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels are added to every node of the pool.
                      type: object
                    machineSize:
                      description: |-
                        MachineSize is the provider's name for the machine type, such as Standard_D8as_v7. The
                        value is the vendor's word; the field is neutral.
                      minLength: 1
                      type: string
                    maxCount:
                      format: int32
                      minimum: 1
                      type: integer
                    minCount:
                      description: |-
                        MinCount and MaxCount turn on the provider's node autoscaling between the two. This is the
                        pool's bound; autoscaling inside the bound belongs to the cluster itself.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: Name of the pool. AKS allows 1 to 12 lowercase
                        letters and digits, starting with a letter.
                      pattern: ^[a-z][a-z0-9]{0,11}$
                      type: string
                    role:
                      description: Role is system or user.
                      enum:
                      - system
                      - user
                      type: string
                    taints:
                      description: Taints are added to every node of the pool.
                      items:
                        description: |-
                          The node this Taint is attached to has the "effect" on
                          any pod that does not tolerate the Taint.
                        properties:
                          effect:
                            description: |-
                              Required. The effect of the taint on pods
                              that do not tolerate the taint.
                              Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                            type: string
                          key:
                            description: Required. The taint key to be applied to
                              a node.
                            type: string
                          timeAdded:
                            description: |-
                              TimeAdded represents the time at which the taint was added.
                              It is only written for NoExecute taints.
                            format: date-time
                            type: string
                          value:
                            description: The taint value corresponding to the taint
                              key.
                            type: string
                        required:
                        - effect
                        - key
                        type: object
                      type: array
                    zones:
                      description: Zones are the availability zones the pool's nodes
                        may use. Empty means the provider chooses.
                      items:
                        type: string
                      type: array
                  required:
                  - machineSize
                  - name
                  - role
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              providerRef:
                description: ProviderRef names the KubernetesClusterProvider that
                  provisions this cluster. Immutable.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self == oldSelf
              region:
                description: Region is the provider's name for where the cluster runs,
                  such as westus2. Immutable.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              tags:
                additionalProperties:
                  type: string
                description: Tags are attached to the cluster where the provider supports
                  them.
                type: object
            required:
            - deletionPolicy
            - kubernetesVersion
            - nodePools
            - providerRef
            - region
            type: object
          status:
            description: |-
              KubernetesClusterStatus is what is true of the cluster, summarized from the concrete resource
              so that a person only needs to read this kind.
            properties:
              concreteRef:
                description: ConcreteRef names the concrete resource provisioned for
                  this cluster, as Kind/name.
                type: string
              conditions:
                description: |-
                  Conditions: Ready, and InSync (false when the spec asks for something the cluster does not
                  have and this version of the operator does not apply).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the address of the cluster's API server.
                type: string
              kubeconfigSecretRef:
                description: KubeconfigSecretRef is where the admin kubeconfig was
                  written.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              kubernetesVersion:
                description: KubernetesVersion is the version the cluster is running.
                type: string
              message:
                description: Message says, in a sentence, why the cluster is not Ready.
                type: string
              nodePools:
                description: NodePools reports each pool.
                items:
                  description: ClusterNodePoolStatus is what is true of one pool.
                  properties:
                    count:
                      description: Count is the number of nodes the provider reports.
                      format: int32
                      type: integer
                    error:
                      description: Error is the error the provider reports for the
                        pool.
                      type: string
                    name:
                      type: string
                    state:
                      description: State is the provider's provisioning state for
                        the pool.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Provisioning, Ready, Degraded or Deleting.
                type: string
              providerType:
                description: ProviderType is the type of the resolved provider.
                enum:
                - aks
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
