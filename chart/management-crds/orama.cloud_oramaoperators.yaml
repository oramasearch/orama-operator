---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oramaoperators.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: OramaOperator
    listKind: OramaOperatorList
    plural: oramaoperators
    shortNames:
    - ooperator
    singular: oramaoperator
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.installedVersion
      name: Installed
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OramaOperator installs the Orama operator onto a cluster this one manages and keeps it at the
          version named. Every cluster runs the operator; a leaf's is installed and versioned from here,
          by the management cluster's operator. Reconciled by the management cluster's operator only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OramaOperatorSpec says which cluster gets the Orama operator,
              and at which version.
            properties:
              chartRepository:
                default: registry-1.docker.io/oramasearch/orama-operator-chart
                description: ChartRepository is the OCI repository holding the operator's
                  chart, one tag per version.
                type: string
              clusterRef:
                description: |-
                  ClusterRef names the KubernetesCluster the operator is installed onto. The cluster is
                  reached through the admin kubeconfig Secret that KubernetesCluster writes.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: clusterRef cannot be changed; create another OramaOperator
                    for another cluster
                  rule: self == oldSelf
              imagePullSecretRef:
                description: |-
                  ImagePullSecretRef names a registry credentials Secret (kubernetes.io/dockerconfigjson) on
                  this cluster. It is copied to the target cluster so its nodes can pull the private operator
                  image, and it authenticates the pull of the chart.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              imageRepository:
                default: oramasearch/orama-operator
                description: ImageRepository is the operator image without a tag.
                type: string
              namespace:
                default: orama-system
                description: Namespace is where the operator is installed on the cluster.
                type: string
                x-kubernetes-validations:
                - message: namespace cannot be changed
                  rule: self == oldSelf
              values:
                description: |-
                  Values are chart values for the cluster's operator. The image, its pull secret and
                  clusterManagement.enabled=false are set by this controller and win over anything here.
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: |-
                  Version is the operator version the cluster runs: the image tag, and the chart published
                  with it (a release such as v0.1.0, or a build such as dev-83242f9). Changing it upgrades
                  the cluster's operator, CRDs first.
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*$
                type: string
            required:
            - clusterRef
            - imagePullSecretRef
            - version
            type: object
          status:
            description: OramaOperatorStatus is what the target cluster's operator
              is observed to be.
            properties:
              chartVersion:
                description: ChartVersion is the chart version of that release.
                type: string
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: Image is the image the operator's Deployment on the cluster
                  runs.
                type: string
              installedVersion:
                description: InstalledVersion is the operator version of the Helm
                  release on the cluster.
                type: string
              message:
                description: |-
                  Message says why the operator is not Ready, in the words of whatever refused: the
                  registry, Helm, the cluster's API server, or the operator's own pod.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending (waiting for the cluster), Installing,
                  Ready, Degraded or Deleting.
                type: string
              readyReplicas:
                format: int32
                type: integer
              releaseStatus:
                description: 'ReleaseStatus is Helm''s own word for the release: deployed,
                  failed, pending-upgrade.'
                type: string
              replicas:
                description: Replicas and ReadyReplicas are the operator Deployment's,
                  on the cluster.
                format: int32
                type: integer
              revision:
                description: Revision is the Helm release's revision on the cluster.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
