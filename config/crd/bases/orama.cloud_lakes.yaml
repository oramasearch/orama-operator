---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakes.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: Lake
    listKind: LakeList
    plural: lakes
    singular: lake
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.postgresInstances
      name: DB
      type: string
    - jsonPath: .status.schemaPhase
      name: Schema
      type: string
    - jsonPath: .status.lastBackupTime
      name: Backup
      type: date
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lake is the Schema for the lakes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Lake
            properties:
              args:
                description: Args passed to the image's entrypoint. Empty runs the
                  image as built.
                items:
                  type: string
                type: array
              dnsSecretRef:
                description: |-
                  DNSSecretRef, if set together with Host, creates a proxied Cloudflare DNS record (Host -> the
                  ingress LoadBalancer) using the Cloudflare credentials (keys `token`, `zoneID`) in the named
                  Secret. The Secret must live in spec.namespace (the CloudflareDNSRecord is created there) and
                  hold the zone ID of Host's zone: a lake.live host needs a lake.live-zone Secret, not the
                  oramadev.net one the Zetta clusters use.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              host:
                description: |-
                  Host is the domain name the lake is exposed at (e.g. hello.lake.live) when IngressEnabled is
                  true. Requires an ingress controller (class nginx).
                type: string
              image:
                description: |-
                  Image for the lake binary. Required: there is no production default. The
                  sample CR points at an HTTP echo until the lake image exists.
                minLength: 1
                type: string
              ingressEnabled:
                default: false
                description: |-
                  IngressEnabled gates external HTTP exposure of the lake Service. When true AND Host is set, the
                  operator provisions an nginx Ingress at Host (the whole host proxies to the lake Service) and,
                  if DNSSecretRef is also set, a proxied Cloudflare DNS record (Host -> the ingress LoadBalancer).
                  When false (the default) no Ingress or DNS record is created, and any previously created are
                  torn down, even if Host is still set. Host names the endpoint; this bool is the on/off switch.
                  Same contract as OramaZettaCluster.
                type: boolean
              namespace:
                default: lake-dev
                description: Namespace the lake workloads are deployed into. Created
                  if missing.
                type: string
              port:
                default: 4900
                description: |-
                  Port the container listens on; the Service exposes it on 80. Default 4900, lake's own
                  default (--listen 0.0.0.0:4900). The hello-world echo stand-in overrides it to 5678.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              postgres:
                description: |-
                  Postgres is lake's control plane: a CloudNativePG Cluster the operator provisions in
                  spec.namespace, the same path OramaCloudV1 uses for its control DB (requires the
                  CloudNativePG operator, see the helmfile). CNPG generates the `lake-<name>-controldb-app`
                  Secret (owner credentials + connection URI); the lake pods receive it as
                  LAKE_CONTROL_DB_URI. Zetta is the data plane and is provisioned separately.
                properties:
                  backup:
                    description: Backup configures scheduled Barman object-store backups
                      of the control-plane Cluster.
                    properties:
                      destination:
                        description: Destination identifies the object-store location.
                          Bucket is required when Enabled is true.
                        properties:
                          bucket:
                            description: Bucket is the object-store bucket name. Required
                              when backups are enabled.
                            type: string
                          endpointURL:
                            description: EndpointURL overrides the Secret's s3ApiEndpoint.
                            type: string
                          path:
                            description: Path is the bucket prefix. Empty defaults
                              to lake-<name>/controldb.
                            type: string
                        type: object
                      enabled:
                        default: false
                        description: Enabled turns on the CNPG Barman object store
                          and ScheduledBackup. Default false.
                        type: boolean
                      retention:
                        default: 30d
                        description: Retention is the Barman retentionPolicy.
                        type: string
                      schedule:
                        default: 0 0 3 * * *
                        description: Schedule is a six-field CNPG cron expression.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef names the R2/S3 credentials Secret in spec.namespace. It is required when
                          Enabled is true and must contain s3ApiEndpoint, accessKeyId, and secretAccessKey.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Enabled provisions the CNPG Cluster. Default true. Setting it false tears the cluster
                      down (disable is not "leave running"), which deletes its data.
                    type: boolean
                  instances:
                    default: 1
                    description: Instances is the CNPG instance count (1 = single
                      primary; 2+ adds streaming replicas).
                    format: int32
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: StorageClassName for the PVCs; empty = the cluster
                      default.
                    type: string
                  storageSize:
                    default: 50Gi
                    description: |-
                      StorageSize is the per-instance PVC size. Default 50Gi: a Lake is a production control plane,
                      and CNPG grows a PVC in place when the StorageClass allows expansion, so start with headroom.
                    type: string
                type: object
              pullSecretName:
                description: |-
                  PullSecretName, if set, is attached to the lake pods as an imagePullSecret. Needed for a
                  private spec.image (oramasearch/lake is private). The Secret must exist in spec.namespace.
                type: string
              replicas:
                default: 1
                description: Replicas of the lake Deployment.
                format: int32
                minimum: 0
                type: integer
            required:
            - image
            type: object
          status:
            description: status defines the observed state of Lake
            properties:
              backupReady:
                description: BackupReady is true when the ScheduledBackup exists and
                  the newest CNPG Backup completed.
                type: boolean
              conditions:
                description: Conditions includes BackupReady, including invalid backup
                  configuration details.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastBackupTime:
                description: LastBackupTime is the completion time reported by the
                  newest CNPG Backup.
                format: date-time
                type: string
              phase:
                description: 'Phase is a coarse summary in the operator''s vocabulary:
                  Progressing, Ready, Degraded.'
                type: string
              postgresInstances:
                description: PostgresInstances is ready/desired for the CNPG Cluster,
                  e.g. "1/1"; empty when disabled.
                type: string
              postgresReady:
                description: PostgresReady is true once the control-plane CNPG Cluster
                  has at least one ready instance.
                type: boolean
              readyReplicas:
                description: ReadyReplicas mirrors the Deployment's ready replicas.
                format: int32
                type: integer
              schemaPhase:
                description: 'SchemaPhase mirrors the owned PostgresSchema: Pending
                  | Applying | Applied | Failed.'
                type: string
              schemaVersion:
                description: SchemaVersion is the applied schema's content hash (sha256:<12
                  hex>), from the PostgresSchema.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
