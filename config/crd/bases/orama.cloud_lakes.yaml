---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakes.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: Lake
    listKind: LakeList
    plural: lakes
    singular: lake
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.postgresInstances
      name: DB
      type: string
    - jsonPath: .status.schemaPhase
      name: Schema
      type: string
    - jsonPath: .status.store.claimName
      name: Store
      type: string
    - jsonPath: .status.lastBackupTime
      name: Backup
      type: date
    - jsonPath: .status.dataServicesSummary
      name: Data
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lake is the Schema for the lakes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Lake
            properties:
              args:
                description: Args passed to the image's entrypoint. Empty runs the
                  image as built.
                items:
                  type: string
                type: array
              dnsSecretRef:
                description: |-
                  DNSSecretRef, if set together with Host, creates a proxied Cloudflare DNS record (Host -> the
                  ingress LoadBalancer) using the Cloudflare credentials (keys `token`, `zoneID`) in the named
                  Secret. The Secret must live in spec.namespace (the CloudflareDNSRecord is created there) and
                  hold the zone ID of Host's zone: a lake.live host needs a lake.live-zone Secret, not the
                  oramadev.net one the Zetta clusters use.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              env:
                description: |-
                  Env appends lake-specific environment variables after the operator-managed variables.
                  Operator-managed names take precedence and conflicting entries are ignored.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              host:
                description: |-
                  Host is the domain name the lake is exposed at (e.g. hello.lake.live) when IngressEnabled is
                  true. Requires an ingress controller (class nginx).
                type: string
              image:
                description: |-
                  Image for the lake binary. Required: there is no production default. The
                  sample CR points at an HTTP echo until the lake image exists.
                minLength: 1
                type: string
              ingressEnabled:
                default: false
                description: |-
                  IngressEnabled gates external HTTP exposure of the lake Service. When true AND Host is set, the
                  operator provisions an nginx Ingress at Host (the whole host proxies to the lake Service) and,
                  if DNSSecretRef is also set, a proxied Cloudflare DNS record (Host -> the ingress LoadBalancer).
                  When false (the default) no Ingress or DNS record is created, and any previously created are
                  torn down, even if Host is still set. Host names the endpoint; this bool is the on/off switch.
                  Same contract as OramaZettaCluster.
                type: boolean
              namespace:
                default: lake-dev
                description: Namespace the lake workloads are deployed into. Created
                  if missing.
                type: string
              port:
                default: 4900
                description: |-
                  Port the container listens on; the Service exposes it on 80. Default 4900, lake's own
                  default (--listen 0.0.0.0:4900). The hello-world echo stand-in overrides it to 5678.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              postgres:
                description: |-
                  Postgres is lake's control plane: a CloudNativePG Cluster the operator provisions in
                  spec.namespace, the same path OramaCloudV1 uses for its control DB (requires the
                  CloudNativePG operator, see the helmfile). CNPG generates the `lake-<name>-controldb-app`
                  Secret (owner credentials + connection URI); the lake pods receive it as
                  LAKE_CONTROL_DB_URI. Zetta is the data plane and is provisioned separately.
                properties:
                  backup:
                    description: Backup configures scheduled Barman object-store backups
                      of the control-plane Cluster.
                    properties:
                      destination:
                        description: Destination identifies the object-store location.
                          Bucket is required when Enabled is true.
                        properties:
                          bucket:
                            description: Bucket is the object-store bucket name. Required
                              when backups are enabled.
                            type: string
                          endpointURL:
                            description: EndpointURL overrides the Secret's s3ApiEndpoint.
                            type: string
                          path:
                            description: Path is the bucket prefix. Empty defaults
                              to lake-<name>/controldb.
                            type: string
                        type: object
                      enabled:
                        default: false
                        description: Enabled turns on the CNPG Barman object store
                          and ScheduledBackup. Default false.
                        type: boolean
                      retention:
                        default: 30d
                        description: Retention is the Barman retentionPolicy.
                        type: string
                      schedule:
                        default: 0 0 3 * * *
                        description: Schedule is a six-field CNPG cron expression.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef names the R2/S3 credentials Secret in spec.namespace. It is required when
                          Enabled is true and must contain s3ApiEndpoint, accessKeyId, and secretAccessKey.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Enabled provisions the CNPG Cluster. Default true. Setting it false tears the cluster
                      down (disable is not "leave running"), which deletes its data.
                    type: boolean
                  instances:
                    default: 1
                    description: Instances is the CNPG instance count (1 = single
                      primary; 2+ adds streaming replicas).
                    format: int32
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: StorageClassName for the PVCs; empty = the cluster
                      default.
                    type: string
                  storageSize:
                    default: 50Gi
                    description: |-
                      StorageSize is the per-instance PVC size. Default 50Gi: a Lake is a production control plane,
                      and CNPG grows a PVC in place when the StorageClass allows expansion, so start with headroom.
                    type: string
                type: object
              pullSecretName:
                description: |-
                  PullSecretName, if set, is attached to the lake pods as an imagePullSecret. Needed for a
                  private spec.image (oramasearch/lake is private). The Secret must exist in spec.namespace.
                type: string
              replicas:
                default: 1
                description: Replicas of the lake Deployment.
                format: int32
                minimum: 0
                type: integer
              sealing:
                description: |-
                  Sealing configures the X25519 cluster delivery key. The operator mints generation 1 when
                  omitted. Increasing Generation rotates the public key while retaining private keys still
                  needed by LakeSealedSecret resources.
                properties:
                  generation:
                    default: 1
                    description: Generation rotates the sealing key when increased.
                      It cannot be decreased.
                    format: int64
                    minimum: 1
                    type: integer
                type: object
              store:
                description: |-
                  Store configures the persistent root shared by all lake replicas. When ExistingClaim is
                  empty, the operator creates lake-<name>-store once from Size, StorageClassName, and
                  AccessModes. Later spec changes never replace or delete that claim. ReadWriteOnce requires
                  Replicas=1; multiple replicas need storage that supports ReadWriteMany.
                properties:
                  accessModes:
                    default:
                    - ReadWriteMany
                    description: |-
                      AccessModes for an operator-created claim. The default is ReadWriteMany because every
                      Deployment replica mounts the same store root. ReadWriteOnce requires spec.replicas=1.
                      It is used only when the claim is first created.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  existingClaim:
                    description: |-
                      ExistingClaim names a PersistentVolumeClaim in spec.namespace to mount instead of creating
                      lake-<name>-store. The operator does not adopt, modify, or delete this claim.
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100Gi
                    description: |-
                      Size requested for an operator-created claim. It is used only when the claim is first
                      created; later changes do not replace or resize the data volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName for an operator-created claim. Empty uses the cluster default.
                      It is used only when the claim is first created.
                    type: string
                type: object
            required:
            - image
            type: object
          status:
            description: status defines the observed state of Lake
            properties:
              backupReady:
                description: BackupReady is true when the ScheduledBackup exists and
                  the newest CNPG Backup completed.
                type: boolean
              conditions:
                description: Conditions includes StoreReady and BackupReady, including
                  invalid configuration details.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dataServices:
                description: |-
                  DataServices reports the operational evidence for every data service associated with the
                  Lake. Managed is true only when every applicable procedure has a successful rehearsal.
                items:
                  description: LakeDataServiceStatus reports whether a Lake data service
                    has proven lifecycle procedures.
                  properties:
                    backup:
                      description: Backup is tested, untested, or none.
                      enum:
                      - tested
                      - untested
                      - none
                      type: string
                    failover:
                      description: Failover is tested, untested, or none.
                      enum:
                      - tested
                      - untested
                      - none
                      type: string
                    kind:
                      description: Kind identifies the service implementation.
                      enum:
                      - postgres
                      - zetta
                      type: string
                    lastVerified:
                      description: LastVerified is the completion time of the newest
                        rehearsal for this service.
                      format: date-time
                      type: string
                    managed:
                      description: Managed is true only when every procedure required
                        by the current configuration is tested.
                      type: boolean
                    name:
                      description: Name is the stable service identifier within the
                        Lake.
                      type: string
                    notes:
                      description: Notes explains an unmanaged label, an unavailable
                        procedure, or the last failed rehearsal.
                      type: string
                    restore:
                      description: Restore is tested, untested, or none.
                      enum:
                      - tested
                      - untested
                      - none
                      type: string
                    upgrade:
                      description: Upgrade is tested, untested, or none.
                      enum:
                      - tested
                      - untested
                      - none
                      type: string
                  required:
                  - backup
                  - failover
                  - kind
                  - managed
                  - name
                  - restore
                  - upgrade
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              dataServicesSummary:
                description: DataServicesSummary is the managed/unmanaged count displayed
                  by kubectl get lakes.
                type: string
              lastBackupTime:
                description: LastBackupTime is the completion time reported by the
                  newest CNPG Backup.
                format: date-time
                type: string
              phase:
                description: 'Phase is a coarse summary in the operator''s vocabulary:
                  Progressing, Ready, Degraded.'
                type: string
              postgresInstances:
                description: PostgresInstances is ready/desired for the CNPG Cluster,
                  e.g. "1/1"; empty when disabled.
                type: string
              postgresReady:
                description: PostgresReady is true once the control-plane CNPG Cluster
                  has at least one ready instance.
                type: boolean
              readyReplicas:
                description: ReadyReplicas mirrors the Deployment's ready replicas.
                format: int32
                type: integer
              schemaPhase:
                description: 'SchemaPhase mirrors the owned PostgresSchema: Pending
                  | Applying | Applied | Failed.'
                type: string
              schemaVersion:
                description: SchemaVersion is the applied schema's content hash (sha256:<12
                  hex>), from the PostgresSchema.
                type: string
              sealing:
                description: Sealing publishes the cluster-bound recipient used by
                  authoring tools and lake.
                properties:
                  cluster:
                    description: Cluster is the AAD cluster value. It is derived from
                      the Lake UID.
                    type: string
                  generation:
                    description: Generation is the active key generation.
                    format: int64
                    type: integer
                  kid:
                    description: KID identifies the active public key.
                    type: string
                  previousKeys:
                    description: PreviousKeys reports retained private keys and records
                      that still require each one.
                    items:
                      description: LakeSealingPreviousKeyStatus reports why an old
                        private key remains available.
                      properties:
                        kid:
                          description: KID identifies the retained key.
                          type: string
                        remaining:
                          description: Remaining is the number of sealed records that
                            still name this key.
                          format: int32
                          type: integer
                      required:
                      - kid
                      - remaining
                      type: object
                    type: array
                  publicKey:
                    description: PublicKey is the raw 32-byte X25519 public key encoded
                      as unpadded base64url.
                    type: string
                  unresolvedRecords:
                    description: |-
                      UnresolvedRecords counts malformed records whose KID cannot be established. Old keys are
                      retained while this is nonzero.
                    format: int32
                    type: integer
                required:
                - cluster
                - generation
                - kid
                - publicKey
                type: object
              store:
                description: Store reports the selected claim and its observed binding
                  state.
                properties:
                  capacity:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Capacity is the bound storage capacity reported by
                      the claim.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  claimName:
                    description: ClaimName is the selected existing or operator-created
                      PersistentVolumeClaim.
                    type: string
                  phase:
                    description: Phase is the PersistentVolumeClaim phase, such as
                      Pending, Bound, or Lost.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
