---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pixieviziers.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: PixieVizier
    listKind: PixieVizierList
    plural: pixieviziers
    shortNames:
    - pxvizier
    singular: pixievizier
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PixieVizier is Pixie's in-cluster part, the pixie provider's agent. Written by the managing
          cluster's ObservabilityAgent controller into namespace pl of the agent's cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PixieVizierSpec is Vizier on one cluster.
            properties:
              agent:
                description: Agent is the ObservabilityAgent this was written for.
                minLength: 1
                type: string
              alertRoutes:
                description: AlertRoutes are this cluster's alert receivers.
                items:
                  description: PixieAlertRoute is one Alertmanager receiver, with
                    its URL already copied to this cluster.
                  properties:
                    channel:
                      type: string
                    kind:
                      description: Kind is slack or webhook.
                      enum:
                      - slack
                      - webhook
                      type: string
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    secretName:
                      description: SecretName holds key "url" in the resource's namespace,
                        written by the managing cluster.
                      type: string
                    severities:
                      items:
                        enum:
                        - critical
                        - warning
                        - info
                        type: string
                      type: array
                  required:
                  - kind
                  - name
                  - secretName
                  - severities
                  type: object
                type: array
              cloudAddress:
                description: |-
                  CloudAddress is host:port of the hub's vzconn: the hub's Service on its own cluster, or the
                  PeerConnection import Service in this namespace.
                minLength: 1
                type: string
              cloudCASecretName:
                description: |-
                  CloudCASecretName holds ca.crt, the hub's trust root, which the cloud connector verifies the
                  hub's certificate with.
                minLength: 1
                type: string
              clusterName:
                description: ClusterName is the name the cluster is registered under
                  in Pixie Cloud.
                minLength: 1
                type: string
              deployKeySecretName:
                description: DeployKeySecretName holds deploy-key, this cluster's
                  own key, copied from the hub.
                minLength: 1
                type: string
              nodeMemory:
                anyOf:
                - type: integer
                - type: string
                description: NodeMemory caps each node agent; its data store is sized
                  from the same number.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              pullSecretName:
                description: PullSecretName is the registry credentials Secret in
                  this namespace.
                minLength: 1
                type: string
              purpose:
                description: Purpose is the agent cluster's purpose tag, as the managing
                  cluster read it.
                enum:
                - nonprod
                - production
                type: string
              release:
                description: |-
                  Release is the provider's release, copied from the ObservabilityProvider. Empty while the
                  provider is not installable: the cluster's alert routing and rules are written anyway, and
                  Vizier waits.
                properties:
                  cliVersion:
                    description: CLIVersion is the px CLI version the hub's artifact
                      tracker reports.
                    maxLength: 64
                    minLength: 1
                    type: string
                  commit:
                    description: |-
                      Commit is the oramasearch/pixie commit the images were built from. It must equal the commit
                      the operator vendors its manifests from (internal/controller/assets/pixie/COMMIT): manifests
                      and images from different commits are refused.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  images:
                    additionalProperties:
                      description: 'ImageDigestReference is an image by digest: repository@sha256:<64
                        lowercase hex>.'
                      maxLength: 512
                      pattern: ^[a-z0-9][a-z0-9._/:-]*@sha256:[a-f0-9]{64}$
                      type: string
                    description: |-
                      Images maps each image the operator renders (see docs/infrastructure/observability.md for
                      the exact set) to its reference by digest, repository@sha256:<64 hex>. A reference by tag is
                      refused: what runs is what was built and recorded (#455).
                    maxProperties: 64
                    minProperties: 1
                    type: object
                  vizierVersion:
                    description: |-
                      VizierVersion is the version the Vizier images were tagged with, reported to Pixie Cloud and
                      pinned in its artifact tracker so nothing offers another version.
                    maxLength: 64
                    minLength: 1
                    type: string
                required:
                - cliVersion
                - commit
                - images
                - vizierVersion
                type: object
              staleClusterID:
                description: |-
                  StaleClusterID is a cluster id this cluster registered under that its hub does not know, set
                  by the managing cluster (an agent moved to another hub, or a hub rebuilt). While
                  pl-cluster-secrets holds it, the operator removes it, so the cloud connector registers again
                  with its deploy key (#1131).
                type: string
            required:
            - agent
            - cloudAddress
            - cloudCASecretName
            - clusterName
            - deployKeySecretName
            - nodeMemory
            - pullSecretName
            - purpose
            type: object
          status:
            description: PixieVizierStatus is Vizier's readiness, per component.
            properties:
              clusterID:
                description: ClusterID is the id Pixie Cloud registered the cluster
                  under.
                type: string
              clusterIDSeenAt:
                description: ClusterIDSeenAt is when the operator first saw ClusterID.
                format: date-time
                type: string
              components:
                items:
                  description: ObservabilityComponentStatus is one deployable component's
                    readiness.
                  properties:
                    message:
                      description: Message says why it is not ready.
                      type: string
                    name:
                      type: string
                    ready:
                      description: Ready is true when every replica the component
                        wants is available.
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              ready:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
