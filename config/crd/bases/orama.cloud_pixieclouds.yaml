---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pixieclouds.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: PixieCloud
    listKind: PixieCloudList
    plural: pixieclouds
    shortNames:
    - pxcloud
    singular: pixiecloud
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hub
      name: Hub
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PixieCloud is self-hosted Pixie Cloud, the pixie provider's hub. Written by the managing cluster's
          ObservabilityHub controller into namespace plc of the hub's cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PixieCloudSpec is self-hosted Pixie Cloud on one cluster.
            properties:
              adminEmail:
                minLength: 3
                type: string
              agents:
                description: |-
                  Agents are the clusters that get a deploy key. Only the managing cluster writes this list,
                  after checking each agent's purpose against the hub's.
                items:
                  description: PixieCloudAgent is one agent cluster the hub issues
                    a deploy key for.
                  properties:
                    cluster:
                      description: Cluster is the agent's cluster, the name it is
                        registered under.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the ObservabilityAgent's name. Its deploy
                        key is Secret pixie-deploy-key-<name>.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - cluster
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              alertRoutes:
                description: AlertRoutes are this cluster's alert receivers.
                items:
                  description: PixieAlertRoute is one Alertmanager receiver, with
                    its URL already copied to this cluster.
                  properties:
                    channel:
                      type: string
                    kind:
                      description: Kind is slack or webhook.
                      enum:
                      - slack
                      - webhook
                      type: string
                    name:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    secretName:
                      description: SecretName holds key "url" in the resource's namespace,
                        written by the managing cluster.
                      type: string
                    severities:
                      items:
                        enum:
                        - critical
                        - warning
                        - info
                        type: string
                      type: array
                  required:
                  - kind
                  - name
                  - secretName
                  - severities
                  type: object
                type: array
              cluster:
                description: |-
                  Cluster is the hub's own KubernetesCluster: the cluster label of its own metrics. Empty on the
                  managing cluster, whose metrics are labelled with the hub's name.
                type: string
              domain:
                minLength: 1
                type: string
              hub:
                description: Hub is the ObservabilityHub this was written for.
                minLength: 1
                type: string
              metricsRetention:
                description: MetricsRetention is how long the hub Prometheus keeps
                  federated metrics.
                pattern: ^[0-9]+(h|d|w|y)$
                type: string
              organization:
                minLength: 1
                type: string
              pullSecretName:
                description: PullSecretName is the registry credentials Secret in
                  this namespace.
                minLength: 1
                type: string
              purpose:
                description: |-
                  Purpose is the hub cluster's purpose tag, as the managing cluster read it: production on the
                  managing cluster, nonprod on a nonprod cluster.
                enum:
                - nonprod
                - production
                type: string
              release:
                description: Release is the provider's release, copied from the ObservabilityProvider.
                properties:
                  cliVersion:
                    description: CLIVersion is the px CLI version the hub's artifact
                      tracker reports.
                    maxLength: 64
                    minLength: 1
                    type: string
                  commit:
                    description: |-
                      Commit is the oramasearch/pixie commit the images were built from. It must equal the commit
                      the operator vendors its manifests from (internal/controller/assets/pixie/COMMIT): manifests
                      and images from different commits are refused.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  images:
                    additionalProperties:
                      description: 'ImageDigestReference is an image by digest: repository@sha256:<64
                        lowercase hex>.'
                      maxLength: 512
                      pattern: ^[a-z0-9][a-z0-9._/:-]*@sha256:[a-f0-9]{64}$
                      type: string
                    description: |-
                      Images maps each image the operator renders (see docs/infrastructure/observability.md for
                      the exact set) to its reference by digest, repository@sha256:<64 hex>. A reference by tag is
                      refused: what runs is what was built and recorded (#455).
                    maxProperties: 64
                    minProperties: 1
                    type: object
                  vizierVersion:
                    description: |-
                      VizierVersion is the version the Vizier images were tagged with, reported to Pixie Cloud and
                      pinned in its artifact tracker so nothing offers another version.
                    maxLength: 64
                    minLength: 1
                    type: string
                required:
                - cliVersion
                - commit
                - images
                - vizierVersion
                type: object
              storage:
                description: ObservabilityHubStorage sizes the hub's durable stores.
                properties:
                  messaging:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Gi
                    description: Messaging is the NATS JetStream store.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  metrics:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100Gi
                    description: |-
                      Metrics is the hub Prometheus' volume, which keeps every agent cluster's federated metrics
                      for metricsRetention.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  postgres:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 20Gi
                    description: Postgres is the hub's control database (users, organisations,
                      clusters, deploy keys).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  search:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 20Gi
                    description: Search is the metadata search index (OpenSearch).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for every volume the hub claims.
                      Empty means the cluster's default.
                    type: string
                type: object
              users:
                description: |-
                  Users are the other people who sign in, as members of the organisation. Each gets a
                  generated password in Secret pixie-user-<email>.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - adminEmail
            - domain
            - hub
            - organization
            - pullSecretName
            - purpose
            - release
            type: object
          status:
            description: PixieCloudStatus is the hub's readiness, per component.
            properties:
              agents:
                items:
                  description: PixieCloudAgentStatus is what the hub knows of one
                    agent cluster.
                  properties:
                    clusterID:
                      description: ClusterID is the id the hub registered the cluster
                        under; empty while it is not registered.
                      type: string
                    connected:
                      description: Connected is true while that Vizier heartbeats.
                      type: boolean
                    deployKeySecret:
                      description: DeployKeySecret is the Secret in this namespace
                        that holds the cluster's deploy key.
                      type: string
                    metricsConnected:
                      description: MetricsConnected is true while the hub Prometheus
                        reads the cluster's metrics.
                      type: boolean
                    name:
                      type: string
                    registered:
                      description: Registered is true once a Vizier registered with
                        the cluster's key.
                      type: boolean
                  required:
                  - connected
                  - metricsConnected
                  - name
                  - registered
                  type: object
                type: array
              caCertificate:
                description: CACertificate is the hub's public trust root (PEM), which
                  every agent verifies the hub with.
                type: string
              components:
                items:
                  description: ObservabilityComponentStatus is one deployable component's
                    readiness.
                  properties:
                    message:
                      description: Message says why it is not ready.
                      type: string
                    name:
                      type: string
                    ready:
                      description: Ready is true when every replica the component
                        wants is available.
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              ready:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
