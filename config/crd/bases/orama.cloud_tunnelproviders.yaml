---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tunnelproviders.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: TunnelProvider
    listKind: TunnelProviderList
    plural: tunnelproviders
    shortNames:
    - tunprov
    singular: tunnelprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TunnelProvider is the vendor, account and credentials a Tunnel in its namespace may use. A
          TunnelProvider named "default" is the provider for the namespace's Lake-granted tunnels.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelProviderSpec carries the vendor, the account and the
              credentials behind a Tunnel.
            properties:
              cloudflare:
                description: Cloudflare holds the customer's own Cloudflare account
                  settings.
                properties:
                  accountId:
                    description: AccountID is the customer's Cloudflare account id.
                    minLength: 1
                    type: string
                  apiTokenSecretRef:
                    description: |-
                      APITokenSecretRef is the customer's API token, with Cloudflare Tunnel edit, Access apps and
                      policies edit and DNS edit permissions on that account and zone. It is a projection of a
                      workspace secret; the operator never writes or logs it.
                    properties:
                      key:
                        description: Key is the key in the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret's name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  domain:
                    description: |-
                      Domain is the DNS name under which each tunnel gets its hostname, tunnel-<grant id>.<domain>.
                      It must be in ZoneID.
                    minLength: 1
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]{2,}$
                    type: string
                  zoneId:
                    description: ZoneID is the customer's Cloudflare zone that holds
                      the tunnel hostnames.
                    minLength: 1
                    type: string
                required:
                - accountId
                - apiTokenSecretRef
                - domain
                - zoneId
                type: object
              customerId:
                description: |-
                  CustomerID is the Lake customer this provider belongs to. A Tunnel of another customer cannot
                  use it.
                format: uuid
                type: string
              type:
                description: Type is zetta (Orama's own zetta-tunnel) or cloudflare
                  (the customer's own account).
                enum:
                - zetta
                - cloudflare
                type: string
            required:
            - customerId
            - type
            type: object
            x-kubernetes-validations:
            - message: a cloudflare provider needs spec.cloudflare
              rule: self.type != 'cloudflare' || has(self.cloudflare)
            - message: a zetta provider takes no cloudflare settings
              rule: self.type != 'zetta' || !has(self.cloudflare)
          status:
            description: TunnelProviderStatus reports whether the provider can be
              used.
            properties:
              conditions:
                description: Conditions contains the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
