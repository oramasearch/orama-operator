---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: backupschedules.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: BackupSchedule
    listKind: BackupScheduleList
    plural: backupschedules
    shortNames:
    - bsched
    singular: backupschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.datastore.name
      name: Datastore
      type: string
    - jsonPath: .spec.datastore.kind
      name: Kind
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastSuccessTime
      name: Last success
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupSchedule takes a Backup of one datastore on a cron schedule and deletes those past
          retention. Deleting it keeps every Backup it made.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupScheduleSpec is the desired state of a BackupSchedule.
            properties:
              bucket:
                description: Bucket is where backups are written.
                properties:
                  kind:
                    default: CloudflareR2Bucket
                    description: Kind is the bucket resource's kind. Only CloudflareR2Bucket
                      today.
                    enum:
                    - CloudflareR2Bucket
                    type: string
                  name:
                    description: Name is the bucket resource's name.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the bucket resource's namespace; empty means the backup's own. A bucket in
                      another namespace must list this namespace in its spec.credentials.allowedNamespaces.
                    type: string
                required:
                - name
                type: object
              datastore:
                description: Datastore is what is backed up.
                properties:
                  connectionSecretRef:
                    description: |-
                      ConnectionSecretRef names a Secret in the namespace with the datastore's connection: keys
                      `host` and `username` and `password`, and optionally `port` and `database`. The backup Job
                      reads it as environment variables; the operator never copies it. Required for the kinds whose
                      backup Job talks to the server (ClickHouse, Zetta, Valkey); the kinds whose own operator
                      takes the backup need none.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  kind:
                    description: Kind is the datastore's kind; it selects the backup
                      mechanism.
                    enum:
                    - Postgres
                    - ClickHouse
                    - Zetta
                    - Kafka
                    - Cassandra
                    - TiDB
                    - Valkey
                    - SQLite
                    - DuckDB
                    - Polars
                    - Volume
                    type: string
                  name:
                    description: |-
                      Name is the datastore's name in the namespace (its Service or resource name). It is part
                      of the default bucket path and labels each Backup.
                    minLength: 1
                    type: string
                  podSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      PodSelector selects the datastore's pods. While a backup or restore runs, the operator lets
                      those pods accept the run's pod, and, for a kind whose server writes to the bucket itself
                      (ClickHouse, TiDB, Cassandra), reach public HTTPS on 443 (operator#740). Empty means the
                      kind's default: the labels its operator puts on the pods of a datastore of this name.
                    type: object
                  volume:
                    description: |-
                      Volume is how a volume-backed datastore (Volume, SQLite, DuckDB, Polars; name is then the
                      volume claim) is read: the backup takes a CSI VolumeSnapshot of the claim, mounts a claim made
                      from it read-only in the backup Job, and copies its files to the bucket (operator#738,
                      operator#737).
                    properties:
                      runAsGroup:
                        format: int64
                        minimum: 1
                        type: integer
                      runAsUser:
                        description: |-
                          RunAsUser and RunAsGroup are the user and group the copy runs as, so it can read files only
                          their owner may: the workload's own. Default 65532.
                        format: int64
                        minimum: 1
                        type: integer
                      volumeSnapshotClassName:
                        description: |-
                          VolumeSnapshotClassName is the class of the snapshot the copy is made from. Empty means
                          lake-retain, the Retain class the platform layer installs.
                        type: string
                    type: object
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: connectionSecretRef is required for a ClickHouse, Zetta
                    or Valkey datastore
                  rule: '!(self.kind in [''ClickHouse'', ''Zetta'', ''Valkey'']) ||
                    has(self.connectionSecretRef)'
              keep:
                default: 7
                description: |-
                  Keep is how many succeeded backups are kept; older ones are deleted with their objects. The
                  newest succeeded backup is never deleted. Default 7.
                format: int32
                minimum: 1
                type: integer
              path:
                description: |-
                  Path is the prefix in the bucket; each Backup writes under <path>/<backup name>/. Empty means
                  <namespace>/<datastore kind>/<datastore name>, in lower case.
                pattern: ^[a-z0-9]([a-z0-9._/-]*[a-z0-9])?$
                type: string
              schedule:
                default: 0 3 * * *
                description: Schedule is a five-field cron expression, in UTC. Default
                  daily at 03:00.
                type: string
              suspend:
                description: Suspend stops new backups without deleting any.
                type: boolean
            required:
            - bucket
            - datastore
            type: object
          status:
            description: BackupScheduleStatus is the observed state of a BackupSchedule.
            properties:
              conditions:
                description: |-
                  Conditions: Ready (the schedule can run: valid schedule, a mechanism for the datastore kind),
                  LastBackupSucceeded (the newest finished Backup's outcome, in the words of what refused), and
                  OnSchedule (False when a whole tick has passed without a succeeded backup).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastScheduleTime:
                description: LastScheduleTime is the tick of the newest Backup this
                  schedule created.
                format: date-time
                type: string
              lastSuccessTime:
                description: LastSuccessTime is when the newest succeeded Backup completed.
                format: date-time
                type: string
              lastSuccessfulBackup:
                description: LastSuccessfulBackup names the newest succeeded Backup.
                type: string
              nextScheduleTime:
                description: NextScheduleTime is the next tick.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
