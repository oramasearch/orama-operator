---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tunnels.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    shortNames:
    - tun
    singular: tunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.provider
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Tunnel lets one person reach one target from outside the cluster,
          for a time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TunnelSpec lets one person reach one target from outside the cluster until ExpiresAt.
              It names no vendor: the provider resource it points at decides what carries it.
            properties:
              clientCAPEM:
                description: |-
                  ClientCAPEM is the public CA certificate (PEM) that signs this grant's client certificates
                  (Lake's per-customer CA, lake migration 0085_network_tunnel_ca). Used by the ZettaTunnel
                  provider only.
                type: string
              customerId:
                description: CustomerID is Lake's immutable customer id.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: customerId is immutable
                  rule: self == oldSelf
              expiresAt:
                description: ExpiresAt ends the grant. The provider is torn down at
                  that time.
                format: date-time
                type: string
              generation:
                description: Generation is Lake's desired-row generation, acknowledged
                  in status and Postgres.
                format: int64
                minimum: 1
                type: integer
              grantId:
                description: |-
                  GrantID is the immutable network_tunnel_grants row id. It is the identity the developer's
                  client certificate carries (urn:orama:tunnel-grant:<id>).
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: grantId is immutable
                  rule: self == oldSelf
              lakeRef:
                description: LakeRef names the cluster-scoped Lake whose control plane
                  granted this tunnel.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: lakeRef is immutable
                  rule: self == oldSelf
              port:
                description: Port is the target's Kubernetes Service port the tunnel
                  reaches, and nothing else.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              providerRef:
                description: |-
                  ProviderRef names a TunnelProvider in this namespace. Empty selects Orama's own provider,
                  ZettaTunnel.
                type: string
              revokedAt:
                description: RevokedAt, when set, ends the grant at once.
                format: date-time
                type: string
              subject:
                description: |-
                  Subject is the e-mail address of the person, used only by providers that authenticate
                  people themselves (Cloudflare Access). Empty for ZettaTunnel.
                type: string
              targetId:
                description: TargetID is the Lake id of the one service or app the
                  tunnel reaches.
                format: uuid
                type: string
              targetKind:
                description: TargetKind identifies the workload family selected by
                  TargetID.
                enum:
                - service
                - app
                type: string
              userId:
                description: UserID is the Lake user the grant is for. Only that person
                  can obtain its credential.
                format: uuid
                type: string
              workspaceId:
                description: WorkspaceID is Lake's immutable workspace id. The resource
                  lives in that workspace's namespace.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: workspaceId is immutable
                  rule: self == oldSelf
            required:
            - customerId
            - expiresAt
            - generation
            - grantId
            - lakeRef
            - port
            - targetId
            - targetKind
            - userId
            - workspaceId
            type: object
          status:
            description: TunnelStatus is the stable observation returned to network_tunnel_grant_status.
            properties:
              conditions:
                description: Conditions contains the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: |-
                  Endpoint is what the developer's client connects to: the relay's public host:port for
                  ZettaTunnel, the Access-protected hostname for CloudflareTunnel.
                type: string
              message:
                description: Message explains the phase without exposing credentials.
                type: string
              observedGeneration:
                description: ObservedGeneration is the Lake desired-row generation
                  represented by this status.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, Expired, Revoked or Failed.
                type: string
              provider:
                description: 'Provider is the concrete kind carrying the tunnel: ZettaTunnel
                  or CloudflareTunnel.'
                type: string
              relayCAPEM:
                description: |-
                  RelayCAPEM is the CA certificate (PEM) of the relay's server certificate, so the client can
                  verify the relay. Empty for providers without a relay.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
