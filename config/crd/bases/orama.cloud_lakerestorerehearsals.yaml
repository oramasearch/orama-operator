---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakerestorerehearsals.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: LakeRestoreRehearsal
    listKind: LakeRestoreRehearsalList
    plural: lakerestorerehearsals
    shortNames:
    - lrr
    singular: lakerestorerehearsal
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.lakeRef
      name: Lake
      type: string
    - jsonPath: .spec.service
      name: Service
      type: string
    - jsonPath: .spec.operation
      name: Operation
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.completedAt
      name: Completed
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LakeRestoreRehearsal is the Schema for Lake data-service lifecycle
          rehearsals.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LakeRestoreRehearsalSpec defines a lifecycle rehearsal for
              one Lake data service.
            properties:
              from:
                default: latest
                description: |-
                  From selects what is restored. Empty or latest selects the newest completed CNPG Backup
                  (postgres) or the newest ready VolumeSnapshot the operator took of the store (store). Any
                  other value is the name of a Backup owned by the Lake control DB, or of an operator-taken
                  store VolumeSnapshot, in the Lake's namespace.
                type: string
              lakeRef:
                description: LakeRef names the cluster-scoped Lake whose data service
                  is rehearsed.
                minLength: 1
                type: string
              operation:
                description: Operation selects the lifecycle procedure.
                enum:
                - restore
                - upgrade
                - failover
                type: string
              service:
                description: |-
                  Service is what is rehearsed: postgres, the CNPG control database restored from its CNPG
                  object-store Backups, or store, Lake's store volume restored from the operator's CSI
                  VolumeSnapshots of it (docs/lake/volume-snapshots.md). The store supports only restore.
                enum:
                - postgres
                - store
                type: string
              targetImage:
                description: |-
                  TargetImage is the CloudNativePG PostgreSQL operand image tested by an upgrade rehearsal.
                  It is required when operation is upgrade and ignored by other operations.
                type: string
            required:
            - lakeRef
            - operation
            - service
            type: object
            x-kubernetes-validations:
            - message: rehearsal spec is immutable
              rule: self == oldSelf
            - message: targetImage is required for upgrade
              rule: self.operation != 'upgrade' || (has(self.targetImage) && size(self.targetImage)
                > 0)
            - message: the store service supports only the restore operation
              rule: self.service != 'store' || self.operation == 'restore'
          status:
            description: LakeRestoreRehearsalStatus records a durable lifecycle rehearsal
              outcome.
            properties:
              completedAt:
                description: CompletedAt is set once with the terminal outcome and
                  Lake status recording.
                format: date-time
                type: string
              evidence:
                description: |-
                  Evidence is what the verifier reported on success or failure: for a store restore, the
                  restored volume's file count, size and top-level entries.
                type: string
              message:
                description: Message describes the current stage or terminal outcome.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Running, Succeeded, or Failed.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              previousPrimary:
                description: PreviousPrimary is the primary observed before a failover
                  rehearsal.
                type: string
              scratchNamespace:
                description: ScratchNamespace contains the isolated recovery cluster
                  for restore and upgrade operations.
                type: string
              selectedBackup:
                description: SelectedBackup is the CNPG Backup object selected for
                  a restore or upgrade.
                type: string
              selectedSnapshot:
                description: |-
                  SelectedSnapshot is the store VolumeSnapshot selected for a store restore, in the Lake's
                  namespace.
                type: string
              startedAt:
                description: StartedAt is set once when the controller accepts the
                  rehearsal.
                format: date-time
                type: string
              targetPrimary:
                description: TargetPrimary is the healthy replica selected for a failover
                  rehearsal.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
