---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudflarer2buckets.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: CloudflareR2Bucket
    listKind: CloudflareR2BucketList
    plural: cloudflarer2buckets
    shortNames:
    - cfr2
    singular: cloudflarer2bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Bucket
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudflareR2Bucket is an R2 (S3-compatible) bucket the operator provisions via the CF API,
          owned by an OramaCloudV1 CR or written for backups. On delete a finalizer revokes the bucket's
          scoped token and, with deletionPolicy Delete only, deletes the bucket from Cloudflare.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudflareR2BucketSpec is the desired state of an R2 bucket. The API token + account come
              from the referenced Secret (keys `token` + `accountID`).
            properties:
              cors:
                description: CORS, when set, replaces the bucket's whole CORS configuration.
                  Unset leaves it alone.
                items:
                  description: CloudflareR2CORSRule allows browser requests from the
                    listed origins.
                  properties:
                    allowedHeaders:
                      items:
                        type: string
                      type: array
                    allowedMethods:
                      items:
                        enum:
                        - GET
                        - PUT
                        - POST
                        - DELETE
                        - HEAD
                        type: string
                      type: array
                    allowedOrigins:
                      items:
                        type: string
                      type: array
                    maxAgeSeconds:
                      format: int32
                      maximum: 86400
                      minimum: 0
                      type: integer
                  required:
                  - allowedMethods
                  - allowedOrigins
                  type: object
                type: array
              credentials:
                description: |-
                  Credentials, when set, has the operator mint an API token scoped to this one bucket (object
                  read and write, nothing else) and write its S3 credentials to a Secret. The account token in
                  SecretRef never leaves this namespace. The bucket token is revoked when the resource is
                  deleted, whatever the deletion policy.
                properties:
                  allowedNamespaces:
                    description: |-
                      AllowedNamespaces lists the other namespaces whose backups may use this bucket. The operator
                      copies the bucket-scoped Secret into a backup's namespace only when it is listed here.
                    items:
                      type: string
                    type: array
                  secretName:
                    description: |-
                      SecretName is the Secret the operator writes in this namespace, with keys `accessKeyId`,
                      `secretAccessKey`, `endpoint`, `bucket` and `region`.
                    minLength: 1
                    type: string
                required:
                - secretName
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy is required and has no default: whoever writes the resource chooses whether
                  deleting it deletes the bucket and everything in it (Delete) or keeps it (Retain).
                enum:
                - Delete
                - Retain
                type: string
              expireAfterDays:
                description: |-
                  ExpireAfterDays deletes objects this many days after they were written through the
                  operator-owned lifecycle rule "orama-expire". Unset leaves lifecycle rules alone.
                format: int32
                minimum: 1
                type: integer
              name:
                description: Name is the R2 bucket name.
                type: string
              secretRef:
                description: SecretRef names the Secret holding the Cloudflare credentials
                  (`token`, `accountID`).
                type: string
            required:
            - deletionPolicy
            - name
            - secretRef
            type: object
          status:
            description: CloudflareR2BucketStatus is the observed state.
            properties:
              created:
                type: boolean
              credentialsSecret:
                description: CredentialsSecret is the Secret holding the bucket-scoped
                  S3 credentials, once written.
                type: string
              credentialsTokenID:
                description: |-
                  CredentialsTokenID is the id of the bucket-scoped token the operator minted; it is also the
                  S3 access key id. Not a secret.
                type: string
              message:
                type: string
              ready:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
