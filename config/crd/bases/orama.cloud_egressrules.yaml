---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: egressrules.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: EgressRule
    listKind: EgressRuleList
    plural: egressrules
    shortNames:
    - egr
    singular: egressrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.dnsName
      name: DNS name
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EgressRule lets workloads of a workspace reach one outside destination
          by address or by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EgressRuleSpec lets workloads of one workspace reach one outside destination (operator#470).
              Exactly one of cidr, dnsName and publicInternet is set.
            properties:
              cidr:
                description: |-
                  CIDR is an outside address range, enforced by generated policy. Cluster addresses inside it
                  (nodes, pods, the API server, link-local and loopback) are never reachable through a rule.
                type: string
              customerId:
                description: CustomerID is Lake's customer id.
                format: uuid
                type: string
              desired:
                description: Desired removes the rule's allowances before the CR is
                  deleted when set to absent.
                enum:
                - present
                - absent
                type: string
              dnsName:
                description: |-
                  DNSName is an exact host name, enforced by zetta-tunnel's egress gateway: the workload may
                  reach only the gateway, which resolves and authorizes by name.
                maxLength: 253
                type: string
              generation:
                description: Generation is Lake's desired-row generation, acknowledged
                  in status and Postgres.
                format: int64
                minimum: 1
                type: integer
              lakeRef:
                description: LakeRef names the cluster-scoped Lake that materialized
                  this rule.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: lakeRef is immutable
                  rule: self == oldSelf
              ports:
                description: Ports are destination TCP ports.
                items:
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              publicInternet:
                description: |-
                  PublicInternet is every public address (private, shared, link-local, multicast, reserved
                  and cluster ranges excluded): what a workspace's internetEgress has always allowed.
                type: boolean
              ruleId:
                description: |-
                  RuleID is the network_egress_rules row id. Empty for the operator's own rule that carries a
                  workspace's internetEgress.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: ruleId is immutable
                  rule: self == oldSelf
              sourceId:
                format: uuid
                type: string
              sourceKind:
                description: |-
                  SourceKind and SourceID select the workload the rule applies to. Unset: every workload in
                  the workspace.
                enum:
                - app
                - service
                - agent
                type: string
              workspaceId:
                description: WorkspaceID is Lake's workspace id. The rule lives in
                  that workspace's namespace.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: workspaceId is immutable
                  rule: self == oldSelf
            required:
            - desired
            - generation
            - lakeRef
            - ports
            - workspaceId
            type: object
            x-kubernetes-validations:
            - message: exactly one of cidr, dnsName and publicInternet is required
              rule: '(has(self.cidr) ? 1 : 0) + (has(self.dnsName) ? 1 : 0) + ((has(self.publicInternet)
                && self.publicInternet) ? 1 : 0) == 1'
            - message: sourceKind and sourceId are set together
              rule: has(self.sourceKind) == has(self.sourceId)
            - message: publicInternet is the operator's own rule for a workspace's
                internetEgress
              rule: '!(has(self.publicInternet) && self.publicInternet) || !has(self.ruleId)'
          status:
            description: EgressRuleStatus is the observation returned to network_egress_rule_status.
            properties:
              conditions:
                description: Conditions contains the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message explains the phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the Lake generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, Failed or Deleted.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
