---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: connections.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    shortNames:
    - conn
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceKind
      name: Source
      type: string
    - jsonPath: .spec.targetKind
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Connection permits one Lake workload to reach one target on explicit
          ports.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConnectionSpec is one Lake-declared path between two workloads
              in the same workspace.
            properties:
              connectionId:
                description: ConnectionID is the immutable network_connections row
                  id.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: connectionId is immutable
                  rule: self == oldSelf
              credentialScope:
                description: |-
                  CredentialScope, when set, issues a credential for this connection only: a role in the target
                  service's datastore with these grants, delivered as a workspace secret. It is valid only from
                  an app to a service. A new Generation rotates the credential.
                properties:
                  access:
                    description: Access is read (query only) or write (read plus insert,
                      update and delete; never DDL).
                    enum:
                    - read
                    - write
                    type: string
                  schema:
                    description: Schema limits the role to one schema. Empty means
                      every schema of the service's database.
                    maxLength: 63
                    pattern: ^[A-Za-z_][A-Za-z0-9_$]*$
                    type: string
                required:
                - access
                type: object
              customerId:
                description: CustomerID is Lake's immutable customer id.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: customerId is immutable
                  rule: self == oldSelf
              desired:
                description: Desired removes the rendered path before the CR is deleted
                  when set to absent.
                enum:
                - present
                - absent
                type: string
              generation:
                description: Generation is Lake's desired-row generation, acknowledged
                  in status and Postgres.
                format: int64
                minimum: 1
                type: integer
              lakeRef:
                description: LakeRef names the cluster-scoped Lake that materialized
                  this connection.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: lakeRef is immutable
                  rule: self == oldSelf
              ports:
                description: |-
                  Ports are destination TCP ports. Empty means every port exposed by the target's Kubernetes
                  Services; it never means every pod port.
                items:
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                type: array
                x-kubernetes-list-type: set
              sourceId:
                description: SourceID is the Lake id of the source app, service, agent
                  or tunnel grant.
                format: uuid
                type: string
              sourceKind:
                description: SourceKind identifies the workload family selected by
                  SourceID.
                enum:
                - app
                - service
                - agent
                - tunnel
                type: string
              targetId:
                description: TargetID is the Lake id of the destination service or
                  app.
                format: uuid
                type: string
              targetKind:
                description: TargetKind identifies the workload family selected by
                  TargetID.
                enum:
                - service
                - app
                type: string
              workspaceId:
                description: WorkspaceID is Lake's immutable workspace id. The CR
                  must live in that workspace's namespace.
                format: uuid
                type: string
                x-kubernetes-validations:
                - message: workspaceId is immutable
                  rule: self == oldSelf
            required:
            - connectionId
            - customerId
            - desired
            - generation
            - lakeRef
            - sourceId
            - sourceKind
            - targetId
            - targetKind
            - workspaceId
            type: object
            x-kubernetes-validations:
            - message: credentialScope is valid only from an app to a service
              rule: '!has(self.credentialScope) || (self.sourceKind == ''app'' &&
                self.targetKind == ''service'')'
          status:
            description: ConnectionStatus is the stable observation returned to network_connection_status.
            properties:
              conditions:
                description: Conditions contains the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialGeneration:
                description: |-
                  CredentialGeneration is the Lake generation the current credential was issued for. A spec
                  Generation above it is a rotation request.
                format: int64
                type: integer
              credentialRole:
                description: CredentialRole is the datastore role issued for this
                  connection.
                type: string
              credentialSecret:
                description: |-
                  CredentialSecret is the workspace secret holding the issued credential, as
                  lake-secret://<mount id>/<name>. It never holds the credential itself.
                type: string
              message:
                description: Message explains the phase without exposing credentials.
                type: string
              observedGeneration:
                description: ObservedGeneration is the Lake desired-row generation
                  represented by this status.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, Failed or Deleted.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
