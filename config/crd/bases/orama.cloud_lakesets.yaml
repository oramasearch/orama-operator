---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: lakesets.orama.cloud
spec:
  group: orama.cloud
  names:
    kind: LakeSet
    listKind: LakeSetList
    plural: lakesets
    shortNames:
    - lset
    singular: lakeset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.purpose
      name: Purpose
      type: string
    - jsonPath: .status.members
      name: Members
      type: integer
    - jsonPath: .status.readyMembers
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.e2eSummary
      name: E2E
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LakeSet installs Lake instances onto clusters this one manages and keeps their versions and
          settings as described: one template, and one member per instance per cluster. It also runs
          lake's end-to-end suite against its members (spec.e2eTests).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LakeSetSpec is a ManagedSetSpec plus the end-to-end runs and the restore rehearsals against its
              members.
            properties:
              clusters:
                description: |-
                  Clusters are the members: one instance on one cluster each. Members are independent: none
                  waits for another. Every member's cluster must carry the same `purpose` tag: a set never
                  combines nonprod and production. At most 64: OramaCloudV1Set's CEL rule that each migration
                  names one member loops over them, and the API server refuses a rule over an unbounded list.
                items:
                  description: SetMember is one instance on one cluster.
                  properties:
                    clusterRef:
                      description: ClusterRef names the KubernetesCluster the instance
                        runs on.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the instance's name on that cluster.
                      maxLength: 40
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: |-
                        Namespace is the instance's own namespace on that cluster. Default: the kind's prefix and
                        Name (lake-<name>, v1-<name>). No two members on one cluster share a namespace.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    secrets:
                      description: |-
                        Secrets are this member's own, added to the set's. One with the same name on the member's
                        cluster as a set secret replaces it for this member.
                      items:
                        description: |-
                          SetSecret names a Secret on this cluster that is copied into a member's namespace on its
                          cluster before the instance is applied.
                        properties:
                          as:
                            description: |-
                              As is the Secret's name on the member's cluster. Default: Name. A member's secret replaces
                              the set's secret that has the same name there.
                            type: string
                          name:
                            minLength: 1
                            type: string
                          namespace:
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      type: array
                    spec:
                      description: |-
                        Spec is this member's own settings, merged over the template: a field here wins over the
                        template's, an object is merged field by field, and a list replaces the template's list.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - clusterRef
                  - name
                  type: object
                maxItems: 64
                minItems: 1
                type: array
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy says what happens to an instance when its member is removed or the set is
                  deleted. Retain (the default) leaves it running.
                enum:
                - Retain
                - Delete
                type: string
              e2eTests:
                description: |-
                  E2ETests run lake's end-to-end suite against members of this set: each becomes a
                  LakeE2ETest named Name on its member's cluster, with spec.member set to this set and the
                  member. It is the testing -> staging gate of a substantial lake release. Changing an entry's
                  spec (spec.runID) runs the suite again; removing the entry deletes the test and its Job there.
                items:
                  description: SetE2ETest is one end-to-end run against one member.
                  properties:
                    member:
                      description: Member names the set member (SetMember.Name) the
                        suite runs against.
                      maxLength: 40
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Name is the LakeE2ETest's name on the member's cluster. LakeE2ETest is cluster-scoped, so it
                        is unique on that cluster.
                      maxLength: 52
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    spec:
                      description: |-
                        Spec is the LakeE2ETest's spec: image (by digest), runID, env, pullSecretName,
                        timeoutSeconds. member is filled in from this set and Member, and targetRef is refused. A
                        Secret it names (the Clerk key in env) must be in the member's namespace: give it to the
                        member through the set's or the member's secrets.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - member
                  - name
                  - spec
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              restoreRehearsals:
                description: |-
                  RestoreRehearsals rehearse a restore of members' data into throwaway resources: each becomes
                  a LakeRestoreRehearsal named Name on its member's cluster, with spec.lakeRef set to the
                  member's Lake. A rehearsal never touches the live data (docs/lake/restore-rehearsals.md). A
                  rehearsal's spec cannot change once applied: to run one again, add an entry under a new name.
                  Removing the entry deletes the rehearsal there, and anything of it still running.
                items:
                  description: SetRestoreRehearsal is one restore rehearsal against
                    one member.
                  properties:
                    member:
                      description: Member names the set member (SetMember.Name) whose
                        Lake is rehearsed.
                      maxLength: 40
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Name is the LakeRestoreRehearsal's name on the member's cluster. LakeRestoreRehearsal is
                        cluster-scoped, so it is unique on that cluster.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    spec:
                      description: |-
                        Spec is the LakeRestoreRehearsal's spec without lakeRef, which the set fills in: service
                        (postgres or store), operation, from, targetImage.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - member
                  - name
                  - spec
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              secrets:
                description: |-
                  Secrets are copied from this cluster into every member's namespace before its instance is
                  applied, and kept in step afterwards.
                items:
                  description: |-
                    SetSecret names a Secret on this cluster that is copied into a member's namespace on its
                    cluster before the instance is applied.
                  properties:
                    as:
                      description: |-
                        As is the Secret's name on the member's cluster. Default: Name. A member's secret replaces
                        the set's secret that has the same name there.
                      type: string
                    name:
                      minLength: 1
                      type: string
                    namespace:
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              template:
                description: |-
                  Template is the instance's spec (a Lake's, an OramaCloudV1's), the default for every
                  member. It is validated by each member's cluster when applied, and what that cluster
                  refuses is reported on the member.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - clusters
            - template
            type: object
            x-kubernetes-validations:
            - message: every e2eTests[].member must name exactly one clusters[].name
              rule: '!has(self.e2eTests) || self.e2eTests.all(t, self.clusters.exists_one(c,
                c.name == t.member))'
            - message: every restoreRehearsals[].member must name exactly one clusters[].name
              rule: '!has(self.restoreRehearsals) || self.restoreRehearsals.all(t,
                self.clusters.exists_one(c, c.name == t.member))'
          status:
            description: |-
              LakeSetStatus is a ManagedSetStatus plus the end-to-end runs. The set's phase does not depend
              on them.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              e2eSummary:
                description: |-
                  E2ESummary is each declared run's phase and counts ("testing-gate Succeeded 336/0/0").
                  Empty when the set declares none.
                type: string
              e2eTests:
                description: |-
                  E2ETests reports each declared run in the order the set lists them, then those still being
                  removed.
                items:
                  description: SetE2ETestStatus is one end-to-end run as its member's
                    cluster reports it.
                  properties:
                    cluster:
                      description: Cluster is where it was applied. One removed from
                        the set is deleted there.
                      type: string
                    fail:
                      format: int32
                      type: integer
                    jobName:
                      description: JobName is the Job of the latest run, in the member's
                        namespace.
                      type: string
                    lakeRevision:
                      description: LakeRevision is the revision of the Lake the latest
                        run tested.
                      type: string
                    member:
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    pass:
                      description: Pass, Fail and Skip count the latest run's steps.
                      format: int32
                      type: integer
                    phase:
                      description: |-
                        Phase is the LakeE2ETest's own phase (Pending, Running, Succeeded, Failed), Pending while the
                        set waits to apply it or its cluster has not started the latest run, Blocked when the set
                        refuses to apply it, or Removing while it is being deleted. Message says why.
                      type: string
                    runID:
                      description: RunID is the latest run's LAKE_E2E_RUN_ID.
                      type: string
                    skip:
                      format: int32
                      type: integer
                  required:
                  - member
                  - name
                  type: object
                type: array
              memberStatuses:
                description: MemberStatuses reports each member, in the order the
                  set lists them.
                items:
                  description: SetMemberStatus is one instance as its cluster reports
                    it.
                  properties:
                    cluster:
                      type: string
                    message:
                      description: Message says why the member is not Ready, in the
                        words of whatever refused or reported it.
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    phase:
                      description: |-
                        Phase is Pending (waiting for the cluster or a prerequisite), Progressing (applied, not
                        yet Ready), Ready or Degraded.
                      type: string
                    version:
                      description: 'Version is what the instance runs: a Lake''s image,
                        an OramaCloudV1''s image tag.'
                      type: string
                  required:
                  - cluster
                  - name
                  type: object
                type: array
              members:
                format: int32
                type: integer
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Ready (every member Ready), Progressing, or Degraded (the set was refused or a
                  member failed).
                type: string
              purpose:
                description: Purpose is the `purpose` tag every member's cluster carries.
                type: string
              readyMembers:
                format: int32
                type: integer
              restoreRehearsals:
                description: |-
                  RestoreRehearsals reports each declared rehearsal in the order the set lists them, then
                  those still being removed. They do not change the set's phase.
                items:
                  description: SetRestoreRehearsalStatus is one restore rehearsal
                    as its member's cluster reports it.
                  properties:
                    cluster:
                      description: Cluster is where it was applied.
                      type: string
                    completedAt:
                      description: CompletedAt is when the rehearsal finished on its
                        cluster.
                      format: date-time
                      type: string
                    evidence:
                      description: Evidence is what the rehearsal's verifier reported.
                      type: string
                    member:
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: |-
                        Phase is the LakeRestoreRehearsal's own phase (Pending, Running, Succeeded, Failed),
                        Pending while the set waits to apply it, Blocked when the set refuses to apply it, or
                        Removing while it is being deleted. Message says why.
                      type: string
                    selected:
                      description: Selected is the CNPG Backup or store VolumeSnapshot
                        the rehearsal restored.
                      type: string
                  required:
                  - member
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
