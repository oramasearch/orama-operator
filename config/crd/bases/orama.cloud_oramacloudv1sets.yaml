                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    secrets:
                      description: |-
                        Secrets are this member's own, added to the set's. One with the same name on the member's
                        cluster as a set secret replaces it for this member.
