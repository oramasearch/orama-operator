apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-cloudnative-pg
spec:
  chart:
    name: cloudnative-pg
    repository: https://cloudnative-pg.github.io/charts
    version: 0.29.0
  clusterRef: orama-production-cluster-03
  namespace: cnpg-system
  releaseName: cnpg
---
# Kept until every cluster is cut over to zetta-tunnel's ingress gateway (docs/infrastructure/ingress.md),
# then removed here, in every other platform.yaml and in helmfile.yaml together.
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-ingress-nginx
spec:
  chart:
    name: ingress-nginx
    repository: https://kubernetes.github.io/ingress-nginx
    version: 4.15.1
  clusterRef: orama-production-cluster-03
  namespace: ingress-nginx
  releaseName: ingress-nginx
  values:
    controller:
      # operator#719: the client address from CF-Connecting-IP only for Cloudflare's ranges
      # (helmfile.yaml has the reasons; both paths install the same values).
      # LSR-208: identical app-only credential filtering on every installation path.
      proxySetHeaders:
        Authorization: $orama_app_authorization
        Cookie: $orama_app_cookie
      config:
        http-snippet: |
          map $ingress_name $orama_tenant_app {
            default 0;
            "~^app(-[0-9a-f]{12})?$" 1;
          }
          map $orama_tenant_app $orama_app_authorization {
            default $http_authorization;
            1 "";
          }
          map "$orama_tenant_app:$http_cookie" $orama_app_cookie {
            default $http_cookie;
            "~*^1:([[:space:]]*|.*[;,][[:space:]]*)(__Host-|__Secure-)?lake_session[[:space:]]*=" "";
          }
        forwarded-for-header: CF-Connecting-IP
        proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
        enable-real-ip: "true"
      ingressClassResource:
        default: true
      service:
        externalTrafficPolicy: Local
        type: LoadBalancer
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-cert-manager
spec:
  chart:
    name: cert-manager
    repository: https://charts.jetstack.io
    version: v1.21.2
  clusterRef: orama-production-cluster-03
  namespace: cert-manager
  releaseName: cert-manager
  values:
    crds:
      enabled: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-strimzi
spec:
  chart:
    name: strimzi-kafka-operator
    repository: https://strimzi.io/charts/
    version: 1.2.0
  clusterRef: orama-production-cluster-03
  namespace: strimzi-system
  releaseName: strimzi
  values:
    extraEnvs:
    - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
      value: restricted
    watchAnyNamespace: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-clickhouse-operator
spec:
  chart:
    name: altinity-clickhouse-operator
    repository: https://helm.altinity.com
    version: 0.27.4
  clusterRef: orama-production-cluster-03
  namespace: clickhouse-system
  releaseName: clickhouse-operator
  values:
    configs:
      files:
        config.yaml:
          watch:
            namespaces:
              include:
              - ".*"
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-k8ssandra-operator
spec:
  chart:
    name: k8ssandra-operator
    repository: https://helm.k8ssandra.io/stable
    version: 1.33.0
  clusterRef: orama-production-cluster-03
  dependsOn:
  - prod3-cert-manager
  namespace: k8ssandra-operator
  releaseName: k8ssandra-operator
  values:
    global:
      clusterScoped: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod3-tidb-operator
spec:
  chart:
    name: tidb-operator
    repository: https://charts.pingcap.com/
    version: v1.6.6
  clusterRef: orama-production-cluster-03
  crdURLs:
  - https://raw.githubusercontent.com/pingcap/tidb-operator/v1.6.6/manifests/crd.yaml
  namespace: tidb-admin
  releaseName: tidb-operator
---
apiVersion: orama.cloud/v1alpha1
