apiVersion: orama.cloud/v1alpha1
kind: KubernetesCluster
metadata:
  name: orama-nonprod-cluster-01
spec:
  deletionPolicy: Delete
  kubernetesVersion: '1.35'
  nodePools:
  - count: 1
    machineSize: Standard_D8as_v7
    maxCount: 5
    minCount: 1
    name: agentpool
    role: system
    zones:
    - '1'
    - '2'
    - '3'
  - machineSize: Standard_D8as_v7
    maxCount: 100
    minCount: 0
    name: userpool
    role: user
    zones:
    - '1'
    - '2'
    - '3'
  providerRef: azure-orama
  region: westus2
  tags:
    managed-by: orama-operator
    purpose: nonprod
    role: leaf
