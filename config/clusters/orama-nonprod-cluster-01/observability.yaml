# Nonprod's observability agent (docs/infrastructure/observability.md). It reports to production's
# hub on the managing cluster (config/clusters/observability-hub.yaml) over a PeerLink, so one hub
# shows every cluster (Steve, 2026-10-31: "I told you to include nonprod ... change the earlier
# decision"). Nonprod's own hub, which was on this cluster, is retired.
#
# Its alerts still go to #monitoring-stg, through its own receiver: production's receivers are
# never copied to a nonprod cluster.
#
# Secrets on the managing cluster, in orama-system, made outside git:
#   nonprod-alerts-slack           key `url`: the Slack incoming webhook to #monitoring-stg (app "Orama Alerts")
#   oramasearch-dockerhub-nonprod  nonprod's existing registry pull Secret
apiVersion: orama.cloud/v1alpha1
kind: ObservabilityAgent
metadata:
  name: orama-nonprod-cluster-01
spec:
  clusterRef: orama-nonprod-cluster-01
  hubRef: orama-production-cluster-01
  imagePullSecretRef:
    name: oramasearch-dockerhub-nonprod
    namespace: orama-system
  alerting:
    receivers:
      - name: nonprod-alerts
        severities: [critical, warning]
        slack:
          urlSecretRef: {name: nonprod-alerts-slack, namespace: orama-system, key: url}
