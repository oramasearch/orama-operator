apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-cloudnative-pg
spec:
  chart:
    name: cloudnative-pg
    repository: https://cloudnative-pg.github.io/charts
    version: 0.29.0
  clusterRef: orama-production-cluster-02
  namespace: cnpg-system
  releaseName: cnpg
---
# Kept until every cluster is cut over to zetta-tunnel's ingress gateway (docs/infrastructure/ingress.md),
# then removed here, in every other platform.yaml and in helmfile.yaml together.
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-ingress-nginx
spec:
  chart:
    name: ingress-nginx
    repository: https://kubernetes.github.io/ingress-nginx
    version: 4.15.1
  clusterRef: orama-production-cluster-02
  namespace: ingress-nginx
  releaseName: ingress-nginx
  values:
    controller:
      ingressClassResource:
        default: true
      service:
        externalTrafficPolicy: Local
        type: LoadBalancer
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-cert-manager
spec:
  chart:
    name: cert-manager
    repository: https://charts.jetstack.io
    version: v1.21.2
  clusterRef: orama-production-cluster-02
  namespace: cert-manager
  releaseName: cert-manager
  values:
    crds:
      enabled: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-strimzi
spec:
  chart:
    name: strimzi-kafka-operator
    repository: https://strimzi.io/charts/
    version: 1.2.0
  clusterRef: orama-production-cluster-02
  namespace: strimzi-system
  releaseName: strimzi
  values:
    extraEnvs:
    - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
      value: restricted
    watchAnyNamespace: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-clickhouse-operator
spec:
  chart:
    name: altinity-clickhouse-operator
    repository: https://helm.altinity.com
    version: 0.27.4
  clusterRef: orama-production-cluster-02
  namespace: clickhouse-system
  releaseName: clickhouse-operator
  values:
    configs:
      files:
        config.yaml:
          watch:
            namespaces:
              include:
              - ".*"
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-k8ssandra-operator
spec:
  chart:
    name: k8ssandra-operator
    repository: https://helm.k8ssandra.io/stable
    version: 1.33.0
  clusterRef: orama-production-cluster-02
  dependsOn:
  - prod2-cert-manager
  namespace: k8ssandra-operator
  releaseName: k8ssandra-operator
  values:
    global:
      clusterScoped: true
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-tidb-operator
spec:
  chart:
    name: tidb-operator
    repository: https://charts.pingcap.com/
    version: v1.6.6
  clusterRef: orama-production-cluster-02
  crdURLs:
  - https://raw.githubusercontent.com/pingcap/tidb-operator/v1.6.6/manifests/crd.yaml
  namespace: tidb-admin
  releaseName: tidb-operator
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: prod2-valkey-operator
spec:
  chart:
    name: valkey-operator
    repository: https://valkey.io/valkey-helm
    version: 0.6.0
  clusterRef: orama-production-cluster-02
  namespace: valkey-operator-system
  releaseName: valkey-operator
