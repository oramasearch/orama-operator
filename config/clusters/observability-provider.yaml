# Pixie's release (#455), on the managing cluster: the one build every hub and agent runs
# (docs/infrastructure/observability.md, rollout steps 1 and 4). Until it exists every
# ObservabilityHub and ObservabilityAgent stays Pending.
#
# Built on 2026-10-31 from branch `orama` of oramasearch/pixie at ab00bae32f6b: the vendored commit
# below plus hack/pixie-patches/0001-0004, amd64, with Pixie's release flags (-c opt --config=stamp
# --config=x86_64_sysroot). The upstream dependencies are private mirrors, copied by digest; each
# digest is the upstream's. Every repository is private (an anonymous lookup answers 404).
#
# postgres also carries its tag: CloudNativePG refuses an imageName that is only a digest ("Can't use just
# the image sha as we can't detect upgrades"), because it reads the major version from the tag. The tag
# 16.15 names the same digest in the mirror; the digest is what is pulled.
