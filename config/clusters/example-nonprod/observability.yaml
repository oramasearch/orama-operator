# An example, in the shape of a real deployment. The values are not Orama's: every name,
# host and id is a placeholder. See README.md in this folder.
apiVersion: orama.cloud/v1alpha1
kind: ObservabilityAgent
metadata:
  name: example-nonprod
spec:
  clusterRef: example-nonprod
  hubRef: example-management
  imagePullSecretRef:
    name: oramasearch-dockerhub-nonprod
    namespace: orama-system
  alerting:
    receivers:
      - name: nonprod-alerts
        severities: [critical, warning]
        slack:
          urlSecretRef: {name: nonprod-alerts-slack, namespace: orama-system, key: url}
