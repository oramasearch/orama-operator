---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: nonprod-kube-prometheus-stack
spec:
  chart:
    name: kube-prometheus-stack
    repository: https://prometheus-community.github.io/helm-charts
    version: 92.3.0
  clusterRef: example-nonprod
  namespace: monitoring
  releaseName: kube-prometheus-stack
  dependsOn:
  - nonprod-cert-manager
  imagePullSecretRef:
    name: oramasearch-dockerhub-nonprod
    namespace: orama-system
  imagePullSecretAs: oramasearch-dockerhub
  values:
    global:
      imagePullSecrets:
        - name: oramasearch-dockerhub
    grafana:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
      disabled:
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true
        KubeCPUQuotaOvercommit: true
        KubeMemoryQuotaOvercommit: true
    prometheusOperator:
      image:
        registry: docker.io
        repository: oramasearch/platform-prometheus-operator
        tag: v0.94.1
      prometheusConfigReloader:
        image:
          registry: docker.io
          repository: oramasearch/platform-prometheus-config-reloader
          tag: v0.94.1
      thanosImage:
        registry: docker.io
        repository: oramasearch/platform-thanos
        tag: v0.42.4
      admissionWebhooks:
        certManager:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    prometheus:
      prometheusSpec:
        image:
          registry: docker.io
          repository: oramasearch/platform-prometheus
          tag: v3.15.0-distroless
        retention: 15d
        retentionSize: 45GB
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        ruleSelector:
          matchExpressions:
            - key: orama.cloud/metrics-scope
              operator: NotIn
              values: ["hub"]
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        image:
          registry: docker.io
          repository: oramasearch/platform-alertmanager
          tag: v0.34.1
        alertmanagerConfigSelector:
          matchLabels:
            orama.cloud/alerting: "true"
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
    kube-state-metrics:
      image:
        registry: docker.io
        repository: oramasearch/platform-kube-state-metrics
        tag: v2.20.0
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      rbac:
        extraRules:
          - apiGroups: ["orama.cloud"]
            resources: ["oramacloudv1s", "peerconnections"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind: {group: orama.cloud, version: v1alpha1, kind: OramaCloudV1}
                metricNamePrefix: orama_oramacloudv1
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: phase
                    help: The stack's phase.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: phase
                        path: [status, phase]
                        list: [Progressing, Ready, Degraded]
                  - name: component_ready
                    help: 1 while the component is fully available.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, components]
                        labelsFromPath:
                          component: [name]
                        valueFrom: [ready]
              - groupVersionKind: {group: orama.cloud, version: v1alpha1, kind: PeerConnection}
                metricNamePrefix: orama_peerconnection
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: phase
                    help: The peer's phase.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: phase
                        path: [status, phase]
                        list: [Pending, Ready, Failed, Deleted]
    prometheus-node-exporter:
      image:
        registry: docker.io
        repository: oramasearch/platform-node-exporter
        tag: v1.12.1
        distroless: true
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi
---
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: nonprod-perses
spec:
  chart:
    name: perses
    repository: https://perses.github.io/helm-charts
    version: 0.23.3
  clusterRef: example-nonprod
  namespace: monitoring
  releaseName: perses
  dependsOn:
  - nonprod-kube-prometheus-stack
  imagePullSecretRef:
    name: oramasearch-dockerhub-nonprod
    namespace: orama-system
  imagePullSecretAs: oramasearch-dockerhub
  values:
    image:
      registry: docker.io
      name: oramasearch/platform-perses
      version: v0.54.0
    imagePullSecrets:
      - name: oramasearch-dockerhub
    config:
      security:
        readonly: true
    sidecar:
      enabled: true
      image:
        registry: docker.io
        repository: oramasearch/platform-k8s-sidecar
        tag: 2.13.3
      allNamespaces: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      enabled: false
    testFramework:
      enabled: false
