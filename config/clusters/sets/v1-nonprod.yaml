apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1Set
metadata:
  name: v1-nonprod
spec:
  clusters:
  - clusterRef: orama-nonprod-cluster-01
    name: v1-dev
    namespace: v1-dev
    spec:
      components:
        dashboard:
          host: app-dev.oramadev.net
          # A second name the dashboard answers, with no DNS record from the operator, as
          # app.orama.com is for v1-eu at the cutover.
          extraHosts:
          - app-alias-dev.oramadev.net
        docs:
          host: docs-dev.oramadev.net
        engine:
          reader:
            host: reader-dev.oramadev.net
          writer:
            host: writer-dev.oramadev.net
            jwt:
              audiences:
              - https://writer-dev.oramadev.net
      # No masterAPIKeySecretRef: v1-dev has no copied data, so the operator generates its master key
      # (v1-dev-master-api-key, #615). Production names Prod 1's key instead (v1-prod.yaml).
      # The dashboard signs write tokens with this issuer and the writer_url of the c1 row as audience;
      # the writer accepts exactly these.
      jwtIssuer: https://app-dev.oramadev.net
  deletionPolicy: Retain
  # Prod 1 teams copied into the members (operator#654; config/clusters/README.md, "Copying a Prod 1
  # team into a member"). Each entry becomes an OramaCloudV1Migration named `name` in its member's
  # namespace, with targetRef set to the member. A change to this file alone is merged and applied by Juan's side
  # (orama-bridge decisions 20 October, 3).
  #
  # None now. The #149 pilot, team-4e01bc49 (orama-bridge#206, #222), was copied, verified and then removed on
  # 2026-10-25 by deleting its entry (removeOnDelete ran the tool's remove-target). Its source Secrets were
  # Prod 1's credentials, which a nonprod member never receives (orama-operator#787, LSR-038). A nonprod
  # rehearsal runs against a source standing in for Prod 1 whose Secrets carry orama.cloud/purpose=nonprod.
  migrations: []
  # Nonprod's own Secrets: none of these is one a production set copies (orama-operator#789). The
  # operator refuses to copy a production set's Secret into a nonprod member, and
  # TestCommittedSetsAndOperatorsNeverShareASecretAcrossPurposes fails on one. Each is copied under the name the
  # stack already mounts, so the copy of the production Secret in v1-dev is overwritten in place.
  secrets:
  - name: oramasearch-dockerhub-nonprod       # a Docker Hub pull token for nonprod only
    namespace: orama-system
    as: oramasearch-dockerhub
  - name: cloudflare-api-token-oramadev       # token, zoneID, accountID: a token limited to oramadev.net
    namespace: orama-system
    as: cloudflare-api-token
  - name: v1-nonprod-llm-keys
    namespace: orama-system
  - name: v1-nonprod-dashboard-env
    namespace: orama-system
  # Cloud v1's standalone development Clerk instance (orama-bridge#250).
  - name: clerk-cloud-v1-dev
    namespace: orama-system
  template:
    cloudflare:
      apiTokenSecretRef:
        name: cloudflare-api-token
      enabled: true
      manageDNS: true
      manageLoadBalancers: true
    components:
      analytics:
        enabled: true
        mode: in-cluster
        placement: local
      analyticsProcessor:
        enabled: true
        # The #421 proof: the import is created suspended, and a later commit to this file sets
        # suspend: false. Applied only with Steve's consent.
        import:
          enabled: true
          suspend: true
      broker:
        enabled: true
        mode: in-cluster
        placement: local
      cache:
        enabled: true
        mode: in-cluster
        placement: local
      controlDB:
        enabled: true
        mode: in-cluster
        placement: local
      dashboard:
        enabled: true
        # Orama's platform keys for the dashboard (Stripe test mode, Resend, Slack, PRIVATE_API_KEY,
        # CRON_SECRET), from one Secret on the managing cluster that the set copies.
        envFrom:
        - secretRef:
            name: v1-nonprod-dashboard-env
        # Cloud v1's own Clerk application, with sign-in on /login. Public runtime values
        # must match the image's build/images/dashboard/public.env.v1-dev inputs.
        env:
        - name: CLERK_SECRET_KEY
          valueFrom: {secretKeyRef: {name: clerk-cloud-v1-dev, key: secretKey}}
        - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          valueFrom: {secretKeyRef: {name: clerk-cloud-v1-dev, key: publishableKey}}
        - {name: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL, value: https://app-dev.oramadev.net/auth/complete}
        - {name: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL, value: https://app-dev.oramadev.net/auth/complete}
        # Prod 1's three dashboard crons, created suspended; CRON_SECRET comes from the envFrom Secret.
        # Unsuspending is a committed change here, never an edit of the CronJobs.
        crons:
          enabled: true
          suspend: true
      disco:
        enabled: true
      docs:
        enabled: true
      engine:
        enabled: true
        envoy: true
        reader:
          # Two readers for the #421 proof (each imported once). Applied only with Steve's consent.
          replicas: 2
        writer:
          gpu: false
      ingestion:
        enabled: true
        harvest: true
      oramasearchApp:
        enabled: false
        host: api.sandbox.local
      pgAdmin:
        enabled: true
      search:
        enabled: true
        mode: in-cluster
        placement: local
      searchWorkers:
        enabled: true
      workers:
        enabled: true
        replicas: 1
    demoSeed: false
    # The operator's idp.provider: clerk is not wired into the dashboard; the dashboard's env above is
    # what it reads.
    idp:
      provider: none
    images:
      # The newest build of each Cloud v1 component, with the 22 October security fixes: the images
      # production will run (orama-bridge decisions 2026-10-23, 3). Components not listed run the
      # v1-sandbox tag, because nothing newer exists for them.
      overrides:
        # The Clerk dashboard from dashboard dev acb8b744: the Cloud v1 security fixes (dashboard#187),
        # R2 upload signing (dashboard#186), the new-device sign-in code (dashboard#190), custom system
        # prompts read from the writer (dashboard#192) and GitHub sign-in hidden until #245 (dashboard#193);
        # built with orama-cloud-v1-bridge build/images/dashboard/public.env.v1-dev, recorded in
        # orama-cloud-v1-bridge#23. Sentry shares the Orama project with environment v1-dev
        # and dashboard@79abacb32d8461c06531ba7a906ab559890a907b (dashboard#194).
        dashboard: oramasearch/dashboard:v1-dev-79abacb3-sentry@sha256:1fdf0fd4a1a9d50b8a4808d7992612d4bcdbde3f41e7e8de4ff730a4f65d9d70
        # The combined OramaCore engine from oramacore-private develop 12511370: caca2a59 (v1.2.39 with
        # oramacore#340, #341 and #343), the security fixes LSR-063, -064, -149 to -155, -234 and -235, and
        # the replication fixes for orama-bridge#255 (oramacore-private#15, #16).
        oramacore: oramasearch/oramacore-cloud-v1:v1.2.39-dev-12511370@sha256:c6f3fdc45626fe0d66f2ca82ad49ea93f8e0486b627e69fe7633ae6a7a683eef
        # CPU HPES with all six pinned model snapshots cached and verified offline (#883).
        hpes: oramasearch/embeddings-server-py:cpu-746d61320636@sha256:326fc9bb13773989677e1d9b9ee7a07eabfeb4caec514b89fc822467783afe90
        # Services from each repository's dev tip with the security fixes, recorded in
        # orama-cloud-v1-bridge#15.
        index-builder: oramasearch/index-builder:v1-dev-c59f563a@sha256:4d13b9cdd5c36291406fc215542fde582b6b5660fc01b3fc5e99672284268d9e
        disco: oramasearch/disco:v1-dev-b9c6050b@sha256:cc856f56122cdacc0fbafe688a1e41643466cadcdd3b1b83b1a732c549d360c5
        analytics-processor: oramasearch/analytics-processor:v1-dev-a9dc4f7b@sha256:004ce89d5a863046ed5cee4d8d58bc687c817075b999151dd83ff19276efe9e1
        harvest-master: oramasearch/harvest-master:v1-dev-5773f2da@sha256:7eea9df90883848f80499bf72afc446cec96a8de19e01012de630f2218ed3182
        harvest: oramasearch/harvest:v1-dev-5773f2da@sha256:9941126f9b945674d2450f47e6d132f6a1124fd63ba25c7bf3dde10cb6747769
      pullSecretName: oramasearch-dockerhub
      registry: oramasearch
      tag: v1-sandbox
    # Prod 1's providers, models and selector, as in v1-prod, except the default. Keys come from
    # v1-nonprod-llm-keys, where only OPENAI_API_KEY is real: the others are placeholders, so the
    # default is openai, not Prod 1's groq (orama-bridge#221).
    llm:
      automaticEmbeddingsSelector:
        model: gpt-5.2
        provider: openai
      default: openai
      providers:
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - gpt-5.2
        name: openai
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - gemini-2.0-flash-001
        name: google
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - openai/gpt-oss-120b
        name: groq
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - claude-sonnet-4-5
        name: anthropic
    profile: light
    region:
      role: primary
