apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1Set
metadata:
  name: v1-nonprod
spec:
  clusters:
  - clusterRef: orama-nonprod-cluster-01
    name: v1-dev
    namespace: v1-dev
    spec:
      components:
        dashboard:
          host: app-dev.oramadev.net
          # A second name the dashboard answers, with no DNS record from the operator, as
          # app.orama.com is for v1-eu at the cutover.
          extraHosts:
          - app-alias-dev.oramadev.net
        docs:
          host: docs-dev.oramadev.net
        engine:
          reader:
            host: reader-dev.oramadev.net
          writer:
            host: writer-dev.oramadev.net
            jwt:
              audiences:
              - https://writer-dev.oramadev.net
      # The one master key the engine, index-builder, workers, dashboard and analytics processor
      # share. Without it the engine is held and the stack is not Ready.
      masterAPIKeySecretRef:
        name: v1-nonprod-master-api-key
      # The dashboard signs write tokens with this issuer and the writer_url of the c1 row as audience;
      # the writer accepts exactly these.
      jwtIssuer: https://app-dev.oramadev.net
  deletionPolicy: Retain
  secrets:
  - name: oramasearch-dockerhub
    namespace: orama-system
  - name: cloudflare-api-token
    namespace: orama-system
  - name: v1-nonprod-llm-keys
    namespace: orama-system
  - name: v1-nonprod-master-api-key
    namespace: orama-system
  - name: v1-nonprod-dashboard-env
    namespace: orama-system
  template:
    cloudflare:
      apiTokenSecretRef:
        name: cloudflare-api-token
      enabled: true
      manageDNS: true
      manageLoadBalancers: true
    components:
      analytics:
        enabled: true
        mode: in-cluster
        placement: local
      analyticsProcessor:
        enabled: true
      broker:
        enabled: true
        mode: in-cluster
        placement: local
      cache:
        enabled: true
        mode: in-cluster
        placement: local
      controlDB:
        enabled: true
        mode: in-cluster
        placement: local
      dashboard:
        enabled: true
        # Orama's platform keys for the dashboard (Stripe test mode, Resend, Slack, PRIVATE_API_KEY,
        # CRON_SECRET), from one Secret on the managing cluster that the set copies.
        envFrom:
        - secretRef:
            name: v1-nonprod-dashboard-env
        # Prod 1's three dashboard crons, created suspended; CRON_SECRET comes from the envFrom Secret.
        # Unsuspending is a committed change here, never an edit of the CronJobs.
        crons:
          enabled: true
          suspend: true
      disco:
        enabled: true
      docs:
        enabled: true
      engine:
        enabled: true
        envoy: true
        reader:
          replicas: 1
        writer:
          gpu: false
      ingestion:
        enabled: true
        harvest: true
      oramasearchApp:
        enabled: false
        host: api.sandbox.local
      pgAdmin:
        enabled: true
      search:
        enabled: true
        mode: in-cluster
        placement: local
      searchWorkers:
        enabled: true
      workers:
        enabled: true
        replicas: 1
    demoSeed: false
    idp:
      provider: none
    images:
      pullSecretName: oramasearch-dockerhub
      registry: oramasearch
      tag: v1-sandbox
    # Prod 1's providers, models and selector, as in v1-prod. Keys come from v1-nonprod-llm-keys.
    llm:
      automaticEmbeddingsSelector:
        model: gpt-5.2
        provider: openai
      default: groq
      providers:
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - gpt-5.2
        name: openai
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - gemini-2.0-flash-001
        name: google
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - openai/gpt-oss-120b
        name: groq
      - apiKeySecretRef:
          name: v1-nonprod-llm-keys
        models:
        - claude-sonnet-4-5
        name: anthropic
    profile: light
    region:
      role: primary
