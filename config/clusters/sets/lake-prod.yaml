apiVersion: orama.cloud/v1alpha1
kind: LakeSet
metadata:
  name: lake-prod
spec:
  clusters:
  - clusterRef: orama-production-cluster-02
    name: shared
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - shared
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: eu.lake.live
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      - name: LAKE_BILLING
        value: "on"
      - name: LAKE_STRIPE_SECRET_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: secret_key}}
      - name: LAKE_STRIPE_WEBHOOK_SECRET
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: webhook_secret}}
      # Order email (lake docs/api/orders.md#email): Orama's Resend key, sending-only for lake.live;
      # the sender defaults to "Lake <orders@lake.live>" (lake.live verified in Resend).
      - name: LAKE_RESEND_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-resend, key: api_key}}
      # Production on lake.live (decision 64, #513): the EU region, and the region picker at the apex.
      host: eu.lake.live
      apexHost: lake.live
      region:
        label: Europe
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-prod, namespace: lake, as: clerk-secret-key}
  - clusterRef: orama-production-cluster-03
    name: shared-us
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - shared-us
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: us.lake.live
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      - name: LAKE_BILLING
        value: "on"
      - name: LAKE_STRIPE_SECRET_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: secret_key}}
      - name: LAKE_STRIPE_WEBHOOK_SECRET
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: webhook_secret}}
      # Order email (lake docs/api/orders.md#email): Orama's Resend key, sending-only for lake.live;
      # the sender defaults to "Lake <orders@lake.live>" (lake.live verified in Resend).
      - name: LAKE_RESEND_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-resend, key: api_key}}
      host: us.lake.live
      region:
        label: United States
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-prod, namespace: lake, as: clerk-secret-key}
  deletionPolicy: Retain
  secrets:
  - name: oramasearch-dockerhub
    namespace: lake
  - name: cloudflare-api-token-lake-live
    namespace: lake
  - name: lake-prod-openai
    namespace: lake
  - name: lake-prod-stripe
    namespace: lake
  - name: lake-prod-resend
    namespace: lake
  template:
    # lake.live hosts: the token scoped to the lake.live zone only (decision 64).
    dnsSecretRef:
      name: cloudflare-api-token-lake-live
    image: oramasearch/lake:v0.5.1
    ingressEnabled: true
    postgres:
      enabled: true
      instances: 1
      storageSize: 10Gi
    pullSecretName: oramasearch-dockerhub
    # Workspace and managed-service Zettas stay on the image the data-plane Zetta runs until a
    # Zetta release is rolled on purpose: without this they would follow the operator's default
    # (orama-operator#588) the moment a new operator rolls.
    services:
      zettaImage: oramasearch/zetta:v0.5.0
    store:
      accessModes:
      - ReadWriteOnce
      size: 20Gi
      storageClassName: managed-csi
    zetta:
      enabled: true
      image: oramasearch/zetta:v0.5.0
      replicas: 1
