apiVersion: orama.cloud/v1alpha1
kind: LakeSet
metadata:
  name: lake-nonprod
spec:
  clusters:
  - clusterRef: orama-nonprod-cluster-01
    name: dev
    spec:
      # Merged work runs on dev before a release is cut (Steve, 2026-10-25): lake dev-edb8cf5d (#1186,
      # #1187, #1189, #1198, #1199, #1201) and every agent's dev build after the 2026-10-25 merges. Remove
      # these pins when the template names lake v0.7.1 and the agents' v0.2.0.
      image: oramasearch/lake:dev-edb8cf5d
      agents:
        runtimeImage: oramasearch/agent-runtime:fdb6714
        library:
        - {key: agent-ask-orama, image: oramasearch/agent-ask-orama:7a044af}
        - {key: agent-application, image: oramasearch/agent-application:32caa4c}
        - {key: agent-autosuggest, image: oramasearch/agent-autosuggest:9b45383}
        - {key: agent-autosuggest-corpus, image: oramasearch/agent-autosuggest-corpus:47fe077}
        - {key: agent-creator, image: oramasearch/agent-creator:53bc89a-fdb6714}
        - {key: agent-eval-generator, image: oramasearch/agent-eval-generator:d174d10}
        - {key: agent-experiments, image: oramasearch/agent-experiments:84fd433}
        - {key: agent-project, image: oramasearch/agent-project:db8835f}
        - {key: agent-project-corpus, image: oramasearch/agent-project-corpus:ebd36c8}
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - dev
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-dev.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-dev.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-dev, namespace: lake, as: clerk-secret-key}
    - {name: stripe-dev, namespace: lake, as: lake-prod-stripe}
  - clusterRef: orama-nonprod-cluster-01
    name: staging
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - staging
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-staging.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-staging.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-staging, namespace: lake, as: clerk-secret-key}
    - {name: stripe-staging, namespace: lake, as: lake-prod-stripe}
  - clusterRef: orama-nonprod-cluster-01
    name: testing
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - testing
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-testing.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-testing.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-testing, namespace: lake, as: clerk-secret-key}
    - {name: stripe-testing, namespace: lake, as: lake-prod-stripe}
  deletionPolicy: Retain
  # The testing -> staging gate of a substantial lake release (orama-operator#589,
  # docs/lake/README.md#service-e2e). Not active yet: oramasearch/lake-e2e has no image in Docker
  # Hub, and the managing cluster's operator must know spec.e2eTests before this file carries it.
  # When both are true, uncomment, put in the pushed image's digest, set runID to the release being
  # gated, apply this file to the managing cluster with Steve's consent, and commit it.
  # e2eTests:
  # - name: testing-gate
  #   member: testing
  #   spec:
  #     image: oramasearch/lake-e2e@sha256:<digest>
  #     runID: "<release>"
  #     env:
  #     - name: LAKE_E2E_CLERK_SECRET_KEY
  #       valueFrom: {secretKeyRef: {name: clerk-secret-key, key: secretKey}}
  # Nonprod's own Secrets: none of these is one lake-prod copies (orama-operator#789). The operator
  # refuses to copy a production set's Secret into a nonprod member, and
  # TestCommittedSetsAndOperatorsNeverShareASecretAcrossPurposes fails on one. The pull and OpenAI
  # Secrets keep the names the Lakes already mount, replacing their production copies in place.
  # Stripe is member-specific above: each sandbox supplies its own
  # accountID, operatorKey and appKey, replacing the old Stripe Secret under the same target name.
  # spec.payments owns each endpoint and signing Secret (#884).
  secrets:
  - name: oramasearch-dockerhub-nonprod   # a Docker Hub pull token for nonprod only
    namespace: lake
    as: oramasearch-dockerhub
  - name: cloudflare-api-token            # already nonprod's own: oramadev.net only
    namespace: lake
  # Juan chose the existing Prod1 OpenAI key for this separate source (#884); key reuse is intentional.
  - name: lake-nonprod-openai             # OPENAI_API_KEY; keep the OpenAI provider
    namespace: lake
    as: lake-prod-openai
  template:
    billing:
      enabled: true
    payments:
      mode: test
      secretRef: {name: lake-prod-stripe}
    dnsSecretRef:
      name: cloudflare-api-token
    image: oramasearch/lake:v0.7.0
    ingressEnabled: true
    postgres:
      enabled: true
      instances: 1
      storageSize: 10Gi
    pullSecretName: oramasearch-dockerhub
    # Workspace and managed-service Zettas stay on the image the data-plane Zetta runs until a
    # Zetta release is rolled on purpose: without this they would follow the operator's default
    # (orama-operator#588) the moment a new operator rolls.
    services:
      zettaImage: oramasearch/zetta:v0.5.0
    store:
      accessModes:
      - ReadWriteOnce
      size: 20Gi
      storageClassName: managed-csi
    zetta:
      enabled: true
      image: oramasearch/zetta:v0.5.0
      replicas: 1
