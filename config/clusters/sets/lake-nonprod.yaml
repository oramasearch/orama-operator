apiVersion: orama.cloud/v1alpha1
kind: LakeSet
metadata:
  name: lake-nonprod
spec:
  clusters:
  - clusterRef: orama-nonprod-cluster-01
    name: dev
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - dev
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-dev.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      - name: LAKE_BILLING
        value: "on"
      - name: LAKE_STRIPE_SECRET_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: secret_key}}
      - name: LAKE_STRIPE_WEBHOOK_SECRET
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: webhook_secret}}
      host: lake-dev.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-dev, namespace: lake, as: clerk-secret-key}
  - clusterRef: orama-nonprod-cluster-01
    name: staging
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - staging
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-staging.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      - name: LAKE_BILLING
        value: "on"
      - name: LAKE_STRIPE_SECRET_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: secret_key}}
      - name: LAKE_STRIPE_WEBHOOK_SECRET
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: webhook_secret}}
      host: lake-staging.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-staging, namespace: lake, as: clerk-secret-key}
  - clusterRef: orama-nonprod-cluster-01
    name: testing
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - testing
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-testing.oramadev.net
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      - name: LAKE_BILLING
        value: "on"
      - name: LAKE_STRIPE_SECRET_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: secret_key}}
      - name: LAKE_STRIPE_WEBHOOK_SECRET
        valueFrom: {secretKeyRef: {name: lake-prod-stripe, key: webhook_secret}}
      host: lake-testing.oramadev.net
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-testing, namespace: lake, as: clerk-secret-key}
  deletionPolicy: Retain
  # The testing -> staging gate of a substantial lake release (orama-operator#589,
  # docs/lake/README.md#service-e2e). Not active yet: oramasearch/lake-e2e has no image in Docker
  # Hub, and the managing cluster's operator must know spec.e2eTests before this file carries it.
  # When both are true, uncomment, put in the pushed image's digest, set runID to the release being
  # gated, apply this file to the managing cluster with Steve's consent, and commit it.
  # e2eTests:
  # - name: testing-gate
  #   member: testing
  #   spec:
  #     image: oramasearch/lake-e2e@sha256:<digest>
  #     runID: "<release>"
  #     env:
  #     - name: LAKE_E2E_CLERK_SECRET_KEY
  #       valueFrom: {secretKeyRef: {name: clerk-secret-key, key: secretKey}}
  # Nonprod's own Secrets: none of these is one lake-prod copies (orama-operator#789). The operator
  # refuses to copy a production set's Secret into a nonprod member, and
  # TestCommittedSetsAndOperatorsNeverShareASecretAcrossPurposes fails on one. Each is copied under the name the
  # Lakes already mount, so the copies of the production Secrets in the lake-* namespaces are
  # overwritten in place.
  secrets:
  - name: oramasearch-dockerhub-nonprod   # a Docker Hub pull token for nonprod only
    namespace: lake
    as: oramasearch-dockerhub
  - name: cloudflare-api-token            # already nonprod's own: oramadev.net only
    namespace: lake
  - name: lake-nonprod-openai             # OPENAI_API_KEY
    namespace: lake
    as: lake-prod-openai
  - name: lake-nonprod-stripe             # secret_key, webhook_secret: Stripe test mode
    namespace: lake
    as: lake-prod-stripe
  template:
    dnsSecretRef:
      name: cloudflare-api-token
    image: oramasearch/lake:v0.3.1
    ingressEnabled: true
    postgres:
      enabled: true
      instances: 1
      storageSize: 10Gi
    pullSecretName: oramasearch-dockerhub
    # Workspace and managed-service Zettas stay on the image the data-plane Zetta runs until a
    # Zetta release is rolled on purpose: without this they would follow the operator's default
    # (orama-operator#588) the moment a new operator rolls.
    services:
      zettaImage: oramasearch/zetta:main-4015ef76
    store:
      accessModes:
      - ReadWriteOnce
      size: 20Gi
      storageClassName: managed-csi
    zetta:
      enabled: true
      image: oramasearch/zetta:main-4015ef76
      replicas: 1
