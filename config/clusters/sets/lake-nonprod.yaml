# An example, in the shape of a real deployment. The values are not Orama's: every name,
# host and id is a placeholder. See README.md in this folder.
apiVersion: orama.cloud/v1alpha1
kind: LakeSet
metadata:
  name: lake-nonprod
spec:
  clusters:
  - clusterRef: example-nonprod
    name: dev
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - dev
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-dev.nonprod.example.com
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-dev.nonprod.example.com
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-dev, namespace: lake, as: clerk-secret-key}
    - {name: stripe-dev, namespace: lake, as: lake-prod-stripe}
  - clusterRef: example-nonprod
    name: staging
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - staging
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-staging.nonprod.example.com
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-staging.nonprod.example.com
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-staging, namespace: lake, as: clerk-secret-key}
    - {name: stripe-staging, namespace: lake, as: lake-prod-stripe}
  - clusterRef: example-nonprod
    name: testing
    spec:
      args:
      - "--listen"
      - 0.0.0.0:4900
      - "--node"
      - testing
      env:
      - name: LAKE_LOG_MODE
        value: air-gapped
      - name: LAKE_PUBLIC_HOST
        value: lake-testing.nonprod.example.com
      - name: LAKE_OPENAI_API_KEY
        valueFrom: {secretKeyRef: {name: lake-prod-openai, key: OPENAI_API_KEY}}
      host: lake-testing.nonprod.example.com
      clerk:
        secretKeySecretRef: {name: clerk-secret-key}
    secrets:
    - {name: clerk-lake-testing, namespace: lake, as: clerk-secret-key}
    - {name: stripe-testing, namespace: lake, as: lake-prod-stripe}
  deletionPolicy: Retain
  secrets:
  - name: oramasearch-dockerhub-nonprod
    namespace: lake
    as: oramasearch-dockerhub
  - name: cloudflare-api-token
    namespace: lake
  - name: lake-nonprod-openai
    namespace: lake
    as: lake-prod-openai
  template:
    billing:
      enabled: true
    payments:
      mode: test
      secretRef: {name: lake-prod-stripe}
    dnsSecretRef:
      name: cloudflare-api-token
    image: oramasearch/lake:v0.8.1
    apps:
      runtimeImage: oramasearch/app-runtime:v0.1.3
    agents:
      model: gpt-6.1-sol
      runtimeImage: oramasearch/agent-runtime:v0.2.0
      library:
      - {key: agent-ask-orama, image: oramasearch/agent-ask-orama:v0.2.1}
      - {key: agent-application, image: oramasearch/agent-application:v0.2.7}
      - {key: agent-autosuggest, image: oramasearch/agent-autosuggest:v0.2.0}
      - {key: agent-autosuggest-corpus, image: oramasearch/agent-autosuggest-corpus:v0.2.0}
      - {key: agent-creator, image: oramasearch/agent-creator:v0.2.0}
      - {key: agent-eval-generator, image: oramasearch/agent-eval-generator:v0.2.0}
      - {key: agent-experiments, image: oramasearch/agent-experiments:v0.2.2}
      - {key: agent-project, image: oramasearch/agent-project:v0.2.0}
      - {key: agent-project-corpus, image: oramasearch/agent-project-corpus:v0.2.0}
    ingressEnabled: true
    postgres:
      enabled: true
      instances: 1
      storageSize: 10Gi
    pullSecretName: oramasearch-dockerhub
    services:
      zettaImage: oramasearch/zetta:v0.5.0
    store:
      accessModes:
      - ReadWriteOnce
      size: 20Gi
      storageClassName: managed-csi
    zetta:
      enabled: true
      image: oramasearch/zetta:v0.5.0
      replicas: 1
