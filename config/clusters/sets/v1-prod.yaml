# Cloud v1 production: the `v1-prod` OramaCloudV1Set, as applied to the managing cluster
# (orama-production-cluster-01). Issue #317; review on PR #445.
#
# `v1-eu` (orama-production-cluster-02, swedencentral) carries the production values and takes the
# cutover first. `v1-us` (orama-production-cluster-03, eastus) keeps the sandbox values it runs today;
# its conversion to readers of the EU writer follows the cutover (#396).
#
# The template is small. The set controller merges a member's `spec` over the template (a field wins,
# an object merges field by field, a list replaces the template's list), so a member cannot remove a
# template field. The template holds only what both members share; each member carries the rest.
#
# NOT READY FOR CUTOVER. Applying this file needs Steve's explicit consent, and it is not applied while
# any item under "Blocked" below remains.
#
# Secrets
# -------
# No value is in this file. Nothing is created directly in namespace v1-eu: every key v1-eu needs is
# generated by the operator (or by CNPG), derived from another value, or copied by this set from a
# Secret in orama-system on the managing cluster. Creating a source Secret there is a change to a
# cluster and needs Steve's consent; a missing source fails that member before its instance is applied.
# A copy is the whole Secret, renamed only by `as`, and the set rewrites it on every reconcile.
#
# Copied, set level (both members):
#   oramasearch-dockerhub   .dockerconfigjson            every pod's imagePullSecrets (images.pullSecretName)
#   cloudflare-api-token    token, zoneID, accountID     CloudflareDNSRecord, KV namespaces, the stack's
#                                                        Let's Encrypt DNS-01 Issuer (cloudflare.apiTokenSecretRef)
# Copied, v1-eu member only (`secrets` under the member, so v1-us never receives them):
#   v1-prod-master-api-key  MASTER_API_KEY               masterAPIKeySecretRef -> writer, analytics processor,
#                                                        index-builder, workers, dashboard, and the target-local
#                                                        `c1` row (#447). Must equal Prod 1's
#                                                        oramacore_clusters.master_api_key; no Prod 1 row is copied.
#                                                        Prod 1's key is carried, as Steve's #411 review asks
#                                                        (Juan, 2026-10-17; the bridge's secrets.md is corrected).
#   v1-prod-llm-keys        OPENAI_API_KEY, GOOGLE_API_KEY, GROQ_API_KEY, ANTHROPIC_API_KEY
#                                                        engine, through llm.providers[].apiKeySecretRef
#                                                        (engine_llm.go llmKeySecretEnv); third-party keys.
#   v1-prod-dashboard-env   PRIVATE_API_KEY (= Prod 1: the import consumer sends it),
#                           STRIPE_WEBHOOK_SECRET (= Prod 1: the app.orama.com Stripe endpoint signs with it),
#                           STRIPE_SECRET_KEY, RESEND_API_KEY, SLACK_TOKEN, the Clerk server key
#                                                        dashboard, through components.dashboard.envFrom (#311).
#                                                        It never holds DATABASE_URL, POSTGRES_PASSWORD, JWT_*,
#                                                        or MASTER_API_KEY: the operator owns them and refuses them.
# v1-us: nothing copied. Its master key is generated (#615) until the US migration names Prod 1's.
#
#   Not copied: AIRBYTE_WEBHOOK_SECRET and every AIRBYTE_* (Airbyte removed, bridge decisions 2026-10-16
#   #12a); Firebase keys (sign-in is Clerk before the cutover, decisions #1, #2).
#   Sign-in comes from the Clerk keys in v1-prod-dashboard-env (#311, decisions 2026-10-16 #1, #2).
#   idp.provider stays unset: the operator reads it only for keycloak.
#
# Generated (never copied, never shared between members):
#   v1-eu-jwt               JWT_PRIVATE_KEY, JWT_PUBLIC_KEY   dashboard signs write tokens  (config.go ensureJWTSecrets)
#   v1-eu-jwt-pub           JWT_PUBLIC_KEY                     engine verifies               (config.go ensureJWTSecrets)
#   v1-eu-broker-admin      username, password                 broker, engine, harvest-master (credentials.go ensureCredentialSecrets)
#   v1-eu-broker-users      writer-password, reader-password   RabbitMQTopology users         (datastore.go ensureBrokerSecrets)
#   v1-eu-cache-auth        password                           Redis, harvest-master, index-builder (credentials.go)
#   v1-eu-controldb-app     uri, password                      CNPG: dashboard DATABASE_URL/POSTGRES_PASSWORD,
#                                                              index-builder, analytics processor, PostgresSchema
#   v1-eu-analytics-api-key (#386)                             readers' reader_side.analytics and the analytics
#                                                              processor only (credentials.go)
#
# Derived:
#   JWT_ISSUER                     <- spec.jwtIssuer (config.go jwtIssuer)
#   writer audience                <- engine.writer.jwt.audiences, https://writer.orama.ing
#   MASTER_API_KEY in each consumer <- masterAPIKeySecretRef (credentials.go masterAPIKeyEnv)
#   POSTGRES_*, CLICKHOUSE_HOST/PORT, REDIS_*, RABBITMQ_*, TYPESENSE_HOST/PORT, ORAMACORE_*_URL
#                                  <- v1-eu-config ConfigMap (config.go reconcileBootstrap)
#   index-builder service URLs and Cloudflare KV namespace IDs <- ingestion.go indexBuilderEnv, owned KV CRs
#
# Blocked (#570 generated credentials, #571 per-key third-party Secrets,
# #572 derived dashboard values, #573 the stack's own ingress-nginx, #574 HPES, #575 no tunnel ingress,
# #562 the Redis HTTP shim): required values this file cannot carry yet. Each needs its prerequisite first; none is
# worked around here, and no internal password is copied to bypass a missing generator.
#   Images: not pinned by digest, not mirrored privately, and not moved to exact version tags (Steve,
#     2026-10-17). Our own images run by their release tags (main-<sha> or vX.Y.Z); upstream images run
#     on the operator's default tags. Still to build before an apply:
#     - oramacore-writer, oramacore-reader: the v1.2.39 side-only images (#308, orama-cloud-v1-bridge#5),
#       and the reader with oramacore#340/#341 (#597). Without both overrides the engine runs the combined
#       image.
#     - dashboard: the Clerk build (orama-bridge#180, #187).
#     - analytics-processor: the build with the 0.0.0.0:8080 listener patch (#421).
#     - HPES: the component and its image (decisions 2026-10-16 #3, 2026-10-17 #5; #574).
#   Credentials the operator does not generate yet, all of which only have to agree inside the stack:
#     the one ClickHouse password (analytics, analytics processor, dashboard, workers), TYPESENSE_API_KEY
#     (search and index-builder), HARVEST_SIGN (index-builder, harvest-master, harvest workers),
#     CRON_SECRET (dashboard and its CronJobs), DECRYPTER_API_SECRET_BASE64 (index-builder's x-api-key to
#     openai-decrypter, index-manager apps/index-builder/src/embeddings/openai.ts; openai-decrypter gets
#     no Secret), API_SECRET and DEPLOYMENT_API_API_KEY (index-builder), ORAMA_EMBEDDINGS_BEARER (HPES),
#     REDIS_CACHE_TOKEN (the serverless-redis-http shim, decisions #12a, not built), QSTASH_TOKEN (workers).
#   Third-party keys in mixed component Secrets: the workers' LLM keys and SENTRY_DSN, index-builder's
#     ABLY_API_KEY, APIFY_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, harvest-master's GITHUB_PAT
#     and GHCR_TOKEN sit in v1-eu-<component>-secret beside internal keys, so they cannot be copied
#     without copying internal ones; they need a per-key Secret reference like llm.providers.
#   Derived values the operator does not derive yet: NEXT_PUBLIC_APP_URL (from the dashboard host, and
#     inlined at build time), ORAMACORE_PLACEMENT_CLUSTER_ID (the `c1` row, #447), REDIS_CACHE_URL (the shim).
#   Outside services not settled by the bridge epic: AWS S3 for uploads (AWS_ACCESS_KEY_VALUE,
#     AWS_SECRET_ACCESS_KEY_VALUE, S3_BUCKET*), Ably, Apify, QStash.
#   Configuration values to read from Prod 1 and add to dashboard.env: S3_BUCKET, S3_BUCKET_REGION,
#     S3_BUCKET_PREFIX, SLACK_CHANNEL_NEW_USERS, SLACK_CHANNEL_STRIPE, DATA_SOURCE_REQUEST_URL; and
#     controlDB.stripePrices with live-mode Stripe price IDs (#378).
apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1Set
metadata:
  name: v1-prod
spec:
  clusters:
  # Hosts are one level under orama.ing, which Cloudflare's *.orama.ing edge certificate covers.
  # Customers keep reading through collections.orama.com, whose worker forwards to
  # ORAMACORE_READ_URLS.c1; the cutover runbook points that at https://reader.orama.ing and repoints
  # app.orama.com, which gets no DNS record from the operator (an extra host never does).
  - clusterRef: orama-production-cluster-02
    name: v1-eu
    namespace: v1-eu
    secrets:
    - name: v1-prod-master-api-key
      namespace: orama-system
    - name: v1-prod-llm-keys
      namespace: orama-system
    - name: v1-prod-dashboard-env
      namespace: orama-system
    spec:
      profile: medium
      jwtIssuer: https://app.orama.ing
      masterAPIKeySecretRef:
        name: v1-prod-master-api-key
      # Prod 1's providers, models and selector. Keys come from v1-prod-llm-keys.
      llm:
        default: groq
        providers:
        - name: openai
          models: [gpt-5.2]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: google
          models: [gemini-2.0-flash-001]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: groq
          models: [openai/gpt-oss-120b]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: anthropic
          models: [claude-sonnet-4-5]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        automaticEmbeddingsSelector: { provider: openai, model: gpt-5.2 }
      cloudflare:
        manageLoadBalancers: false     # no geo load balancer across the members yet
      # Every volume uses managed-csi-premium (Azure Premium SSD), a built-in AKS class; the cluster
      # default is Standard SSD. A volume's class cannot change after it is created.
      components:
        engine:
          enabled: true
          envoy: true
          writer:
            gpu: false
            host: writer.orama.ing
            # Prod 1's writer root volume is 500 GiB (snapshot of vol-0b8dcc408f8ea762f, orama-bridge
            # production-changes.md; oramacore-aws terraform/live/prod/main.tf root_volume_size = 500)
            # with 343 GiB free on 2026-10-12 (techops-docs incident-2026-10-12-reader-stalls.md, "Host
            # storage"): about 157 GiB used, OS included. A larger size here grows the claim (#505).
            storage: { size: 512Gi, storageClassName: managed-csi-premium }
            # jwksURL unset: the writer reads the dashboard's keys in-cluster. Prod 2 has one cluster
            # row, the operator's `c1`, whose writer_url the dashboard mints the audience from
            # (decisions 2026-10-16 #9).
            jwt:
              audiences:
              - https://writer.orama.ing
          reader:
            host: reader.orama.ing
            replicas: 2
            # Each reader's disk is 512Gi, #382's default: about twice the largest Prod 1 reader's use
            # (US, ~272 GiB of 931 GiB, OS included; bridge decisions 2026-10-17 #3). A larger size grows them (#505).
            storage: { size: 512Gi, storageClassName: managed-csi-premium }
        dashboard:
          enabled: true
          host: app.orama.ing
          extraHosts: [app.orama.com]
          envFrom:
          - secretRef: { name: v1-prod-dashboard-env }
          # Prod 1's Vercel crons as CronJobs; the cutover sets suspend: false in this file.
          crons:
            enabled: true
            suspend: true
        docs:
          enabled: true
        controlDB:
          enabled: true
          mode: in-cluster
          # PlanetScale holds 531 MB on a 10 GB disk (techops-docs planetscale.md, 2026-07-07).
          storage: { size: 10Gi, storageClassName: managed-csi-premium }
        analytics:
          enabled: true
          mode: in-cluster
          # 30 days kept, starting fresh (bridge decisions 2026-10-16 #4). ClickHouse Cloud's
          # oramacore_analytics_search_raw is 468.30 GiB for 16,979,167 rows, ~29.6 KB a row
          # (techops-docs clickhouse.md, 2026-07-07); 8,318,162 searches in 90 days (orama-bridge#138,
          # 2026-10-08) give ~82 GiB per 30 days. Doubled for headroom and rounded up.
          storage: { size: 200Gi, storageClassName: managed-csi-premium }
        analyticsProcessor:
          enabled: true
          # The cutover sets suspend: false in this file.
          import:
            enabled: true
            suspend: true
        cache:
          enabled: true
          mode: in-cluster
          # 10Gi, the default, on purpose: measuring Prod 1's Upstash Redis is deferred (bridge decisions
          # 2026-10-17 #22), and no source records its data size (techops-docs has only its billing,
          # evidence/upstash-billing-2026-07-08.md). The class is set now because it cannot change
          # later; the size can grow once Prod 1 is measured.
          storage: { size: 10Gi, storageClassName: managed-csi-premium }
        broker:
          enabled: true
          mode: in-cluster
          # The oramacore-operations stream is capped at 5 GB on Prod 1 (techops-docs aws.md) and by the
          # operator (datastore.go brokerOperationsStreamMaxBytes); four times the cap.
          storage: { size: 20Gi, storageClassName: managed-csi-premium }
        search:
          enabled: true
          mode: in-cluster
          # 10Gi, the default, on purpose: measuring Prod 1's Typesense is deferred (bridge decisions
          # 2026-10-17 #22), and no source records its data size. The class is set now because it
          # cannot change later; the size can grow once Prod 1 is measured.
          storage: { size: 10Gi, storageClassName: managed-csi-premium }
        ingestion:
          enabled: true
          harvest: true
        workers:
          enabled: true
          replicas: 2
        searchWorkers:
          enabled: true
        # Prod 1's DISCO hosting is unconfirmed (its GCP project was deleted; techops-docs disco.md,
        # orama-bridge retirement-register R31), and the cutover plan does not move it.
        disco:
          enabled: false
        # No pgAdmin is recorded on Prod 1, whose control DB is PlanetScale (techops-docs planetscale.md;
        # the admin surface is open as orama-bridge Q25/R43).
        pgAdmin:
          enabled: false
  # US keeps the sandbox stack it runs today and never runs the dashboard crons.
  - clusterRef: orama-production-cluster-03
    name: v1-us
    namespace: v1-us
    # No masterAPIKeySecretRef: v1-us has no copied data, so the operator generates its master key
    # (v1-us-master-api-key in its own namespace, #615). It names Prod 1's key when the US migration
    # copies tenants into it.
    spec:
      cloudflare:
        manageLoadBalancers: true
      components:
        analytics:
          enabled: true
          mode: in-cluster
          placement: local
        analyticsProcessor:
          enabled: true
        broker:
          enabled: true
          mode: in-cluster
          placement: local
        cache:
          enabled: true
          mode: in-cluster
          placement: local
        controlDB:
          enabled: true
          mode: in-cluster
          placement: local
        dashboard:
          enabled: true
          host: app-us.oramadev.net
        disco:
          enabled: true
        docs:
          enabled: true
          host: docs-us.oramadev.net
        engine:
          enabled: true
          envoy: true
          reader:
            replicas: 1
          writer:
            gpu: false
        ingestion:
          enabled: true
          harvest: true
        oramasearchApp:
          enabled: false
          host: api.sandbox.local
        pgAdmin:
          enabled: true
        search:
          enabled: true
          mode: in-cluster
          placement: local
        searchWorkers:
          enabled: true
        workers:
          enabled: true
          replicas: 1
      demoSeed: false
      idp:
        provider: none
      images:
        tag: v1-sandbox
      llm:
        default: groq
        providers:
        - models:
          - llama-3.3-70b-versatile
          name: groq
      profile: light
  deletionPolicy: Retain
  secrets:
  - name: oramasearch-dockerhub
    namespace: orama-system
  - name: cloudflare-api-token
    namespace: orama-system
  template:
    cloudflare:
      apiTokenSecretRef:
        name: cloudflare-api-token
      enabled: true
      manageDNS: true
    images:
      pullSecretName: oramasearch-dockerhub
      registry: oramasearch
    region:
      role: primary
