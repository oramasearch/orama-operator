  # Retain: a member taken out of the set keeps running; it is never deleted by an edit to this list.
  deletionPolicy: Retain
  # Prod 1 teams copied into the members (operator#654; config/clusters/README.md, "Copying a Prod 1
  # team into a member"). Each entry becomes an OramaCloudV1Migration named `name` in its member's
  # namespace. Applying needs Juan's consent like the rest of this file (D8).
  #
  # The first production copy: the #149 pilot team, already copied into v1-dev twice
  # (orama-bridge#206, #222), now into v1-eu, a rehearsal Juan keeps (decisions 24 October, 7). Run eu-1
  # stopped mid-seed on 2026-10-25 when the writer lost an acknowledged write (orama-bridge#255); its partial
  # copy was removed (orama-operator#986) and v1-eu runs the fixed engine (#988). This is run eu-2.
  # The four Secrets below are in orama-system on the managing cluster, each labelled
  # orama.cloud/purpose=production, from ~/.config/orama-migration/prod2/secrets.json and the isolation
  # receipt bound to v1-eu (run eu-2), observed 2026-10-25T19:50:40Z and valid for 48 hours.
  migrations:
  - name: team-4e01bc49
    member: v1-eu
    secrets:                                # copied into v1-eu first, deleted once the migration is gone
    - name: v1-prod-prod1-db-ro             # url: the SELECT-only PlanetScale URL
      namespace: orama-system
    - name: v1-prod-prod1-master-key        # key: Prod 1's engine master key
      namespace: orama-system
    - name: v1-prod-prod1-settings-ssm      # access_key_id, secret_access_key: the SSM document's IAM key
      namespace: orama-system
    - name: team-4e01bc49-eu-evidence       # isolation.json: the reviewed isolation receipt
      namespace: orama-system
    spec:                                   # an OramaCloudV1Migration's spec, without targetRef
      teamID: 4e01bc49-b388-43c2-8986-2395a0b8fe52
      projectIDs: [a0d16f69-1a49-4659-8a60-008886765691]
      runID: eu-2
      step: catchUp                         # seed reconciled 2026-10-25 20:09Z (attempt 2): 330 documents
      apply: true                           # writes v1-eu
      # Attempt 1 failed when the target's reader refused system prompts, which OramaCore's LSR-235 fix
      # serves only from the writer; dev-c5739f43 reads them there (oramacore-aws#131).
      attempt: 2
      evidenceSecretRef: {name: team-4e01bc49-eu-evidence, key: isolation.json}
      image: docker.io/oramasearch/cloud-v1-migration@sha256:3d7ea11ef01b47e2080e3fcf25a1d6a89a376279e59adbdb412dff6f91796a03  # dev-c5739f43
      pullSecretName: oramasearch-dockerhub
      # removeOnDelete unset: removing this entry keeps the team's copy on v1-eu, because deleting
      # production data needs its own approval. The cutover's final catch-up updates this copy.
      # Fixed once applied. The revisions are the labels the run binds to and the isolation receipt
      # names: Prod 1's writer build and its control DB catalog. Every team's entry uses this source.
