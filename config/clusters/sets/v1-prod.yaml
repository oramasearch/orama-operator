apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1Set
metadata:
  name: v1-prod
spec:
  clusters:
  - clusterRef: orama-production-cluster-02
    name: v1-eu
    namespace: v1-eu
    spec:
      components:
        dashboard:
          host: app-eu.oramadev.net
  - clusterRef: orama-production-cluster-03
    name: v1-us
    namespace: v1-us
    spec:
      components:
        dashboard:
          host: app-us.oramadev.net
  deletionPolicy: Retain
  secrets:
  - name: oramasearch-dockerhub
    namespace: orama-system
  - name: cloudflare-api-token
    namespace: orama-system
  template:
    cloudflare:
      apiTokenSecretRef:
        name: cloudflare-api-token
      enabled: true
      manageDNS: true
      manageLoadBalancers: true
    components:
      analytics:
        # Sizing BLOCKED (2026-10-14): ClickHouse Cloud history data used bytes and
        # provisioned capacity are unmeasured; authorized usage-console/metric access missing.
        # Need managed storage-usage metrics (or SELECT sum(bytes_on_disk) FROM system.parts
        # WHERE active), plus the history-to-migrate decision; headroom remains undecided.
        # storage.size intentionally omitted; 10Gi is a fallback, not measured production sizing.
        enabled: true
        mode: in-cluster
        placement: local
      analyticsProcessor:
        enabled: true
      broker:
        # Sizing BLOCKED (2026-10-14): RabbitMQ data used bytes/capacity unmeasured;
        # approved source-host access missing. Need read-only df -B1 at the data mount
        # and du -sb of the RabbitMQ data directory; choose headroom after measuring.
        # storage.size omitted; the 10Gi fallback is not measured production sizing.
        enabled: true
        mode: in-cluster
        placement: local
      cache:
        # Sizing BLOCKED (2026-10-14): managed Redis dataset/storage used bytes
        # and provisioned capacity unmeasured; approved Upstash usage-metric access missing.
        # Need read-only database data-size/storage metrics, not host df; headroom undecided.
        # storage.size omitted; the 10Gi fallback is not measured production sizing.
        enabled: true
        mode: in-cluster
        placement: local
      controlDB:
        # Source (2026-10-14 PDT): Prod 1 managed control database,
        # SELECT pg_database_size(current_database()) AS used_bytes via existing SELECT-only
        # PlanetScale credential, verified TLS: 12,302,003 bytes (~0.01146 GiB).
        # Managed provisioned capacity unavailable; no host-filesystem claim.
        # Choose a 10Gi operational floor (~872x measured use, >50% growth headroom).
        storage:
          size: 10Gi
        enabled: true
        mode: in-cluster
        placement: local
      dashboard:
        enabled: true
      disco:
        enabled: true
      docs:
        enabled: true
        host: docs.sandbox.local
      engine:
        enabled: true
        envoy: true
        reader:
          replicas: 1
        writer:
          # Sizing BLOCKED (2026-10-14): writer index-data used bytes unmeasured;
          # reported provisioned 500Gi alone is insufficient and is not a usage measurement.
          # Approved source-host access missing. Need read-only df -B1 at the writer data
          # mount and du -sb of its data directory; choose headroom after measuring.
          # storage.size omitted; the 10Gi fallback must not be used for the production copy.
          gpu: false
      ingestion:
        enabled: true
        harvest: true
      oramasearchApp:
        enabled: false
        host: api.sandbox.local
      pgAdmin:
        enabled: true
      search:
        # Sizing BLOCKED (2026-10-14): Typesense data used bytes/provisioned capacity
        # unmeasured; approved source usage-metric/host access missing. Need read-only
        # service storage usage, or df -B1 and du -sb at the actual data mount/directory;
        # choose headroom afterward. Omitted storage.size is not measured sizing.
        enabled: true
        mode: in-cluster
        placement: local
      searchWorkers:
        enabled: true
      workers:
        enabled: true
        replicas: 1
    demoSeed: false
    idp:
      provider: none
    images:
      pullSecretName: oramasearch-dockerhub
      registry: oramasearch
      tag: v1-sandbox
    llm:
      default: groq
      providers:
      - models:
        - llama-3.3-70b-versatile
        name: groq
    profile: light
    region:
      role: primary
