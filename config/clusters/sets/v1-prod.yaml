# Cloud v1 production: the `v1-prod` OramaCloudV1Set, as applied to the managing cluster
# (orama-production-cluster-01). Issue #317; review on PR #445.
#
# `v1-eu` (orama-production-cluster-02, swedencentral) carries the production values and takes the
# cutover first. `v1-us` (orama-production-cluster-03, eastus) keeps the sandbox values it runs today;
# its conversion to readers of the EU writer follows the cutover (#396).
#
# The template is small. The set controller merges a member's `spec` over the template (a field wins,
# an object merges field by field, a list replaces the template's list), so a member cannot remove a
# template field. The template holds only what both members share; each member carries the rest.
#
# NOT READY FOR CUTOVER. Applying this file needs Juan's explicit consent for that apply (D8, which Steve
# agreed on 2026-10-25: orama-bridge docs/projects/orama-cloud-v1/decisions-2026-10-25.md). Since 2026-10-24 it brings
# v1-eu up on its production names under orama.ing, production's root domain (Juan, orama-bridge#244),
# for the end-to-end test there, with no customer data copied and every cron and import suspended.
# The items under "Blocked" below must be closed before the cutover, not before that test.
# Apply it only once orama-production-cluster-02 runs an operator with orama-operator#920: an older CRD
# drops storage.approveDataDeletion, and v1-eu's sandbox volumes would stay on Standard SSD.
# Juan chose to leave the live sandbox-shaped set unchanged until this production file is ready
# (#885, 2026-10-23). Both live members are now Ready; standalone auth is tracked in #929.
#
# Secrets
# -------
# No value is in this file. Nothing is created directly in namespace v1-eu: every key v1-eu needs is
# generated by the operator (or by CNPG), derived from another value, or copied by this set from a
# Secret in orama-system on the managing cluster. Creating a source Secret there is a change to a
# cluster and needs Steve's consent; a missing source fails that member before its instance is applied.
# For #885 Juan authorized the required source-Secret updates on 2026-10-23; this does not authorize
# applying the production set or removing the legacy Stripe env entry ahead of that apply.
# A copy is the whole Secret, renamed only by `as`, and the set rewrites it on every reconcile.
#
# Copied, set level (both members):
#   oramasearch-dockerhub   .dockerconfigjson            every pod's imagePullSecrets (images.pullSecretName)
#   cloudflare-api-token-orama-ing  token, zoneID, accountID  CloudflareDNSRecord, KV namespaces, R2 buckets
#                                                        and the stack's Let's Encrypt DNS-01 Issuer
#                                                        (cloudflare.apiTokenSecretRef); limited to the orama.ing
#                                                        zone and the account's KV and R2 storage
# Copied, v1-eu member only (`secrets` under the member, so v1-us never receives them):
#   clerk-cloud-v1-prod (orama-system) publishableKey, secretKey  Cloud v1's own production Clerk instance
#   v1-prod-master-api-key  MASTER_API_KEY               masterAPIKeySecretRef -> writer, analytics processor,
#                                                        index-builder, workers, dashboard, and the target-local
#                                                        `c1` row (#447). Must equal Prod 1's
#                                                        oramacore_clusters.master_api_key; no Prod 1 row is copied.
#                                                        Prod 1's key is carried, as Steve's #411 review asks
#                                                        (Juan, 2026-10-17; the bridge's secrets.md is corrected).
#   v1-prod-llm-keys        OPENAI_API_KEY, GOOGLE_API_KEY, GROQ_API_KEY, ANTHROPIC_API_KEY
#                                                        engine, through llm.providers[].apiKeySecretRef
#                                                        (engine_llm.go llmKeySecretEnv); the workers read
#                                                        OPENAI_, GROQ_ and ANTHROPIC_API_KEY from the same
#                                                        references (#571); third-party keys.
#                                                        OpenAI preserved; Google carried from Prod 1;
#                                                        Groq has a dedicated Prod 2 key (#885, 2026-10-23).
#                                                        Juan deferred Anthropic: its existing placeholder
#                                                        is retained (accepted exception below).
#   v1-prod-dashboard-env   PRIVATE_API_KEY (dashboard machine routes; target-local callers must agree),
#                           STRIPE_WEBHOOK_SECRET (= Prod 1: the app.orama.com Stripe endpoint signs with it),
#                           CRON_SECRET, RESEND_API_KEY, SLACK_TOKEN, planned Clerk configuration
#                                                        dashboard, through components.dashboard.envFrom (#311).
#                                                        It never holds DATABASE_URL, POSTGRES_PASSWORD, JWT_*,
#                                                        or MASTER_API_KEY: the operator owns them and refuses them.
#                                                        Every member of this set is production (its clusters'
#                                                        purpose tag), so its dashboard is not rendered unless
#                                                        CRON_SECRET and STRIPE_WEBHOOK_SECRET come from a Secret
#                                                        like this one, crons on or off (#794), and its Stripe key
#                                                        comes from components.dashboard.stripeSecretKeySecretRef
#                                                        (#802, under Blocked below). Its legacy
#                                                        STRIPE_SECRET_KEY is removed only with the apply.
#                                                        CRON_SECRET is generated for Prod 2; the real
#                                                        webhook signing value is carried from Vercel
#                                                        production (#885, 2026-10-23).
#                                                        PRIVATE_API_KEY is a dedicated generated Prod 2
#                                                        value in this source; target-local callers share it.
#   v1-prod-dashboard-stripe STRIPE_SECRET_KEY             dashboard.stripeSecretKeySecretRef only;
#                                                        a restricted live key with docs/components.md's
#                                                        exact permissions, created/validated 2026-10-23 (#885).
# v1-us: nothing copied. Its master key is generated (#615) until the US migration names Prod 1's.
#
#   Not copied: AIRBYTE_WEBHOOK_SECRET and every AIRBYTE_* (Airbyte removed, bridge decisions 2026-10-16
#   #12a); Firebase keys (sign-in is Clerk before the cutover, decisions #1, #2).
#   Sign-in comes from the Clerk keys in orama-system/clerk-cloud-v1-prod (copied, v1-eu only; orama-bridge#250).
#   idp.provider stays unset: the operator reads it only for keycloak.
#
# Generated (never copied, never shared between members):
#   v1-eu-jwt               JWT_PRIVATE_KEY, JWT_PUBLIC_KEY   dashboard signs write tokens  (config.go ensureJWTSecrets)
#   v1-eu-jwt-pub           JWT_PUBLIC_KEY                     engine verifies               (config.go ensureJWTSecrets)
#   v1-eu-broker-admin      username, password                 broker only (#796)           (credentials.go ensureCredentialSecrets)
#   v1-eu-broker-users      writer-password, reader-password   RabbitMQTopology users; the writer and readers
#                                                              sign in as them (#99)        (datastore.go ensureBrokerSecrets)
#   v1-eu-broker-harvest    password                           RabbitMQTopology user harvest; harvest-master
#                                                              signs in as it (#824)        (datastore.go ensureBrokerSecrets)
#   v1-eu-cache-auth        password                           Redis, harvest-master, index-builder (credentials.go)
#   v1-eu-hpes (#574)       token                              HPES API_KEY, index-builder ORAMA_EMBEDDINGS_BEARER
#                                                              (credentials.go)
#   v1-eu-controldb-app     uri, password                      CNPG owner: index-builder, analytics processor,
#                                                              PostgresSchema, cluster-row Job, pgAdmin
#   v1-eu-controldb-dashboard username, password, uri          the dashboard role: dashboard DATABASE_URL/
#                                                              POSTGRES_PASSWORD (#99, controldb_roles.go)
#   v1-eu-analytics-api-key (#386)                             readers' reader_side.analytics and the analytics
#                                                              processor only (credentials.go)
#   v1-eu-redis-http       token                              Redis HTTP shim and dashboard (credentials.go)
#   v1-eu-harvest-sign     HARVEST_SIGN                       index-builder, harvest-master, dashboard
#                                                              SCRAPER_SIGNATURE (credentials.go)
#   v1-eu-harvest-notification NOTIFICATION_SIGNATURE          harvest-master (credentials.go)
#
# Derived:
#   JWT_ISSUER                     <- spec.jwtIssuer (config.go jwtIssuer)
#   writer audience                <- engine.writer.jwt.audiences, https://writer.orama.ing
#   MASTER_API_KEY in each consumer <- masterAPIKeySecretRef (credentials.go masterAPIKeyEnv)
#   POSTGRES_*, CLICKHOUSE_HOST/PORT, REDIS_*, RABBITMQ_*, TYPESENSE_HOST/PORT, ORAMACORE_*_URL
#                                  <- v1-eu-config ConfigMap (config.go reconcileBootstrap)
#   index-builder service URLs and Cloudflare KV namespace IDs <- ingestion.go indexBuilderEnv, owned KV CRs
#   index-builder CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID <- cloudflare-api-token-orama-ing `token`, `accountID`
#                                  through cloudflare.apiTokenSecretRef (#571)
#   dashboard NEXT_PUBLIC_APP_URL  <- https://<components.dashboard.host> (#572; the image must be built
#                                  without it)
#   dashboard ORAMACORE_PLACEMENT_CLUSTER_ID <- the `c1` row's id the cluster-row Job records (#572)
#   dashboard REDIS_CACHE_URL      <- http://v1-eu-redis-http, the serverless-redis-http shim (#562)
#   index-builder ORAMA_EMBEDDINGS_URL <- http://v1-eu-hpes:8787/v1/embeddings_b64, the stack's HPES (#574)
#   dashboard uploads endpoint/bucket/region/access keys <- v1-eu-uploads-r2, reconciled through the
#                                  owned CloudflareR2Bucket; verify provisioning before using uploads.
#
# Accepted exception (#885, Juan, 2026-10-23): retain the existing three-byte ANTHROPIC_API_KEY.
#   It is non-working; the rejected 108-byte Prod 1 candidate is not installed. The original
#   all-four-real-keys acceptance is unmet. Google and dedicated Groq passed read-only model listing;
#   the existing OpenAI value and default Groq selection are unchanged. This grants no set apply.
#
# Blocked (#570 generated credentials, #747 the remaining third-party keys,
# #573 the stack's own ingress-nginx, #574 HPES, #575 no tunnel ingress,
# #562 the Redis HTTP shim): required values this file cannot carry yet. Each needs its prerequisite first; none is
# worked around here, and no internal password is copied to bypass a missing generator.
#   Images: the template pins the newest build of every component by digest, the images v1-nonprod
#     runs (orama-bridge decisions 2026-10-23, 3, which replaces the release-tag requirement of
#     2026-10-17), and v1-eu adds the production dashboard built from public.env.v1-prod.
#   #570 makes ClickHouse, Typesense, cron, decrypter and index-builder's internal keys generated
#     by the operator. This set must wait for that code to roll and pass live proof before apply;
#     the 2026-10-23 read-only EU inspection found the old component Secret dev seeds still in use.
#     The dashboard deployment-API key contract still needs qualification:
#     DEPLOYMENT_API_API_KEY is not wired to the dashboard's PRIVATE_API_KEY.
#     HARVEST's one-shot worker has no launcher yet; verify its eventual credential wiring
#     separately. The index-builder/master/dashboard control key and Redis HTTP token are generated.
#   The dashboard's Stripe key (#802, LSR-140, #885): the v1-eu-only reference below is prepared,
#     and orama-system/v1-prod-dashboard-stripe now holds the validated restricted live key with
#     exactly docs/components.md's permissions ("The dashboard's Stripe key"). Lake bills in the same
#     account; its full key was not reused. With the later production-file apply, remove STRIPE_SECRET_KEY
#     from v1-prod-dashboard-env: a second key beside the reference is refused. Do not remove it early.
#   Third-party keys: the workers' SENTRY_DSN now takes a reference (components.workers.sentryDSNSecretRef,
#     #571), but this file sets no reference or member source copy. Select and validate the intended
#     source before wiring both; no absence of a credential elsewhere is implied.
#     Ably stays external (#747): ingestion.ablyKeySecretRef optionally supplies index-builder's
#     ABLY_API_KEY. Juan's latest decision (2026-10-23) leaves Ably on its current placeholder,
#     accepting deferred provider functionality. Production leaves this field unset; no new source
#     or member copy is declared. Future use requires a validated source and new operator/CRDs.
#     HARVEST's separate Ably seed remains until its worker launcher is implemented (#12).
#     APIFY_TOKEN and harvest-master's GITHUB_PAT/GHCR_TOKEN still wait on decisions in #747.
#   Outside-service decisions still required: Apify (#747), QStash (workers' QSTASH_TOKEN).
#     Uploads use the stack's owned R2 bucket; copied Prod 1 AWS credentials do not verify readiness.
#   Dashboard source: RESEND_API_KEY, SLACK_TOKEN and both Slack channels reuse Prod 1 Vercel
#     Production values, installed 2026-10-24 (orama-bridge#252, #253). EU invitation email and a
#     marked signup notification were delivered; Juan permits shared-channel posts before cutover.
#     S3_BUCKET_PREFIX and DATA_SOURCE_REQUEST_URL were three-byte placeholders on 2026-10-23.
#     PRIVATE_API_KEY is prepared in this source (64 hex characters); the target import consumer
#     reads the same dashboard source.
#     Clerk keys come from orama-system/clerk-cloud-v1-prod, copied only into v1-eu.
#     Its standalone Frontend API is clerk.orama.ing; dashboard sign-in stays on app.orama.ing/login.
#     controlDB.stripePrices carries Prod 1's live-mode price IDs (#378).
#     REDIS_CACHE_URL/TOKEN and NEXT_PUBLIC_APP_URL in envFrom are overridden by operator env entries;
#     uploads endpoint/bucket/region/access keys likewise use the owned R2 Secret once provisioned.
apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1Set
metadata:
  name: v1-prod
spec:
  clusters:
  # Hosts mirror Prod 1's names under orama.ing (app, collections, docs; Juan, 2026-10-24), one level
  # deep, which Cloudflare's *.orama.ing edge certificate covers. collections.orama.ing is the readers.
  # Customers keep reading through collections.orama.com, whose worker forwards to
  # ORAMACORE_READ_URLS.c1; the cutover runbook points that at https://collections.orama.ing and
  # repoints app.orama.com, which gets no DNS record from the operator (an extra host never does).
  # mcp.orama.com stays a Cloudflare worker: nothing in the stack serves MCP, so there is no mcp.orama.ing.
  - clusterRef: orama-production-cluster-02
    name: v1-eu
    namespace: v1-eu
    secrets:
    - name: v1-prod-master-api-key
      namespace: orama-system
    - name: v1-prod-llm-keys
      namespace: orama-system
    - name: v1-prod-dashboard-env
      namespace: orama-system
    - name: v1-prod-dashboard-stripe
      namespace: orama-system
    # Cloud v1's standalone production Clerk instance (orama-bridge#250).
    - name: clerk-cloud-v1-prod
      namespace: orama-system
    spec:
      profile: medium
      jwtIssuer: https://app.orama.ing
      masterAPIKeySecretRef:
        name: v1-prod-master-api-key
      # Prod 1's providers, models and selector. Keys come from v1-prod-llm-keys.
      llm:
        default: groq
        providers:
        - name: openai
          models: [gpt-5.2]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: google
          models: [gemini-2.0-flash-001]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: groq
          models: [openai/gpt-oss-120b]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        - name: anthropic
          models: [claude-sonnet-4-5]
          apiKeySecretRef: { name: v1-prod-llm-keys }
        automaticEmbeddingsSelector: { provider: openai, model: gpt-5.2 }
      cloudflare:
        manageLoadBalancers: false     # no geo load balancer across the members yet
      images:
        overrides:
          # The production dashboard: dashboard dev 79abacb3 (the new-device sign-in code, dashboard#190;
          # custom system prompts read from the writer, dashboard#192; GitHub sign-in hidden until #245,
          # dashboard#193) built with orama-cloud-v1-bridge build/images/dashboard/public.env.v1-prod
          # (app.orama.ing, standalone Cloud v1 Clerk); recorded in orama-cloud-v1-bridge#23.
          # Sentry uses the existing Orama project with environment v1-prod and release
          # dashboard@79abacb32d8461c06531ba7a906ab559890a907b (dashboard#194).
          dashboard: oramasearch/dashboard:v1-prod-79abacb3-sentry@sha256:de985a120bf7f28bb6690a9e02b34dabf12ce561eef5792b07fc0913ed7715a2
      # Every volume uses managed-csi-premium (Azure Premium SSD), a built-in AKS class; the cluster
      # default is Standard SSD. v1-eu was created as a sandbox on 10Gi Standard SSD volumes, which
      # cannot change class in place, so each volume approved its replacement once (approveDataDeletion,
      # orama-operator#920): on 2026-10-24 the operator erased the sandbox's volumes and created premium
      # ones. Every volume is now approveDataDeletion: false, before any customer data is copied into
      # v1-eu: a storage change the volume can't take in place is refused, never done by erasing it.
      components:
        engine:
          enabled: true
          envoy: true
          writer:
            gpu: false
            host: writer.orama.ing
            # Prod 1's writer root volume is 500 GiB (snapshot of vol-0b8dcc408f8ea762f, orama-bridge
            # production-changes.md; oramacore-aws terraform/live/prod/main.tf root_volume_size = 500)
            # with 343 GiB free on 2026-10-12 (techops-docs incident-2026-10-12-reader-stalls.md, "Host
            # storage"): about 157 GiB used, OS included. A larger size here grows the claim (#505).
            storage:
              size: 512Gi
              storageClassName: managed-csi-premium
              approveDataDeletion: false
            # jwksURL unset: the writer reads the dashboard's keys in-cluster. Prod 2 has one cluster
            # row, the operator's `c1`, whose writer_url the dashboard mints the audience from
            # (decisions 2026-10-16 #9).
            jwt:
              audiences:
              - https://writer.orama.ing
          reader:
            host: collections.orama.ing
            replicas: 2
            # Each reader's disk is 512Gi, #382's default: about twice the largest Prod 1 reader's use
            # (US, ~272 GiB of 931 GiB, OS included; bridge decisions 2026-10-17 #3). A larger size grows them (#505).
            storage:
              size: 512Gi
              storageClassName: managed-csi-premium
              approveDataDeletion: false
        dashboard:
          enabled: true
          host: app.orama.ing
          # app.orama.com is added as an extra host at the cutover, which decides whether it serves
          # the dashboard directly at cutover (orama-bridge#246). Until then it stays Prod 1's.
          envFrom:
          - secretRef: { name: v1-prod-dashboard-env }
          # Cloud v1's own Clerk application, with sign-in on /login. Public runtime values
          # match the image's build/images/dashboard/public.env.v1-prod inputs.
          env:
          - name: CLERK_SECRET_KEY
            valueFrom: {secretKeyRef: {name: clerk-cloud-v1-prod, key: secretKey}}
          - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            valueFrom: {secretKeyRef: {name: clerk-cloud-v1-prod, key: publishableKey}}
          - {name: NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL, value: https://app.orama.ing/auth/complete}
          - {name: NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL, value: https://app.orama.ing/auth/complete}
          stripeSecretKeySecretRef:
            name: v1-prod-dashboard-stripe
            key: STRIPE_SECRET_KEY
          # Prod 1's Vercel crons as CronJobs; the cutover sets suspend: false in this file.
          crons:
            enabled: true
            suspend: true
        docs:
          enabled: true
          host: docs.orama.ing
        controlDB:
          enabled: true
          mode: in-cluster
          # PlanetScale holds 531 MB on a 10 GB disk (techops-docs planetscale.md, 2026-07-07).
          storage:
            size: 10Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
          # Prod 1's live-mode Stripe prices, read from its subscription_plans and stripe_addon_prices
          # on 2026-10-24 (read-only); every ID is one of the operator's reference rows. Plans not listed
          # (base, base+, enterprise, open source) have no Stripe price on Prod 1 either.
          stripePrices:
            plans:
            - {id: 28c01974-de01-40a5-be0b-d640f060bbfe, monthly: price_1SZPClEY25vqz92s5Dje1uuN, yearly: price_1SZPD2EY25vqz92sEtxndqYW}   # build
            - {id: 46246ab8-4389-418f-a7f5-fb629cc659a6, monthly: price_1SZPDmEY25vqz92sQ5J55jpH, yearly: price_1SZPE2EY25vqz92suQh1Bd7P}   # scale
            addons:
            - {id: 2265b381-5458-4b25-9edb-237d746e87d5, priceID: price_1SZ19tEY25vqz92sbq4Vazy1}   # base ai_sessions_base
            - {id: eeb72c29-b8d1-477f-ade4-527bd682e4f5, priceID: price_1SZ1FXEY25vqz92suhajuO9r}   # base ai_sessions_premium
            - {id: 32ac1099-87ff-49e7-8140-7caf0438a8d9, priceID: price_1SZ1BtEY25vqz92sYnsCFoL2}   # base ai_sessions_pro
            - {id: c55f46f6-1f72-4670-aaed-47defd3852ef, priceID: price_1SZ16FEY25vqz92sJxQCDZZJ}   # base extra_documents
            - {id: 3a549bbb-1c25-40bb-8077-f974e3c1f97e, priceID: price_1SZ114EY25vqz92sL0ZKdaJt}   # base extra_indexes
            - {id: ff6f4595-ad00-4f22-8c96-cee67c93306e, priceID: price_1SZ0xkEY25vqz92sOFOf4cHG}   # base extra_project
            - {id: 3a71548d-ccd5-4f94-a1e1-10e2a3d3a112, priceID: price_1SZ0Z3EY25vqz92scbxlNuJT}   # base few_shots_upgrade
            - {id: 086af6fd-3ab6-4e5d-b095-2a0625f865d1, priceID: price_1SZ19tEY25vqz92sWLJoXwba}   # build ai_sessions_base
            - {id: 174f95cc-02ce-4986-8b92-a103acf71281, priceID: price_1SZ1FXEY25vqz92s8IvAX1LU}   # build ai_sessions_premium
            - {id: 5d885a0e-2930-4dc0-8959-77b581b179ee, priceID: price_1SZ1BtEY25vqz92s5h6YKoLi}   # build ai_sessions_pro
            - {id: 313bcf6b-ba4a-472b-ac13-2666063e9477, priceID: price_1SZ16FEY25vqz92sJOM8FhYA}   # build extra_documents
            - {id: 0ce86e08-0ea4-4b8b-9baf-bac907fc836e, priceID: price_1SZ114EY25vqz92s451HdUK1}   # build extra_indexes
            - {id: 3c3b49f4-c664-4273-8d85-08d140e84e1a, priceID: price_1SZ0xkEY25vqz92sWTtCfeZ7}   # build extra_project
            - {id: 6daeda62-cbb6-47ee-9e65-41e09ba363e7, priceID: price_1SZ0VPEY25vqz92sSJMFomgI}   # build full_analytics
            - {id: c36ae842-1925-4c86-a2af-7ed590fba1be, priceID: price_1SZ0NyEY25vqz92sQgmBhgzQ}   # build raw_analytics
            - {id: eeec97e8-abd2-4982-9fb0-b14996c317a2, priceID: price_1SZ19tEY25vqz92soorDUd7l}   # scale ai_sessions_base
            - {id: ca92196f-a643-46ca-be46-8fe6cde5fa6f, priceID: price_1SZ1FXEY25vqz92sDQXhQbk6}   # scale ai_sessions_premium
            - {id: a128a420-7327-4ccd-afa6-3eee64b15635, priceID: price_1SZ1BtEY25vqz92sELkTghOC}   # scale ai_sessions_pro
            - {id: 94cffc17-9f12-4883-ade0-1d93012aea44, priceID: price_1SZ16FEY25vqz92sSINgudYi}   # scale extra_documents
            - {id: d47de792-ace8-4747-9ebf-bcf6c748e38f, priceID: price_1SZ114EY25vqz92sQZnsZgxP}   # scale extra_indexes
            - {id: fb125974-3077-4c83-b9c9-c6f1735873b9, priceID: price_1SZ0xkEY25vqz92s7VWQPdnD}   # scale extra_project
            - {id: 4d15ac28-b018-4dba-82fd-48e15d4080f5, priceID: price_1SZ0VPEY25vqz92s6YDI2M2D}   # scale full_analytics
            - {id: 71bc6838-1321-4c1d-af2a-dc732c1bb6c6, priceID: price_1SZ0SGEY25vqz92siRc8LMUl}   # scale raw_analytics
        analytics:
          enabled: true
          mode: in-cluster
          # 30 days kept, starting fresh (bridge decisions 2026-10-16 #4). ClickHouse Cloud's
          # oramacore_analytics_search_raw is 468.30 GiB for 16,979,167 rows, ~29.6 KB a row
          # (techops-docs clickhouse.md, 2026-07-07); 8,318,162 searches in 90 days (orama-bridge#138,
          # 2026-10-08) give ~82 GiB per 30 days. Doubled for headroom and rounded up.
          storage:
            size: 200Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
        analyticsProcessor:
          enabled: true
          # The cutover sets suspend: false in this file.
          import:
            enabled: true
            suspend: true
        cache:
          enabled: true
          mode: in-cluster
          # 10Gi, the default, on purpose: measuring Prod 1's Upstash Redis is deferred (bridge decisions
          # 2026-10-17 #22), and no source records its data size (techops-docs has only its billing,
          # evidence/upstash-billing-2026-07-08.md). The class is set now because it cannot change
          # later; the size can grow once Prod 1 is measured.
          storage:
            size: 10Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
        broker:
          enabled: true
          mode: in-cluster
          # The oramacore-operations stream is capped at 5 GB on Prod 1 (techops-docs aws.md) and by the
          # operator (datastore.go brokerOperationsStreamMaxBytes); four times the cap.
          storage:
            size: 20Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
        search:
          enabled: true
          mode: in-cluster
          # 10Gi, the default, on purpose: measuring Prod 1's Typesense is deferred (bridge decisions
          # 2026-10-17 #22), and no source records its data size. The class is set now because it
          # cannot change later; the size can grow once Prod 1 is measured.
          storage:
            size: 10Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
        ingestion:
          enabled: true
          harvest: true
          harvestMongoStorage:
            size: 10Gi
            storageClassName: managed-csi-premium
            approveDataDeletion: false
        workers:
          enabled: true
          replicas: 2
        searchWorkers:
          enabled: true
        # Prod 1's DISCO hosting is unconfirmed (its GCP project was deleted; techops-docs disco.md,
        # orama-bridge retirement-register R31), and the cutover plan does not move it.
        disco:
          enabled: false
        # No pgAdmin is recorded on Prod 1, whose control DB is PlanetScale (techops-docs planetscale.md;
        # the admin surface is open as orama-bridge Q25/R43).
        pgAdmin:
          enabled: false
