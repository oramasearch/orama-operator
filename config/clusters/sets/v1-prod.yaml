          enabled: true
          mode: in-cluster
          placement: local
        cache:
          enabled: true
          mode: in-cluster
          placement: local
        controlDB:
          enabled: true
          mode: in-cluster
          placement: local
        dashboard:
          enabled: false
        disco:
          enabled: true
        # One docs site, as on Prod 1: docs.orama.ing, from v1-eu.
        docs:
          enabled: false
        engine:
          enabled: true
          envoy: true
          reader:
            replicas: 1
          writer:
            gpu: false
        ingestion:
          enabled: true
          harvest: true
        oramasearchApp:
          enabled: false
          host: api.sandbox.local
        pgAdmin:
          enabled: true
        search:
          enabled: true
          mode: in-cluster
          placement: local
        searchWorkers:
          enabled: true
        workers:
          enabled: true
          replicas: 1
