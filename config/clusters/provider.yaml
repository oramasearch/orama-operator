# An example, in the shape of a real deployment. The values are not Orama's: every name,
# host and id is a placeholder. See README.md in this folder.
apiVersion: orama.cloud/v1alpha1
kind: KubernetesClusterProvider
metadata:
  name: azure-example
spec:
  aks:
    network:
      dataplane: cilium
      dnsServiceIP: 10.0.0.10
      plugin: azure
      pluginMode: overlay
      podCIDR: 10.244.0.0/16
      policy: cilium
      serviceCIDR: 10.0.0.0/16
    nodeOSUpgradeChannel: NodeImage
    osDiskSizeGB: 256
    resourceGroupSuffix: _group
    skuTier: Standard
    subscriptionID: 00000000-0000-0000-0000-000000000000
    upgradeChannel: patch
    workloadIdentity: true
  credentialsSecretRef:
    name: azure-cluster-management
    namespace: orama-system
  type: aks
