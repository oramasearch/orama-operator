# A LakeE2ETest as a cluster holds it: lake's end-to-end suite (oramasearch/lake-e2e,
# orama-operator#537) against the `testing` member of LakeSet lake-nonprod, on the cluster that runs
# that member (example-nonprod), where the member's Lake is the cluster-scoped Lake
# `testing` labelled orama.cloud/managed-by-set=LakeSet.lake-nonprod.
#
# The testing -> staging gate itself is not created from this file: it is the `testing-gate` entry
# of `spec.e2eTests` in config/clusters/sets/lake-nonprod.yaml, which the managing cluster's operator
# applies here with spec.member filled in (orama-operator#589, docs/lake/README.md#service-e2e).
#
# The controller waits for the Lake, its Postgres and its schema, then runs Job gate-e2e-<generation>
# in the Lake's namespace with:
#   LAKE_E2E_BASE_URL    http://lake-testing.lake-testing.svc.cluster.local (REST, MCP, liquid sync)
#   LAKE_E2E_PUBLIC_URL  https://lake-testing.example.net (the browser; Lake's cookie is Secure)
#   LAKE_E2E_RUN_ID      unique per run; names the test person and everything it creates
# The suite signs a fresh person up (never the admin bearer) and changes data only in that Lake.
#
# Watch:   kubectl get lakee2e testing-gate      (Phase, Pass, Fail, Skip)
# Reasons: kubectl get lakee2e testing-gate -o jsonpath='{.status.failed}'
# Logs:    kubectl logs -n lake-testing job/testing-gate-e2e-<generation>
# Re-run:  change spec.runID (e.g. to the release being gated) and apply; no delete needed.
apiVersion: orama.cloud/v1alpha1
kind: LakeE2ETest
metadata:
  name: testing-gate
spec:
  member:
    lakeSet: lake-nonprod
    name: testing
  image: oramasearch/lake-e2e:<tag>
  pullSecretName: oramasearch-dockerhub
  runID: "1"
  # For a Lake that signs people in with Clerk (orama-operator#541), give the runner the Clerk
  # instance's secret key so it can mint a one-time sign-in ticket for its test person:
  # (a LakeSet member gets that key as Secret clerk-secret-key, key secretKey, in its namespace):
  # env:
  # - name: LAKE_E2E_CLERK_SECRET_KEY
  #   valueFrom: {secretKeyRef: {name: clerk-secret-key, key: secretKey}}
