# What the managing cluster installs onto orama-nonprod-cluster-01 (operator#363), in the
# order it must happen: the operator's prerequisite first, then the operator. The operator
# installed is the same one every cluster runs.
#
# The OramaOperator does not need dependsOn: it reads the CRDs its version requires from its own
# chart and is not installed until the cluster has them. Apply both at once.
apiVersion: orama.cloud/v1alpha1
kind: ClusterHelmRelease
metadata:
  name: nonprod-cloudnative-pg
spec:
  clusterRef: orama-nonprod-cluster-01
  releaseName: cnpg
  namespace: cnpg-system        # the workspace NetworkPolicies name this namespace (docs/install.md)
  chart:
    repository: https://cloudnative-pg.github.io/charts
    name: cloudnative-pg
    version: 0.29.0             # operator 1.30.0, what the management cluster runs
    sha256: sha256:668e065ff53508d58238788fd35b355a925060843629a951df0e6a9362e6d32f  # the archive's bytes
---
apiVersion: orama.cloud/v1alpha1
kind: OramaOperator
metadata:
  name: orama-nonprod-cluster-01
spec:
  clusterRef: orama-nonprod-cluster-01
  version: v0.7.3               # the operator version the leaf runs; its chart must be published
  # The image and the chart published for that version, by the digests of their bytes.
  imageDigest: sha256:ce339674a3a0cea4e9809786adca45451a95d62dd79f6ac69b8c0aa3b7ec37dc
  chartSHA256: sha256:62364e3eb1df7d90ea97f9b0d9b19c38b250e66c6c8c5a88d890ff15d6770f2f
  imagePullSecretRef:
    name: oramasearch-dockerhub
    namespace: orama-system
