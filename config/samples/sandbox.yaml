# Single-node sandbox — validated on AKS (2026-07-08). A light, CPU-only deployment that pulls
# the private component images from Docker Hub via a pull secret. Exercises every private image
# (engine + embeddings sidecar, dashboard, docs, disco, workers, ingestion) without the GPU or a
# multi-node footprint.
#
# Prereqs:
#   - Build + push the images:  REGISTRY=oramasearch TAG=v1-sandbox <bridge>/build/images/build.sh --push
#   - Create the pull secret:
#       kubectl create secret docker-registry oramasearch-dockerhub -n orama-system \
#         --docker-server=https://index.docker.io/v1/ \
#         --docker-username=<user> --docker-password=<read-only-token>
apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1
metadata:
  name: v1
  namespace: orama-system
spec:
  region:
    name: us-east
    role: primary
  profile: light
  # The engine master key, supplied as a Secret in this namespace (the operator never generates
  # one). It must equal the control database's oramacore_clusters.master_api_key; without it the
  # writer and readers stay at zero replicas and Ready names the cause.
  masterAPIKeySecretRef:
    name: v1-master-api-key   # key defaults to MASTER_API_KEY
  idp:
    provider: none
  images:
    registry: oramasearch
    tag: v1-sandbox                    # applies to the operator's OWN built images only
    pullSecretName: oramasearch-dockerhub
    # No per-image overrides needed (both are reused PUBLIC images, resolved off the sandbox tag):
    #   - oramacore  -> oramasearch/oramacore:latest             (the engine)
    #   - embeddings -> oramasearch/oramacore-ai-server:latest   (engine ai-server :50051; -cuda if writer.gpu)
  llm:
    default: groq
    providers:
      - { name: groq, models: [llama-3.3-70b-versatile] }
  cloudflare:
    enabled: false
  demoSeed: false
  components:
    engine:
      enabled: true
      writer: { gpu: false }           # no GPU node on the sandbox -> CPU embeddings
      reader: { replicas: 1 }
      envoy: true
    # No hosts, so no Ingresses: every Ingress gets a Let's Encrypt certificate (DNS-01), so a host
    # must be in a Cloudflare zone and needs cloudflare.apiTokenSecretRef (origin TLS, #457).
    dashboard: { enabled: true }
    docs:      { enabled: true }
    disco:     { enabled: true }
    workers:   { enabled: true, replicas: 1 }
    ingestion: { enabled: true, harvest: true }
    # Data stores use PUBLIC images. Enabling them needs more than one small node; enable as
    # capacity allows (they are what disco/ingestion/dashboard connect to at runtime).
    controlDB: { enabled: false }
    analytics: { enabled: false }
    cache:     { enabled: false }
    broker:    { enabled: false }
    search:    { enabled: false }
