apiVersion: orama.cloud/v1alpha1
kind: Lake
metadata:
  name: hello
spec:
  namespace: lake-dev
  # The lake image is private: pull it with a Secret that exists in spec.namespace.
  image: oramasearch/lake:v1-sandbox
  pullSecretName: oramasearch-dockerhub
  replicas: 2
  # Defaults are requests 50m CPU / 128Mi memory and a 512Mi memory limit. Production can replace
  # the complete block. CPU limits are intentionally opt-in.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Replicated Lakes default to a soft hostname spread. Set this list to replace that policy; set
  # it to [] to disable the default.
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/instance: hello
  # Every lake pod mounts one shared customer-store root. The generated claim defaults to 100Gi
  # ReadWriteMany. ReadWriteOnce requires replicas: 1. Set existingClaim to mount a claim without
  # the operator adopting or changing it.
  store:
    size: 100Gi
    accessModes: [ReadWriteMany]
    # existingClaim: lake-data
  # Lake runtime configuration not modeled as dedicated CR fields. Operator-managed environment
  # names, including LAKE_STORE_ROOT, cannot be overridden here.
  env:
    - name: LAKE_LOG_MODE
      value: air-gapped
  # Control plane: a CloudNativePG Postgres in spec.namespace, on by default (requires the CNPG
  # operator). The lake pods get LAKE_CONTROL_DB_URI from the generated lake-<name>-controldb-app
  # Secret.
  postgres:
    instances: 1
    storageSize: 50Gi
    # Control-plane backup to an R2/S3 Barman object store. The Secret must exist in
    # spec.namespace and contain s3ApiEndpoint, accessKeyId, and secretAccessKey.
    # backup:
    #   enabled: true
    #   schedule: "0 0 3 * * *"
    #   retention: 30d
    #   destination:
    #     bucket: lake-hello-backups
    #     # path defaults to lake-<name>/controldb; endpointURL defaults to the Secret endpoint.
    #     path: lake-hello/controldb
    #   secretRef:
    #     name: lake-hello-backups-r2
  # Data plane: an owned OramaZettaCluster in this namespace, on by default. The child inherits
  # pullSecretName. Lake receives its client Service and seeded admin token through
  # LAKE_DATA_PLANE_URL and LAKE_DATA_PLANE_TOKEN.
  zetta:
    # Pin an auth-capable image built after oramasearch/zetta#799.
    image: oramasearch/zetta:<auth-capable-tag>
    replicas: 1
    storage:
      size: 10Gi
    env:
      - { name: ZETTA_MALLOC_TRIM_THRESHOLD_BYTES, value: "134217728" }
      - { name: MALLOC_ARENA_MAX, value: "2" }
    reachability: dial-out-only
  # port defaults to 4900 (lake's --listen) and args to none: the image runs lake as built.
  # Before the lake image existed the hello-world stand-in was:
  #   image: hashicorp/http-echo:1.0
  #   port: 5678
  #   args: ["-listen=:5678", "-text=hello from lake hello"]
  # External exposure, same contract as OramaZettaCluster: ingressEnabled + host gives an nginx
  # Ingress; dnsSecretRef adds a proxied Cloudflare record. The Secret (keys: token, zoneID) must
  # live in spec.namespace and hold the zone of host: a example.com host needs a example.com-zone Secret.
  # ingressEnabled: true
  # host: hello.example.com
  # TLS terminates at nginx and enables HTTPS redirect. The kubernetes.io/tls Secret must exist in
  # spec.namespace before this is enabled.
  # tls:
  #   secretName: lake-origin-tls
  # dnsSecretRef:
  #   name: cloudflare-api-token
  # Per-change previews use one wildcard record instead of one Cloudflare record per change.
  # previewWildcard: preview.example.com
  # deploySync:
  #   interval: 15s
  # Every Lake runs every feature (apps, builds, methodologies, agents, services and stores,
  # workspaces, volume snapshots) with no switch, on the operator's default images
  # (internal/controller/lake_defaults.go, operator#539). Set an image only to override its default:
  # apps:
  #   runtimeImage: oramasearch/app-runtime:<tag>
  #   wildcard: apps.example.com   # empty: <app>.<spec.host>
  # builds:
  #   builderImage: oramasearch/lake-builder:<tag>
  # agents:
  #   library:
  #     - { key: agent-project, image: oramasearch/agent-project:<tag> }
