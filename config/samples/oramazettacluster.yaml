# Deploy a headless Orama Zetta cluster (equal-peer CRDT nodes) from one CR — step 1 of the One Orama
# plan (oramasearch/orama-bridge#130). The operator creates a StatefulSet of `replicas` headless zetta
# nodes (each with a per-node PVC at /data), a headless Service for peer DNS (:7777), and a client
# Service for the HTTP API (:4800 — MCP + REST + serving). node-0 bootstraps; peers join it.
# With `host` set it also fronts the API/UI with an nginx Ingress + a proxied Cloudflare DNS record.
#
#   kubectl apply -f config/samples/oramazettacluster.yaml
#   kubectl get ozc -n orama-system            # Nodes / Desired / Phase / Image
#   kubectl logs -n orama-system zetta-0-zetta-0
#   curl https://zetta.oramadev.net/v1/server_info   # once host + DNS are set (below)
apiVersion: orama.cloud/v1alpha1
kind: OramaZettaCluster
metadata:
  name: zetta-0
  namespace: orama-system
spec:
  replicas: 1                                    # equal-peer headless nodes (start with 1)
  image: oramasearch/zetta:headless-v1-sandbox   # built + pushed via zetta-bridge/build/images/zetta-headless
  pullSecretName: oramasearch-dockerhub          # for the private zetta image
  storage:
    size: 10Gi                                   # per-node PVC at --data-dir (/data)
    # storageClassName: ""                        # empty = cluster default StorageClass
  # resources:                                    # right-size each node (mem/cpu)
  #   requests: { cpu: "500m", memory: "1Gi" }
  #   limits:   { cpu: "2",    memory: "4Gi" }
  clusterPlaintext: false                         # single node mints its own mTLS token; set true for
                                                  # a multi-node cluster until mTLS token-sharing lands
  host: zetta.oramadev.net                        # expose the API/UI (:4800) via an nginx Ingress
  dnsSecretRef:                                   # + a proxied Cloudflare DNS record (host → ingress LB)
    name: cloudflare-api-token                    # Secret with keys: token / zoneID / accountID
  # Elastic node capacity (operator#69) — OPT-IN. When enabled the operator owns a Karpenter NodePool
  # and pins the Zetta pods onto it (dedicated taint/toleration + pool nodeSelector), so raising
  # `replicas` past current node capacity leaves pods Pending → Karpenter provisions matching nodes →
  # the new pods schedule and join the CRDT cluster. Graceful no-op if Karpenter/NAP isn't installed.
  # capacity:
  #   karpenter:
  #     enabled: true
  #     nodeClassRef:                             # the platform-owned provider NodeClass (REQUIRED)
  #       group: karpenter.k8s.aws                #   EKS default; use karpenter.azure.com on AKS NAP
  #       kind: EC2NodeClass                      #   EKS default; use AKSNodeClass on AKS NAP
  #       name: default                           #   name of the EC2NodeClass/AKSNodeClass to launch from
  #     capacityType: on-demand                   # on-demand (default, stateful-safe) | spot
  #     arch: amd64                               # amd64 (default) | arm64
  #     # instanceTypes: ["m6i.large", "m6a.large"]   # optional pin; empty = Karpenter chooses (recommended)
  #     limits:                                   # cost/scale guardrail — Karpenter stops at these caps
  #       cpu: "16"
  #       memory: 64Gi
  #       nodes: 3
