# Deploy a headless Orama Zetta cluster (equal-peer CRDT nodes) from one CR — step 1 of the One Orama
# plan (oramasearch/orama-bridge#130). The operator creates a StatefulSet of `replicas` headless zetta
# nodes (each with a per-node PVC at /data), a headless Service for peer DNS (:7777), and a client
# Service for the HTTP API (:4800 — MCP + REST + serving). node-0 bootstraps; peers join it.
# With `host` set it also fronts the API/UI with an nginx Ingress + a proxied Cloudflare DNS record.
#
#   kubectl apply -f config/samples/oramazettacluster.yaml
#   kubectl get ozc -n orama-system            # Nodes / Desired / Phase / Reachability / Image
#   kubectl get ozc -n orama-system -o wide     # + WAN (the wan-accessible rendezvous address)
#   kubectl logs -n orama-system zetta-0-zetta-0
#   curl https://zetta.oramadev.net/v1/server_info   # once host + DNS are set (below)
apiVersion: orama.cloud/v1alpha1
kind: OramaZettaCluster
metadata:
  name: zetta-0
  namespace: orama-system
spec:
  replicas: 1                                    # equal-peer headless nodes (start with 1)
  image: oramasearch/zetta:headless-v1-sandbox   # built + pushed via zetta-bridge/build/images/zetta-headless
  pullSecretName: oramasearch-dockerhub          # for the private zetta image
  storage:
    size: 10Gi                                   # per-node PVC at --data-dir (/data)
    # storageClassName: ""                        # empty = cluster default StorageClass
  # resources:                                    # right-size each node (mem/cpu)
  #   requests: { cpu: "500m", memory: "1Gi" }
  #   limits:   { cpu: "2",    memory: "4Gi" }
  # Inter-node peer traffic is ALWAYS mTLS. The operator mints one shared cluster join token per cluster
  # (Secret zetta-0-zetta-cluster) and injects it into every node as ZETTA_CLUSTER_TOKEN, so all nodes
  # derive the same cluster CA and form ONE cluster (operator#92). There is no plaintext-peer option.

  # --- Node reachability (the corrected mesh model, oramasearch/zetta#739) ---
  # How siblings in the shared Zetta cluster reach THIS slice. Default: dial-out-only.
  reachability: dial-out-only                     # behind NAT / a private VNet — this slice DIALS OUT to
                                                  # the wan-accessible rendezvous(es) below and gets NO
                                                  # inbound LoadBalancer (exposePeerLoadBalancer is ignored).
  # clusterName: orama-zetta                       # the GLOBAL cluster name; siblings across k8s clusters share it
  externalPeers:                                  # the route table — wan-accessible rendezvous to dial OUT to
    - 20.242.132.125:7777                         #   (copy a sibling's .status.wanAddress here)
  # ephemeral: true                                # burst/autoscaled capacity expected to churn — always
                                                  #   dial-out-only; its membership blips aren't a fault.
  #
  # To make THIS slice a rendezvous instead (advertised as .status.wanAddress, consumed by siblings'
  # externalPeers + the Cloudflare LB origin pool, operator#73):
  #   reachability: wan-accessible
  #   hostNetwork: true                            #   host IP is the routable address (no LB needed), OR
  #   wanAddress: 20.242.132.125:7777              #   an explicit mesh-VPN / stable public address, OR
  #   exposePeerLoadBalancer: true                 #   a cloud LB public IP (wan-accessible ONLY)

  ingressEnabled: true                            # gate: create the nginx Ingress + landing + DNS below
  host: zetta.oramadev.net                        # the domain the API/UI (:4800) is exposed at
  dnsSecretRef:                                   # + a proxied Cloudflare DNS record (host → ingress LB)
    name: cloudflare-api-token                    # Secret with keys: token / zoneID / accountID
  # capacity:                                      # opt-in elastic node capacity (operator#69/#72/#75)
  #   karpenter:
  #     enabled: true                              # own a Karpenter NodePool + pin the Zetta pods onto it
  #     nodeClassRef:                              # the PLATFORM-owned provider NodeClass (referenced)
  #       name: zetta                              #   EC2NodeClass (EKS) / AKSNodeClass (AKS NAP)
  #     # --- operator-owned Karpenter install (operator#75), EKS only ---
  #     install: true                              # operator installs Karpenter itself (controller + CRDs)
  #     installClusterName: orama-eks-prod         # AWS settings.clusterName (required when install on EKS)
  #     controllerRoleARN: arn:aws:iam::123456789012:role/KarpenterController-orama-eks-prod
  #                                                # ^ CLOUD IAM PREREQ the operator can't mint — the
  #                                                #   controller's IRSA role. Missing ⇒ CloudIdentityMissing.
  #                                                #   See docs/karpenter-cloud-iam-prerequisite.md.
  # Elastic node capacity (operator#69) — OPT-IN. When enabled the operator owns a Karpenter NodePool
  # and pins the Zetta pods onto it (dedicated taint/toleration + pool nodeSelector), so raising
  # `replicas` past current node capacity leaves pods Pending → Karpenter provisions matching nodes →
  # the new pods schedule and join the CRDT cluster. Graceful no-op if Karpenter/NAP isn't installed.
  # capacity:
  #   karpenter:
  #     enabled: true
  #     nodeClassRef:                             # the platform-owned provider NodeClass (REQUIRED)
  #       group: karpenter.k8s.aws                #   EKS default; use karpenter.azure.com on AKS NAP
  #       kind: EC2NodeClass                      #   EKS default; use AKSNodeClass on AKS NAP
  #       name: default                           #   name of the EC2NodeClass/AKSNodeClass to launch from
  #     capacityType: on-demand                   # on-demand (default, stateful-safe) | spot
  #     arch: amd64                               # amd64 (default) | arm64
  #     # instanceTypes: ["m6i.large", "m6a.large"]   # optional pin; empty = Karpenter chooses (recommended)
  #     limits:                                   # cost/scale guardrail — Karpenter stops at these caps
  #       cpu: "16"
  #       memory: 64Gi
  #       nodes: 3
