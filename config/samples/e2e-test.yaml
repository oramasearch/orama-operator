# Run the oramacore-test-e2e suite against a deployed OramaCloudV1 stack. The controller creates a
# Job (from spec.image) pointed at the target's engine Services (<targetRef>-writer / -reader) and
# reflects pass/fail in .status.phase. Watch: kubectl get ocv1e2e -n orama-system
apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1E2ETest
metadata:
  name: v1-e2e
  namespace: orama-system
spec:
  targetRef: v1                                   # the OramaCloudV1 to test (same namespace)
  image: oramasearch/oramacore-test-e2e:latest    # the e2e suite image
  pullSecretName: oramasearch-dockerhub           # for the private test image
