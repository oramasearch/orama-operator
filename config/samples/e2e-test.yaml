# Run the comprehensive functional e2e suite against a deployed OramaCloudV1 stack. The controller
# ships an embedded curl+jq suite (internal/controller/assets/e2e-functional.sh) + a config.json in a
# ConfigMap pointing at the target's engine Services (<targetRef>-writer:8080 / <targetRef>-reader),
# and creates a Job whose runner installs curl+jq and runs the suite. The suite self-bootstraps a
# clean-slate collection+index (authenticating with MASTER_API_KEY from the target's
# spec.masterAPIKeySecretRef; the test waits in Pending until the target sets it) then asserts every critical OramaCore function in variations — search modes, filters,
# facets, sort, groupBy, CRUD/upsert/delete, replication canary, batch-get, KV, hooks, merchandising,
# MCP, analytics, answer/RAG — reflecting pass/fail in .status.phase.
# Watch:  kubectl get ocv1e2e -n orama-system
# Re-run: kubectl delete ocv1e2e v1-e2e -n orama-system && kubectl apply -f config/samples/e2e-test.yaml
apiVersion: orama.cloud/v1alpha1
kind: OramaCloudV1E2ETest
metadata:
  name: v1-e2e
  namespace: orama-system
spec:
  targetRef: v1                          # the OramaCloudV1 to test (same namespace)
  # image: alpine:3.20                   # optional runner-base override (default); must provide sh + a package manager
  pullSecretName: oramasearch-dockerhub  # authenticates image pulls (also avoids Docker Hub anon rate limits)
