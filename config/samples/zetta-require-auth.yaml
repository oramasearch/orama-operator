# Auth-enforcement profile for the Zetta e2e — a 3-replica OramaZettaCluster plus a ZettaClusterE2ETest
# that exercises the authz-enforcement assertions against it. Regression harness for the zetta auth work;
# see https://github.com/oramasearch/orama-cloud-v1-operator/issues/88.
#
# Auth is MANDATORY (oramasearch/zetta#799) — the engine gates every HTTP/MCP/SQL call on a bearer that
# resolves to a user, and the `--require-auth`/`--mcp-token`/`--cluster-plaintext` flags were REMOVED. So
# the operator ALWAYS (no spec field needed):
#   * mints a 64-hex admin token once into Secret `zetta-auth-zetta-admin` (key `token`), preserved
#     across reconciles (never rotated);
#   * injects it as env `ZETTA_ADMIN_TOKEN` and passes `--admin-token <token>` to every node, seeding it
#     as the owner principal; and
#   * authenticates its OWN Zetta SQL client (state sync + schema provisioning) with that token.
# The ZettaClusterE2ETest ALWAYS sets `ZETTA_E2E_REQUIRE_AUTH=1` + `ZETTA_E2E_TOKEN` (SecretKeyRef ->
# `zetta-auth-zetta-admin`/token) for the suite.
#
# MULTI-NODE: the e2e builds `ZETTA_E2E_PEER_URLS` from the target's replicas, so a `replicas: 3`
# target automatically exercises the authz path across all three nodes (writer node-0 + 2 read peers).
#
# IMPORTANT — image requirement: the target's image MUST be an auth-capable build (post-zetta#799). The
# old `oramasearch/zetta:headless-v1-sandbox` predates mandatory auth — pin an auth-capable image below.
#
# `spec.requireAuth` / `spec.mcpTokenAuth` are DEPRECATED no-ops (auth is enforced regardless).
#
#   kubectl apply -f config/samples/zetta-require-auth.yaml
#   kubectl get ozc  zetta-auth      -n orama-system      # Nodes / Desired / Phase
#   kubectl get ozce2e zetta-auth-e2e -n orama-system      # Phase / Pass / Fail / Skip
#   kubectl logs job/zetta-auth-e2e-e2e -n orama-system
apiVersion: orama.cloud/v1alpha1
kind: OramaZettaCluster
metadata:
  name: zetta-auth
  namespace: orama-system
spec:
  replicas: 3                                    # writer node-0 + 2 read peers (multi-node authz path)
  # image: oramasearch/zetta:headless-vX-auth    # MUST be an auth-capable build (post-zetta#799)
  pullSecretName: oramasearch-dockerhub          # for the private zetta image
  # Auth is mandatory — the admin token (Secret zetta-auth-zetta-admin) is always seeded + injected; no
  # spec field toggles it. Inter-node traffic is always mTLS via the shared cluster join token (Secret
  # zetta-auth-zetta-cluster, operator#92). NOTE: multi-node mTLS convergence additionally needs the
  # engine's DNS-dial + mTLS-sync fixes (oramasearch/zetta#785, #786).
  storage:
    size: 10Gi
---
apiVersion: orama.cloud/v1alpha1
kind: ZettaClusterE2ETest
metadata:
  name: zetta-auth-e2e
  namespace: orama-system
spec:
  targetRef: zetta-auth                          # the cluster above (same namespace)
  # levels: "2,3"                                # L3 authz enforcement runs against every target
  pullSecretName: oramasearch-dockerhub
