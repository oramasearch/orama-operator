# The chart archives and CRD manifests helmfile.yaml installs, pinned by the SHA-256 of their bytes
# (orama-operator#808). helmfile cannot check a digest, so it never downloads a chart: it installs
# the archives `go run ./hack/stagecharts` put in .platform-charts/ after checking each against its
# pin here. Each release in helmfile.yaml names its staged archive, <name>-<version>.tgz, and the
# TiDB hook its staged manifest, <name>-<version>-<file name>.
#
# These are the same pins every config/clusters/*/platform.yaml gives its ClusterHelmRelease
# (spec.chart.sha256, spec.crdSHA256): change a version or a pin here and there together, in the
# same pull request. cmd/platform_sync_test.go fails when they differ.
#
# A pin is the sha256 of the archive the repository serves for that version (helm pull, then
# sha256sum), which for these repositories is also the `digest` their index.yaml lists.
charts:
  - name: cloudnative-pg
    repository: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    sha256: sha256:668e065ff53508d58238788fd35b355a925060843629a951df0e6a9362e6d32f
