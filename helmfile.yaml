# ======================================================================================
# THIS FILE AND config/clusters/*/platform.yaml MUST SAY THE SAME THING.
#
# There are two installation paths, and they must produce the same cluster:
#
#   * The MANAGEMENT cluster is installed from THIS helmfile. Nothing else can install it:
#     it is the cluster the operator that manages the others runs on, so it has to exist
#     first.
#   * Every LEAF cluster is installed by the management cluster's operator, from the
#     ClusterHelmRelease and OramaOperator resources in config/clusters/<cluster>/.
#
# Same charts, same chart versions, same namespaces, same values, same operator version, on
# both paths. A change to one is not finished until the other has it:
#
#   change here                      ->  change every config/clusters/*/platform.yaml
#   change a ClusterHelmRelease      ->  change this file
#   new operator version on a leaf   ->  the same version on the management cluster
#
# cmd/platform_sync_test.go fails when they differ. docs/infrastructure/README.md, "Two
# installation paths, one result", is the full statement.
# ======================================================================================
#
# Composition layer: platform operators (upstream OSS charts) + the v1 operator.
# Usage: helmfile apply    (installs everything in order)
#        helmfile -l app=orama-operator apply   (just our operator)
#
# Platform operators we depend on:
#   - CloudNativePG  — REQUIRED. The control DB is a CNPG `Cluster` CR + managed roles +
#                      `Database` CR (controldb.go). CNPG is stable + well-maintained, so we
#                      reuse its native CRDs.
#   - ingress-nginx  — REQUIRED for external access: gives the operator's Ingresses a public
#                      LoadBalancer address (the Cloudflare DNS target, operator#38).
# RabbitMQ is deliberately NOT an operator dependency: it runs as a plain StatefulSet
# (datastore.go), and its topology/streams are modeled by OUR OWN CRDs (operator#41) — we
# dropped the bitnami RabbitMQ Cluster/Topology operators after their images 404'd (deprecated
# catalog). v1's ClickHouse/Redis/Typesense/Mongo likewise run as plain StatefulSets.
# Toggle any platform operator your cluster already provides to installed: false.
#
# Service operators (lake managed services, the contract is lake
# docs/control-plane/services.md). Each runs one kind of customer service; the Orama operator
# writes their resources from lake's control Postgres and never runs the databases itself. All are
# Apache 2.0, pinned, and watch every namespace (customer services live in the Lake's namespace):
#   - Strimzi              — Kafka (KRaft).
#   - Altinity             — ClickHouse (+ ClickHouse Keeper).
#   - PingCAP TiDB 1.6.x   — TiDB. Stable 1.x line, NOT the repo's main (v2); its CRDs are not in
#                            the chart and are applied by the presync hook below.
#   - K8ssandra            — Cassandra (Apache Cassandra images only). Needs cert-manager.
#   - valkey-io            — Valkey. PREVIEW: upstream says "not ready for production".
#   - cert-manager         — required for the operator's deployment HTTPS and K8ssandra webhooks.
# The release namespaces below (and cnpg-system) are the peers of the workspace NetworkPolicies in
# internal/controller/lake_workspace_datastore_policies.go (operator#268); move one, change both.

repositories:
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: strimzi
    url: https://strimzi.io/charts/
  - name: altinity
    url: https://helm.altinity.com
  - name: pingcap
    url: https://charts.pingcap.com/
  - name: k8ssandra
    url: https://helm.k8ssandra.io/stable
  - name: jetstack
    url: https://charts.jetstack.io
  - name: valkey
    url: https://valkey.io/valkey-helm
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: perses
    url: https://perses.github.io/helm-charts

releases:
  # ---- platform operators (building blocks the v1 operator reconciles against) ----
  # The release is named cnpg, as on the managing cluster and in every leaf's ClusterHelmRelease
  # (releaseName: cnpg). Under another name, a sync would install a second CloudNativePG (operator#753).
  - name: cnpg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: 0.29.0   # operator 1.30.0; the same pin every leaf's ClusterHelmRelease has
    installed: true   # REQUIRED — control DB is a CNPG Cluster CR + managed roles

  # ingress-nginx is being replaced by zetta-tunnel's ingress gateway, which the operator itself runs
  # on every cluster (docs/infrastructure/ingress.md). It stays here, and in every
  # config/clusters/*/platform.yaml, until every cluster's hosts are cut over; then it is removed
  # from all of them in one pull request.
  #
  # ingress controller with a Service type=LoadBalancer — the cloud provisions a public IP so the
  # operator's Ingresses (app./docs./api.) get an address for Cloudflare DNS to point at
  # (operator#38). ingressClassResource.default=true so operator Ingresses need no explicit class.
  - name: ingress-nginx
    namespace: ingress-nginx
    createNamespace: true
    chart: ingress-nginx/ingress-nginx
    version: 4.15.1   # the same pin every leaf's ClusterHelmRelease has
    installed: true
    set:
      - name: controller.service.type
        value: LoadBalancer
      - name: controller.ingressClassResource.default
        value: "true"
      # externalTrafficPolicy: Local — REQUIRED on AKS. With the default Cluster policy the Azure LB
      # HTTP-probes the ingress nodePort, gets a 404 (ingress default backend), marks the backend
      # UNHEALTHY, and drops all traffic → the public IP times out (HTTP 522 through Cloudflare).
      # Local makes k8s allocate a healthCheckNodePort that returns 200 only where a ready ingress
      # pod runs, so the Azure probe passes (and it preserves the client source IP). (operator#38)
      - name: controller.service.externalTrafficPolicy
        value: Local
    # The client address (operator#719, lake#838): nginx takes it from Cloudflare's CF-Connecting-IP
    # only when the connection comes from Cloudflare's published ranges
    # (https://www.cloudflare.com/ips/, read 2026-10-21), and from the TCP peer otherwise, so a
    # sender that reaches the ingress directly cannot choose its own address. nginx then sets
    # X-Real-IP, which lake's order sheet counts.
    values:
      - controller:
          # Reduce exposure while controller replacement remains blocked (#573).
          admissionWebhooks:
            enabled: false
          allowSnippetAnnotations: false
          # Only tenant app locations discard control-plane credentials. Lake's API,
          # console and wildcard handlers retain them; no per-Ingress snippets are enabled.
          proxySetHeaders:
            Authorization: $orama_app_authorization
            Cookie: $orama_app_cookie
          config:
            http-snippet: |
              map $ingress_name $orama_tenant_app {
                default 0;
                "~^app(-[0-9a-f]{12})?$" 1;
              }
              map $orama_tenant_app $orama_app_authorization {
                default $http_authorization;
                1 "";
              }
              map "$orama_tenant_app:$http_cookie" $orama_app_cookie {
                default $http_cookie;
                "~*^1:([[:space:]]*|.*[;,][[:space:]]*)(__Host-|__Secure-)?lake_session[[:space:]]*=" "";
              }
            enable-real-ip: "true"
            forwarded-for-header: CF-Connecting-IP
            proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

  # ---- service operators (lake managed services) ----
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.21.2
    labels:
      tier: service-operators
    set:
      - name: crds.enabled
        value: "true"

  - name: strimzi
    namespace: strimzi-system
    createNamespace: true
    chart: strimzi/strimzi-kafka-operator
    version: 1.2.0
    labels:
      tier: service-operators
    set:
      - name: watchAnyNamespace
        value: "true"
    # Every pod Strimzi creates (brokers, the entity operator) meets the `restricted` Pod Security
    # Standard. A lake workspace namespace enforces it, and without this the API server refuses
    # the broker pod and the Kafka never starts (operator#428).
    values:
      - extraEnvs:
          - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
            value: restricted

  - name: clickhouse-operator
    namespace: clickhouse-system
    createNamespace: true
    chart: altinity/altinity-clickhouse-operator
    version: 0.27.4
    labels:
      tier: service-operators
    # An empty watch.namespaces.include means the operator's OWN namespace only in 0.27.4 (it logs
    # "all watched namespaces" and never sees a ClickHouseInstallation elsewhere); ".*" watches all.
    values:
      - configs:
          files:
            config.yaml:
              watch:
                namespaces:
                  include: [".*"]

  - name: tidb-operator
    namespace: tidb-admin
    createNamespace: true
    chart: pingcap/tidb-operator
    version: v1.6.6
    labels:
      tier: service-operators
    # clusterScoped defaults to true. The chart does not carry the CRDs: apply the release's
    # own crd.yaml, server-side (the TidbCluster CRD is too large for client-side apply).
    hooks:
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - -f
          - https://raw.githubusercontent.com/pingcap/tidb-operator/v1.6.6/manifests/crd.yaml

  - name: k8ssandra-operator
    namespace: k8ssandra-operator
    createNamespace: true
    chart: k8ssandra/k8ssandra-operator
    version: 1.33.0
    labels:
      tier: service-operators
    needs:
      - cert-manager/cert-manager
    set:
      - name: global.clusterScoped
        value: "true"

  # PREVIEW: upstream's README says the operator is not ready for production and v1alpha1 may
  # change (0.6.0 already broke the TLS spec). lake labels the kind as a preview.
  - name: valkey-operator
    namespace: valkey-operator-system
    createNamespace: true
    chart: valkey/valkey-operator
    version: 0.6.0
    labels:
      tier: service-operators

  # ---- observability (operator#15): metrics, alerting and dashboards on every cluster ----
  # All Apache-2.0 (Prometheus, Alertmanager, prometheus-operator, kube-state-metrics,
  # node-exporter, Perses) or MIT (k8s-sidecar). Grafana, Loki, Mimir and Tempo are AGPL-3.0 and are
  # never installed: grafana.enabled is false, and cmd/platform_observability_test.go checks it.
  # The operator writes the rules, scrape configuration and dashboards of what it runs.
  - name: kube-prometheus-stack
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: 92.3.0   # prometheus-operator v0.94.1, Prometheus v3.15.0; the same pin every leaf has
    needs:
      - cert-manager/cert-manager
    values:
      - # Air-gapped (#15, #456): every image comes from Orama's private mirror of the upstream release,
        # oramasearch/platform-<name> at the upstream tag (docs/infrastructure/observability.md, "Images";
        # hack/observability-images.yaml lists each). A mirror that does not exist yet fails the pull: there
        # is no fallback to a public registry. The pull Secret is the cluster's own, copied into this
        # namespace (ClusterHelmRelease imagePullSecretRef; on the managing cluster, docs/install.md).
        global:
          imagePullSecrets:
            - name: oramasearch-dockerhub
        # Grafana is AGPL-3.0 and never shipped (#15): the chart installs it as a subchart by default.
        grafana:
          enabled: false
        # AKS runs the control plane, and Cilium replaces kube-proxy: there is nothing of these to
        # scrape, and their rules would fire TargetDown for ever.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
          # The overcommit pair asks whether every pod's requests would still fit with the largest node gone. Every
          # cluster autoscales its pools, so a lost node is replaced, not held spare: meeting them would keep
          # an idle node on each cluster. A pod that cannot be placed still pages, as KubePodNotReady after
          # 15 minutes (docs/infrastructure/observability.md). The quota pair fires when namespace quotas add up
          # to more than the nodes: Lake's workspace quotas are ceilings, meant to add up to more than the
          # cluster. A workspace at its own quota still pages, as KubeQuotaExceeded.
          disabled:
            KubeCPUOvercommit: true
            KubeMemoryOvercommit: true
            KubeCPUQuotaOvercommit: true
            KubeMemoryQuotaOvercommit: true
        prometheusOperator:
          image:
            registry: docker.io
            repository: oramasearch/platform-prometheus-operator
            tag: v0.94.1
          prometheusConfigReloader:
            image:
              registry: docker.io
              repository: oramasearch/platform-prometheus-config-reloader
              tag: v0.94.1
          # Not run (no Thanos sidecar); named so the operator's default points at the mirror too.
          thanosImage:
            registry: docker.io
            repository: oramasearch/platform-thanos
            tag: v0.42.4
          # cert-manager is on every cluster; no certificate Jobs.
          admissionWebhooks:
            certManager:
              enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        prometheus:
          prometheusSpec:
            image:
              registry: docker.io
              repository: oramasearch/platform-prometheus
              tag: v3.15.0-distroless
            # Durable on the cluster: 15 days or 45 GB on a 50 Gi volume, whichever is reached first.
            # Prometheus 3 sets its Go memory limit from the container's (auto-gomemlimit).
            retention: 15d
            retentionSize: 45GB
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
            # The operator's PodMonitors and PrometheusRules live beside what they watch, in any namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # The hub Prometheus' rules read federated series this one does not have
            # (internal/controller/observability_metrics.go); it alone evaluates them.
            ruleSelector:
              matchExpressions:
                - key: orama.cloud/metrics-scope
                  operator: NotIn
                  values: ["hub"]
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
        alertmanager:
          alertmanagerSpec:
            image:
              registry: docker.io
              repository: oramasearch/platform-alertmanager
              tag: v0.34.1
            # Each cluster's receivers come from its hub, through one AlertmanagerConfig the operator
            # writes (orama.cloud/alerting), which applies to every namespace's alerts.
            alertmanagerConfigSelector:
              matchLabels:
                orama.cloud/alerting: "true"
            alertmanagerConfigMatcherStrategy:
              type: None
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
        kube-state-metrics:
          image:
            registry: docker.io
            repository: oramasearch/platform-kube-state-metrics
            tag: v2.20.0
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The operator's own status as metrics: alerts say what a resource's status says
          # (docs/infrastructure/observability.md, "Alerting").
          rbac:
            extraRules:
              - apiGroups: ["orama.cloud"]
                resources: ["oramacloudv1s", "peerconnections"]
                verbs: ["list", "watch"]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind: {group: orama.cloud, version: v1alpha1, kind: OramaCloudV1}
                    metricNamePrefix: orama_oramacloudv1
                    labelsFromPath:
                      name: [metadata, name]
                      namespace: [metadata, namespace]
                    metrics:
                      - name: phase
                        help: The stack's phase.
                        each:
                          type: StateSet
                          stateSet:
                            labelName: phase
                            path: [status, phase]
                            list: [Progressing, Ready, Degraded]
                      - name: component_ready
                        help: 1 while the component is fully available.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, components]
                            labelsFromPath:
                              component: [name]
                            valueFrom: [ready]
                  - groupVersionKind: {group: orama.cloud, version: v1alpha1, kind: PeerConnection}
                    metricNamePrefix: orama_peerconnection
                    labelsFromPath:
                      name: [metadata, name]
                      namespace: [metadata, namespace]
                    metrics:
                      - name: phase
                        help: The peer's phase.
                        each:
                          type: StateSet
                          stateSet:
                            labelName: phase
                            path: [status, phase]
                            list: [Pending, Ready, Failed, Deleted]
        prometheus-node-exporter:
          image:
            registry: docker.io
            repository: oramasearch/platform-node-exporter
            tag: v1.12.1
            distroless: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi

  - name: perses
    namespace: monitoring
    createNamespace: true
    chart: perses/perses
    version: 0.23.3   # Perses v0.54.0
    needs:
      - monitoring/kube-prometheus-stack
    values:
      - # Air-gapped: images from Orama's private mirror, as kube-prometheus-stack's (helmfile.yaml).
        image:
          registry: docker.io
          name: oramasearch/platform-perses
          version: v0.54.0
        imagePullSecrets:
          - name: oramasearch-dockerhub
        # Dashboards come from ConfigMaps labelled perses.dev/resource=true, which the operator writes next
        # to what they show; nothing is edited by hand, so the server is read-only and keeps no volume.
        config:
          security:
            readonly: true
        sidecar:
          enabled: true
          image:
            registry: docker.io
            repository: oramasearch/platform-k8s-sidecar
            tag: 2.13.3
          allNamespaces: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        persistence:
          enabled: false
        # The chart's helm test pod pulls a public image; it is never installed or run.
        testFramework:
          enabled: false

  # NOTE — Orama Cloud v1's own datastores are unchanged: its broker is a plain StatefulSet whose
  # topology is driven by our own CRDs (operator#41), and its analytics is a plain
  # clickhouse-server StatefulSet, like Redis/Typesense/Mongo. The ClickHouse operator above serves
  # lake customer services only.

  # ---- the Orama Cloud v1 operator (this repo) ----
  # Carries the CRDs in chart/crds/ (OramaCloudV1 + OramaCloudV1E2ETest + the Cloudflare
  # DNS/KV/R2 resource CRDs). helm applies crds/ on INSTALL only — after adding/altering a
  # CRD, run `kubectl apply -f chart/crds/` to update an existing install.
  - name: orama-operator
    namespace: orama-system
    createNamespace: true
    chart: ./chart
    needs:
      - cert-manager/cert-manager
    labels:
      app: orama-operator
