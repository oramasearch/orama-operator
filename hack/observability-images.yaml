# Every image and chart the platform layer's monitoring (operator#15) runs, and where each must be
# mirrored before it can run air-gapped.
#
# Checked by: cmd/platform_observability_test.go (the platform charts, rendered offline from
# hack/charts/, use exactly the `platform` mirrors, each pod with a pull Secret).

charts:
  - chart: kube-prometheus-stack
    version: 92.3.0
    file: hack/charts/kube-prometheus-stack-92.3.0.tgz
    sha256: 48399b911fa91b353e0c3d5e32c1cb7a67a168566549723553154ffd7be5d1fa
    source: https://prometheus-community.github.io/helm-charts
    licence: Apache-2.0
  - chart: perses
    version: 0.23.3
    file: hack/charts/perses-0.23.3.tgz
    sha256: 3c4a779cfd5e45a5611daaa5da39cc1b5d4940930ce5e598ce6ed2ec88f93729
    source: https://perses.github.io/helm-charts
    licence: Apache-2.0

# The platform layer on every cluster. Each mirror is a private Docker Hub repository holding the
# upstream image at the upstream tag; the charts' values name the mirror and nothing else.
platform:
  - mirror: docker.io/oramasearch/platform-prometheus-operator:v0.94.1
    upstream: quay.io/prometheus-operator/prometheus-operator:v0.94.1
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-prometheus-config-reloader:v0.94.1
    upstream: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-thanos:v0.42.4
    upstream: quay.io/thanos/thanos:v0.42.4
    licence: Apache-2.0
    note: named as the operator's default only; no Thanos sidecar runs
  - mirror: docker.io/oramasearch/platform-prometheus:v3.15.0-distroless
    upstream: quay.io/prometheus/prometheus:v3.15.0-distroless
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-alertmanager:v0.34.1
    upstream: quay.io/prometheus/alertmanager:v0.34.1
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-kube-state-metrics:v2.20.0
    upstream: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-node-exporter:v1.12.1-distroless
    upstream: quay.io/prometheus/node-exporter:v1.12.1-distroless
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-perses:v0.54.0
    upstream: docker.io/persesdev/perses:v0.54.0
    licence: Apache-2.0
  - mirror: docker.io/oramasearch/platform-k8s-sidecar:2.13.3
    upstream: docker.io/kiwigrid/k8s-sidecar:2.13.3
    licence: MIT
